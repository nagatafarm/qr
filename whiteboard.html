<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホワイトボード｜なえログ</title>
<script>
// ホワイトボード（11H のホワイトボードと同じ形の、毎日の段取り。2026-11-23 近藤さんFB）。index.html?go=whiteboard の中にはめ込んで出す。
//   1日 ＝ 列。「場所＋業務」の枠（1H 出荷・3H 寄せ植え など）に、担当（社員）と人の札を置く。
//   枠のもとは計画：その日に予定がある作業を、工程ごとに「83TR・2件・必要2人」と出す（枠がまだない工程は、点線の「計画から」の枠で出る）。
//   「この作業が終わったら、こっち」は矢印で引く（札は元の枠に残る）。
//   置いたものは窓口（ホワイトボード.gs）が、スケジュール用のスプレッドシートの「ホワイトボード」シートに残す。直せるのは計画担当だけ。
// ?demo=1 … 見本（保存しない。枠は人の一覧と出勤からその場で作る）。?mock=1 … 手元の試験（wb_mock.json）
(function () {
  const q = location.search, embed = /[?&]embed=1(&|$)/.test(q), test = /[?&](demo|mock)=1(&|$)/.test(q);
  if (!embed && !test && window.top === window.self) { location.replace('index.html?go=whiteboard'); return; }
  if (embed) { document.documentElement.classList.add('embed'); const b = document.createElement('base'); b.target = '_top'; document.head.appendChild(b); }
})();
</script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="viewsync.js"></script>
<style>
  :root { --green: #4f9363; --green-d: #2f6b3a; --green-l: #f0f6f1; --orange: #d4834a; --line: #dfe5e0; --gray: #6b6b6b; --red: #c33; --bg: #f6f7f5; --board: #fff; --arrow: #4262ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: #222; font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; }
  button, select, input { font-family: inherit; }
  header { background: var(--green); color: #fff; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  header h1 { font-size: 17px; margin: 0; }
  header a { color: #fff; font-size: 13px; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 4px 10px; text-decoration: none; }
  html.embed header { display: none; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
  .bar button { background: #fff; border: 1px solid #bbb; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .bar button.on { background: #333; color: #fff; border-color: #333; }
  .bar .ttl { font-size: 18px; font-weight: bold; }
  .bar .sp { flex: 1; }
  .bar .note { background: #fff6c8; border: 1px solid #e8d48a; color: #5a4800; border-radius: 8px; padding: 3px 10px; font-size: 12px; }
  .bar .sv { font-size: 12px; color: var(--gray); }
  .bar .sv.err { color: var(--red); font-weight: bold; }
  .bar .vsw { display: inline-flex; border: 1px solid #bbb; border-radius: 999px; overflow: hidden; }
  .bar .vsw a { padding: 5px 14px; font-size: 13px; color: #333; text-decoration: none; white-space: nowrap; background: #fff; }
  .bar .vsw a + a { border-left: 1px solid #bbb; }
  .bar .vsw a.on { background: var(--green-l); color: var(--green-d); font-weight: bold; }
  .legend { font-size: 12px; color: var(--gray); display: flex; gap: 6px; align-items: center; }
  /* キャンバス（Miro のような点の方眼） */
  #board { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: stretch; background-color: #f5f6f8; background-image: radial-gradient(#c9ccd4 1px, transparent 1px); background-size: 18px 18px; padding: 22px; gap: 22px; }
  body.arrow #board { cursor: crosshair; }
  /* 1日 ＝ ホワイトボードの1列 */
  .day { flex: none; width: 286px; }
  body.c2 .day { width: 470px; }
  /* 2列：日の中に枠を2列に並べる */
  body.c2 .day .body { display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 34px 48px; }
  body.c2 .day .body > .add { grid-column: 1 / -1; }
  .day {  background: rgba(255,255,255,.72); border: 1px solid #e3e5ea; border-radius: 14px; display: flex; flex-direction: column; box-shadow: 0 2px 10px rgba(30,40,60,.06); backdrop-filter: blur(2px); }
  .day.today { border-color: #4262ff; box-shadow: 0 0 0 2px rgba(66,98,255,.18), 0 2px 10px rgba(30,40,60,.06); }
  .day.past { opacity: .75; }
  .day .dh { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px 8px; border-bottom: 1px solid #eceef2; }
  .day .dh .d { font-size: 20px; font-weight: bold; line-height: 1; color: #1f2430; }
  .day .dh .w { background: #eef0f5; color: #555c6b; border-radius: 6px; padding: 1px 7px; font-weight: bold; font-size: 12px; }
  .day .dh .w.sun { background: #fdecec; color: #c44; } .day .dh .w.sat { background: #e8f0fb; color: #2f6fb7; }
  .day .dh .n { margin-left: auto; font-size: 11px; color: var(--gray); text-align: right; }
  .day .body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 22px; display: flex; flex-direction: column; gap: 26px; position: relative; }
  .day .body svg.arw { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 2; }
  .day .body svg.arw path.ln { fill: none; stroke: var(--arrow); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
  .day .body svg.arw path.ln.pr { stroke-dasharray: 5 4; }
  .day .body svg.arw path.ln.on { stroke: #e5252a !important; stroke-width: 3.4; stroke-dasharray: none; }
  .day .body svg.arw g.tag { pointer-events: all; cursor: pointer; }
  .day .body svg.arw g.tag rect { fill: #4262ff; }
  .day .body svg.arw g.tag text { fill: #fff; font-size: 10px; font-weight: bold; }
  .day .body svg.arw g.tag.bk rect { fill: #5b6170; }
  .day .body svg.arw g.tag.on rect { fill: #e5252a; }
  .day .body svg.arw path.hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  .day .body svg.arw path.hit:hover + path.ln { stroke-width: 3.6; }
  .day .body svg.arw circle { fill: #fff; stroke: var(--arrow); stroke-width: 2; }
  /* 業務から業務への矢印（枠ごと次へ）：灰色の太い線 */
  .day .body svg.arw path.ln.bk { stroke: #5b6170; stroke-width: 3.2; }
  .day .body svg.arw circle.bk { stroke: #5b6170; }
  /* 枠 ＝ 「1H 出荷」の見出しと、その下の札 */
  /* 枠：白いカード（Miro の付せん・カードの見え方） */
  .blk { border-radius: 9px; padding: 6px 7px 7px; position: relative; z-index: 1; background: #fff; border: 1px solid #e3e5ea; box-shadow: 0 1px 4px rgba(30,40,60,.08); }
  .blk.auto { border: 1.5px dashed #c7cbd4; background: rgba(255,255,255,.55); box-shadow: none; }
  .blk.drop, .tray.drop { background: #e8f1ff; outline: 2px dashed #6c9bd8; }
  .blk .bh { display: flex; align-items: baseline; gap: 5px; font-size: 13px; font-weight: bold; color: #1f2430; }
  .blk .bh .grip { color: #b5bac5; font-size: 11px; cursor: grab; letter-spacing: -2px; }
  .blk.dragging { opacity: .4; }
  /* 矢印のつまみ：枠にマウスを乗せると4辺の真ん中に小さな丸。そこから行き先の枠へ引っぱる（Miro と同じ） */
  .hd { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: #fff; border: 2px solid #4262ff; opacity: 0; z-index: 6; cursor: crosshair; touch-action: none; transition: opacity .12s, transform .12s; }
  .hd:hover { transform: scale(1.35); background: #4262ff; }
  .hd.t { top: -6px; left: calc(50% - 6px); } .hd.b { bottom: -6px; left: calc(50% - 6px); }
  .hd.l { left: -6px; top: calc(50% - 6px); } .hd.r { right: -6px; top: calc(50% - 6px); }
  body.can:not(.linking) .blk:not(.auto):hover > .hd { opacity: 1; }
  /* 名前の札のつまみ（その人だけ途中からこっちへ） */
  .mg { position: relative; }
  .mg .hdm { position: absolute; right: -5px; top: calc(50% - 5px); width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 2px solid #4262ff; opacity: 0; cursor: crosshair; touch-action: none; z-index: 6; }
  .mg .hdm:hover { background: #4262ff; }
  body.can .mg:hover .hdm { opacity: 1; }
  @media (hover: none) { body.can .blk:not(.auto) > .hd { opacity: .55; } body.can .blk .mg .hdm { opacity: .55; } }
  .blk.target { outline: 3px solid #4262ff; outline-offset: 2px; background: #eef2ff; }
  .blk.target::after { content: 'ここへつなぐ'; position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: #fff; background: #4262ff; border-radius: 6px; padding: 1px 6px; }
  #tmp { position: fixed; inset: 0; pointer-events: none; z-index: 40; width: 100vw; height: 100vh; }
  #tmp path { fill: none; stroke: #4262ff; stroke-width: 2.4; stroke-dasharray: 6 4; }
  .blk .bh.ed { cursor: pointer; }
  .blk .bh .pl { color: var(--green-d); }
  .blk .bh .nt { font-size: 11px; color: var(--gray); font-weight: normal; }
  .blk .bh .x { margin-left: auto; font-size: 11px; color: #999; font-weight: normal; white-space: nowrap; }
  .blk .bh .x.short { color: var(--red); font-weight: bold; }
  .blk .wk { font-size: 10px; color: #555c6b; background: #f3f5f9; border-radius: 6px; padding: 2px 6px; margin: 3px 0; cursor: pointer; }
  .blk .wk b { color: #222; }
  .blk .wk .auto { color: var(--orange); font-weight: bold; }
  .blk .wk.memo { background: #fff6cc; color: #6b5300; cursor: default; }
  .blk .pls { font-size: 11px; margin: 2px 0 4px; border-left: 3px solid #cfe0d2; padding-left: 6px; }
  .blk .pls div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk .pls .done { color: #999; text-decoration: line-through; }
  .blk .lead { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; min-height: 22px; font-size: 10px; color: var(--gray); margin: 2px 0; }
  .blk .lead > span.lb { margin-right: 2px; }
  .blk .mem { display: flex; flex-wrap: wrap; gap: 3px; min-height: 24px; }
  .blk .mem:empty::before { content: '名前の札をここへ'; color: #bbb; font-size: 10px; align-self: center; }
  /* 名前の札（マグネット）。社員は緑の枠、実習生は青い字 */
  .mg { display: inline-flex; align-items: center; height: 22px; padding: 0 6px; background: #fff; border: 1.5px solid #d9dce3; border-radius: 6px; font-size: 12px; font-weight: bold; color: #b0322b; user-select: none; letter-spacing: .06em; box-shadow: 0 1px 2px rgba(30,40,60,.10); white-space: nowrap; }
  body.can .mg { cursor: grab; }
  .mg.staff { border-color: #7cc456; color: #1f3d8a; background: #f3f9ee; }
  .mg.trainee { color: #1a5fb4; border-color: #8fb4e6; }
  .mg.sel { outline: 3px solid var(--orange); }
  .mg.placed { opacity: .5; border-style: dashed; }
  .mg.placed::after { content: attr(data-c); font-size: 9px; color: #fff; background: #8a8f99; border-radius: 999px; padding: 0 4px; margin-left: 4px; }
  .mg.dup::after { content: attr(data-c); font-size: 9px; color: #fff; background: var(--orange); border-radius: 999px; padding: 0 4px; margin-left: 4px; letter-spacing: 0; }
  .add { border: 1px dashed #aaa; background: none; color: #777; border-radius: 6px; padding: 4px; cursor: pointer; font-size: 12px; }
  /* まだ置いていない人（その日に出勤する人） */
  .tray { border-top: 1px dashed #d4d7de; padding: 8px 10px 10px; background: rgba(245,246,248,.9); border-radius: 0 0 14px 14px; max-height: 34%; overflow-y: auto; flex: none; }
  .tray .tt { font-size: 10px; color: var(--gray); margin-bottom: 4px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px; }
  .tray .tt .tw { display: inline-block; font-size: 12px; transition: transform .15s; }
  /* 区分の切り替え（社員・パート・実習生） */
  .tray .kinds { display: flex; gap: 4px; margin: 2px 0 6px; }
  .tray .kinds button { border: 1px solid #ccd0d8; background: #fff; border-radius: 999px; padding: 1px 10px; font-size: 11px; cursor: pointer; color: #444; font-family: inherit; }
  .tray .kinds button.on { background: #4262ff; border-color: #4262ff; color: #fff; font-weight: bold; }
  .tray.shut .kinds { display: none; }
  .tray.shut .tt { margin-bottom: 0; }
  .tray.shut .tt .tw { transform: rotate(-90deg); }
  .tray.shut .mem { display: none; }
  .tray .mem { display: flex; flex-wrap: wrap; gap: 3px; }
  .muted { color: var(--gray); font-size: 12px; }
  /* 入力の画面（場所・業務・メモ） */
  #frm { position: fixed; inset: 0; z-index: 60; background: rgba(20,24,34,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #frm[hidden], #frm [hidden] { display: none !important; }
  #frm .lt { display: flex; align-items: center; }
  #frm .box { background: #fff; border-radius: 14px; width: min(380px, 100%); padding: 18px 18px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 10px; }
  #frm h3 { margin: 0 0 2px; font-size: 16px; }
  #frm label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #444; font-weight: bold; }
  #frm .req { color: #fff; background: var(--red); border-radius: 4px; font-size: 10px; padding: 0 5px; margin-left: 6px; font-weight: normal; display: inline-block; }
  #frm label { position: relative; }
  #frm .opt { color: var(--gray); font-weight: normal; font-size: 10px; margin-left: 6px; }
  #frm input, #frm select { font-size: 15px; padding: 8px 10px; border: 1px solid #ccd0d8; border-radius: 8px; font-weight: normal; }
  #frm input:focus, #frm select:focus { outline: 2px solid #4262ff; border-color: #4262ff; }
  #frm .err { color: var(--red); font-size: 12px; margin: 0; min-height: 1em; }
  #frm .btns { display: flex; gap: 8px; align-items: center; }
  #frm .btns .sp { flex: 1; }
  #frm .btns button { border: 1px solid #ccd0d8; background: #fff; border-radius: 8px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  #frm .btns .ok { background: #4262ff; border-color: #4262ff; color: #fff; font-weight: bold; }
  #frm .btns .del { color: var(--red); border-color: #f0b4b4; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  #toast.show { opacity: 1; }
  @media (max-width: 700px) { .day { width: 86vw; } .legend { display: none; } }
  .mg.lk { cursor: not-allowed; }
</style>
</head>
<body>
<header><h1>ホワイトボード</h1><a href="index.html?go=whiteboard">なえログで開く</a></header>
<div class="bar">
  <button type="button" id="today">今日</button><button type="button" id="prev">‹</button><button type="button" id="next">›</button>
  <span class="ttl vs-ttl" id="ttl" role="button" tabindex="0" title="押すと、日を選んで飛べます"></span><span id="vsbtn"></span>
  <span class="note" id="mode" hidden></span>
  <span class="sv" id="sv"></span>
  <span class="sp"></span>
  <button type="button" id="cols" title="日の中の枠を2列に並べる・1列にもどす">枠を2列に</button>
  <button type="button" id="arrow" style="display:none" title="人の札（途中からこっち）か、枠の見出し（業務が終わったらこっち）をつかんで、行き先の枠へ落とす（スマホは札を押してから枠を押す）。矢印を押すと消せる">→ 矢印を引く</button>
  <span class="legend"><span class="mg staff">社員</span><span class="mg">パート</span><span class="mg trainee">実習生</span></span>
  <span class="vsw"><a href="index.html?go=calendar">カレンダー</a><a href="index.html?go=whiteboard" class="on">ホワイトボード</a><a href="index.html?go=schedule">人の割り振り表</a></span>
</div>

</form></div>

<script>
const Q = location.search;
const MOCK = /[?&]mock=1(&|$)/.test(Q), DEMO = /[?&]demo=1(&|$)/.test(Q), TRY = MOCK || DEMO;
const BIZ = ['播種', 'ポット入れ', '土入れ', '土並べ', '接ぎ木', '鉢上げ', '薬散', 'ラベル差し', '出荷', '店振り', '箱作り', '寄せ植え', '除草', 'その他'];
const DAYS = 7;
let S = null;          // { days, people, cap, boards:{日:[枠]}, work:{日:[工程の作業]} }
let start = '';
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.className = 'show'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2400); };
const num = h => String(Math.round(Number(h) * 10) / 10);
const addDays = (k, n) => new Date(Date.parse(k + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
function localToday() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// 直せるか：計画担当でログインしている。見本・試験ではいつでも（保存はしない）
let stale = false;   // 前に読んだ中身を出している間（読み直しが届くまで）は、直せない
// パートさんの札を動かせるか（「部署」シートの「パート割り振り」。2026-11-24）。分からないとき（前のログイン）は動かせる。窓口でも確かめる
function canPart() { if (TRY) return true; try { return canEdit() && authCaps().part !== false; } catch (e) { return false; } }
const lockedN = n => { if (!canEdit() || canPart()) return false; const p = S.people.find(x => x.name === n), k = p ? p.kubun : ''; return !!k && !/社員|取締役/.test(k); };   // 窓口（partNames_）と同じ決め方
function canEdit() { if (TRY) return true; if (stale) return false; try { return !!(authToken() && authCaps().planner); } catch (e) { return false; } }
const kindOf = n => { const p = S.people.find(x => x.name === n); const k = p ? p.kubun : ''; return /社員|取締役/.test(k) ? 'staff' : /実習/.test(k) ? 'trainee' : ''; };
const short = n => String(n).split(/[\s　]/)[0].slice(0, 4);   // 札は姓だけ（ホワイトボードと同じ）
let seq = 1;
const newId = () => 'w' + Date.now().toString(36).slice(-5) + (seq++);

// ---- 読む ----
function demoBoards(s) {
  let seed = 3; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const pat = [['1H', '出荷'], ['', '接ぎ木'], ['16H', '出荷', 'AM'], ['', '除草'], ['3H', '寄せ植え'], ['PV', '出荷'], ['4H', 'その他', '床そうじ'], ['12H', '鉢上げ'], ['7H', 'その他', '種とり'], ['F12', '出荷'], ['1H', '土並べ']];
  const boards = {};
  s.days.forEach((d, i) => {
    const pres = s.people.filter(p => (s.cap[p.name] || {})[d.key] > 0);
    const staff = pres.filter(p => /社員/.test(p.kubun)).map(p => p.name), part = pres.filter(p => !/社員|取締役/.test(p.kubun)).map(p => p.name);
    const n = 5 + Math.floor(rnd() * 3), list = [];
    for (let k = 0; k < n; k++) { const x = pat[(i * 2 + k) % pat.length]; list.push({ id: newId(), place: x[0], biz: x[1], major: '', note: x[2] || '', lead: [], mem: [], next: {} }); }
    staff.slice(0, n).forEach((nm, k) => list[k].lead.push(nm));
    part.slice(0, Math.floor(part.length * 0.85)).forEach((nm, k) => list[k % n].mem.push(nm));

      const d = elbow(pts, 10), key = b.id + '|' + n, on = selArw === key;
      const a = { x: pts[0][0], y: pts[0][1] };
      const to = bl.find(x => x.id === b.next[n]) || {};

      tags += `<g class="tag${on ? ' on' : ''}" data-arw="${esc(key)}"><rect x="${c.x - lw / 2}" y="${c.y - 8}" width="${lw}" height="16" rx="8"/><text x="${c.x}" y="${c.y + 4}" text-anchor="middle">${esc(label)}</text><title>${esc(tip)}</title></g>`;
    }));

    svg.innerHTML = '<defs>' + mk('ah', '#4262ff') + mk('ahb', '#5b6170') + mk('ahs', '#e5252a') + '</defs>' + paths + tags;
    body.appendChild(svg);
  });
}

// その日の列へ横に動かす（‹ › は1週間ずつ。「今日」は今日の列を左の近くへ）
function scrollToDay(k, smooth) {
  const el = boardEl.querySelector('.day[data-day="' + k + '"]');
  if (el) boardEl.scrollTo({ left: Math.max(0, el.offsetLeft - 22 - (k === localToday() ? (el.offsetWidth + 22) : 0)), behavior: smooth ? 'smooth' : 'auto' });
}
async function goDay(k) {
  if (!S) return;
  if (!S.days.some(d => d.key === k)) {   // まだ読んでいない日：その週を読む
    try { await addChunk(chunkOf(k)); draw(); } catch (e) { toast(e.message); return; }
  }
  scrollToDay(k, true);
}
// 塊の始まり（はじめに読んだ日から7日ずつ）
let base = '';
const chunkOf = k => addDays(base, Math.floor((Date.parse(k) - Date.parse(base)) / 86400000 / DAYS) * DAYS);
function stepWeek(n) { const v = visibleDays(); if (!v.length) return; goDay(addDays(v[0], DAYS * n)); }
document.getElementById('prev').onclick = () => stepWeek(-1);
document.getElementById('next').onclick = () => stepWeek(1);
document.getElementById('today').onclick = () => goDay(localToday());
// 見出しの日付を押すと小さなカレンダー。上の帯の「🔗 日付を連動」
document.getElementById('vsbtn').outerHTML = viewSync.button();
viewSync.bind(document.querySelector('[data-vsync]'), () => visibleDays()[0]);
document.getElementById('ttl').onclick = () => { const v = visibleDays(); viewSync.mini(document.getElementById('ttl'), v[0], k => goDay(k), { start: 0, span: v.length ? (Date.parse(v[1]) - Date.parse(v[0])) / 86400000 + 1 : 1 }); };
const startDay = MOCK ? '' : (viewSync.day() || localToday());   // 連動中は、ほかの画面で見ていた日から
base = MOCK ? '' : addDays(startDay, -1);
{ const last = TRY ? null : loadLast(base);
  if (last) { stale = true; merge(last); draw(); scrollToDay(startDay); title(); sv('読み直しています…'); }
}
load(base).then(() => { if (MOCK) base = S.days[0].key; const first = !document.querySelector('.day'); draw(); if (first) scrollToDay(MOCK ? S.days[0].key : startDay); title(); if (!TRY) sv(''); })
  .catch(e => { document.getElementById('board').innerHTML = '<p style="padding:16px">' + esc(e.message) + '</p>'; });
// 1分ごとに、見えている所の塊を読み直す（ほかの人の手直しを取り込む。動かしている途中・保存待ちのときは待つ）
setInterval(async () => {
  if (TRY || document.hidden || dirty.size || saving || sel || link || !S) return;
  const v = visibleDays(); if (!v.length) return;
  const need = [...new Set([chunkOf(v[0]), chunkOf(v[1])])].filter(c => chunks.includes(c));
  try { for (const c of need) merge(await fetchChunk(c), dirty); draw(); } catch (e) {}
}, 60000);
</script>
</body>
