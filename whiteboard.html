<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホワイトボード｜なえログ</title>
<script>
// 人の割り振り表の「ホワイトボード」の形（11H のホワイトボードと同じ見え方）。2026-11-23 近藤さんFB の見本。
// 日ごとに「場所＋業務」の枠を並べ、名前の札（マグネット）を置く。社員の札は「担当」の欄に置くと、その枠の受け持ち。
// ?mock=1 … 手元の試験用（wb_mock.json を読む）。それ以外は、窓口の割り振り（?api=schedule）を業務ごとに束ねて出す。
// 見本なので、動かした札は保存しない（読み込み直すと元にもどる）。
(function () {
  const q = location.search, embed = /[?&]embed=1(&|$)/.test(q);
  if (embed) { document.documentElement.classList.add('embed'); const b = document.createElement('base'); b.target = '_top'; document.head.appendChild(b); }
})();
</script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
  :root { --green: #4f9363; --green-d: #2f6b3a; --green-l: #f0f6f1; --orange: #d4834a; --line: #dfe5e0; --gray: #6b6b6b; --red: #c33; --bg: #f6f7f5; --board: #fbfbf8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: #222; font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; }
  button, select, input { font-family: inherit; }
  header { background: var(--green); color: #fff; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  header h1 { font-size: 17px; margin: 0; }
  header a { color: #fff; font-size: 13px; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 4px 10px; text-decoration: none; }
  html.embed header { display: none; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
  .bar button { background: #fff; border: 1px solid #bbb; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .bar .ttl { font-size: 18px; font-weight: bold; }
  .bar .sp { flex: 1; }
  .bar .mock { background: #fff6c8; border: 1px solid #e8d48a; color: #5a4800; border-radius: 8px; padding: 3px 10px; font-size: 12px; }
  .legend { font-size: 12px; color: var(--gray); display: flex; gap: 10px; align-items: center; }
  #board { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: stretch; background: #e9ece8; padding: 10px; gap: 10px; }
  /* 1日 ＝ ホワイトボードの1列 */
  .day { flex: none; width: 300px; background: var(--board); border: 2px solid #c9cfc8; border-radius: 6px; display: flex; flex-direction: column; box-shadow: inset 0 0 0 4px #fff; }
  .day.today { border-color: var(--green); }
  .day .dh { display: flex; align-items: baseline; gap: 8px; padding: 6px 10px 4px; border-bottom: 3px solid #333; }
  .day .dh .d { font-size: 30px; font-family: "Segoe Print", "Comic Sans MS", cursive; line-height: 1; }
  .day .dh .w { background: #222; color: #fff; border-radius: 4px; padding: 0 6px; font-weight: bold; }
  .day .dh .w.sun { background: #c44; } .day .dh .w.sat { background: #2f6fb7; }
  .day .dh .n { margin-left: auto; font-size: 11px; color: var(--gray); text-align: right; }
  .day .body { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 10px; }
  /* 枠 ＝ 「1H 出荷」のような手書きの見出しと、その下の札 */
  .blk { border-radius: 6px; padding: 4px 4px 6px; }
  .blk.drop, .tray.drop { background: #e8f1ff; outline: 2px dashed #6c9bd8; }
  .blk .bh { display: flex; align-items: baseline; gap: 6px; font-size: 17px; font-weight: bold; font-family: "Yu Gothic", "Hiragino Sans", sans-serif; cursor: pointer; }
  .blk .bh .pl { font-family: "Segoe Print", "Comic Sans MS", cursive; }
  .blk .bh .nt { font-size: 11px; color: var(--gray); font-weight: normal; }
  .blk .bh .x { margin-left: auto; font-size: 11px; color: #999; font-weight: normal; }
  .blk .lead { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; min-height: 28px; font-size: 11px; color: var(--gray); margin: 2px 0; }
  .blk .lead > span.lb { margin-right: 2px; }
  .blk .mem { display: flex; flex-wrap: wrap; gap: 3px; min-height: 30px; }
  .blk .mem:empty::before { content: '名前の札をここへ'; color: #bbb; font-size: 11px; align-self: center; }
  /* 名前の札（マグネット）。社員は緑の枠、実習生は青い字 */
  .mg { display: inline-flex; align-items: center; height: 28px; padding: 0 8px; background: #fff; border: 2px solid #d6d6d6; border-radius: 3px; font-size: 15px; font-weight: bold; color: #b0322b; cursor: grab; user-select: none; letter-spacing: .08em; box-shadow: 0 1px 2px rgba(0,0,0,.15); white-space: nowrap; }
  .mg.staff { border-color: #6bbf3a; color: #1f3d8a; background: #eef0ea; }
  .mg.trainee { color: #1a5fb4; border-color: #8fb4e6; }
  .mg.sel { outline: 3px solid var(--orange); }
  .mg.dup::after { content: '2'; font-size: 9px; color: #fff; background: var(--orange); border-radius: 999px; padding: 0 4px; margin-left: 4px; letter-spacing: 0; }
  .add { border: 1px dashed #aaa; background: none; color: #777; border-radius: 6px; padding: 4px; cursor: pointer; font-size: 12px; }
  /* まだ置いていない人（その日に出勤する人） */
  .tray { border-top: 2px dashed #bbb; padding: 6px 8px 8px; background: #f3f4f0; max-height: 34%; overflow-y: auto; flex: none; }
  .tray .tt { font-size: 11px; color: var(--gray); margin-bottom: 4px; }
  .tray .mem { display: flex; flex-wrap: wrap; gap: 3px; }
  .muted { color: var(--gray); font-size: 12px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  @media (max-width: 700px) { .day { width: 86vw; } }
</style>
</head>
<body>
<header><h1>ホワイトボード（見本）</h1><a href="index.html?go=schedule">割り振り表へ</a></header>
<div class="bar">
  <button type="button" id="prev">‹</button><button type="button" id="next">›</button>
  <span class="ttl" id="ttl"></span>
  <span class="mock">見本：札を動かしても保存しません。</span>
  <span class="sp"></span>
  <span class="legend"><span class="mg staff" style="cursor:default">社員</span><span class="mg" style="cursor:default">パート</span><span class="mg trainee" style="cursor:default">実習生</span></span>
</div>
<div id="board"></div>
<div id="toast"></div>
<script>
const MOCK = /[?&]mock=1(&|$)/.test(location.search);
// ?demo=1 … 見本の枠を、窓口の人の一覧と出勤からその場で作る（ホワイトボードの写真に似せた場所・業務。名前はファイルに書かない）
const DEMO = /[?&]demo=1(&|$)/.test(location.search);
const WD = '日月火水木金土';
const BIZ = ['播種', 'ポット入れ', '土入れ', '土並べ', '接ぎ木', '鉢上げ', '薬散', 'ラベル差し', '出荷', '店振り', '箱作り', '寄せ植え', '除草', 'その他'];
let S = null;            // { days:[{key,label}], people:[{name,kubun}], cap:{name:{day:h}}, boards:{day:[{id,place,biz,note,lead:[],mem:[]}]} }
let from = '';
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.className = 'show'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2200); };
const kindOf = n => { const p = S.people.find(x => x.name === n); const k = p ? p.kubun : ''; return /社員|取締役/.test(k) ? 'staff' : /実習/.test(k) ? 'trainee' : ''; };
const short = n => String(n).split(/[\s　]/)[0].slice(0, 4);   // 札は姓だけ（ホワイトボードと同じ）
let seq = 1;
const newId = () => 'b' + (seq++);

function demoBoards(s) {
  let seed = 3; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const pat = [['1H', '出荷'], ['', '接ぎ木'], ['16H', '出荷', 'AM'], ['', '除草'], ['3H', '寄せ植え'], ['PV', '出荷'], ['4H', 'その他', '床そうじ'], ['12H', '鉢上げ'], ['7H', 'その他', '種とり'], ['F12', '出荷'], ['1H', '土並べ']];
  const boards = {};
  s.days.forEach((d, i) => {
    const pres = s.people.filter(p => (s.cap[p.name] || {})[d.key] > 0);
    const staff = pres.filter(p => /社員/.test(p.kubun)).map(p => p.name), part = pres.filter(p => !/社員|取締役/.test(p.kubun)).map(p => p.name);
    const n = 5 + Math.floor(rnd() * 3), list = [];
    for (let k = 0; k < n; k++) { const x = pat[(i * 2 + k) % pat.length]; list.push({ id: newId(), place: x[0], biz: x[1], note: x[2] || '', lead: [], mem: [] }); }
    staff.slice(0, n).forEach((nm, k) => list[k].lead.push(nm));
    part.slice(0, Math.floor(part.length * 0.85)).forEach((nm, k) => list[k % n].mem.push(nm));
    boards[d.key] = list;
  });
  return { days: s.days, people: s.people, cap: s.cap, boards };
}
// 窓口の割り振り（人 × 計画の作業 × 日）を、日 × 業務の枠に束ねる（場所はまだ持っていないので空）
function fromSchedule(s) {
  const boards = {};
  s.days.forEach(d => { boards[d.key] = []; });
  s.assigns.forEach(a => {
    const list = boards[a.date]; if (!list) return;
    let b = list.find(x => x.biz === a.major);
    if (!b) list.push(b = { id: newId(), place: '', biz: a.major, note: '', lead: [], mem: [] });
    const staff = /社員|取締役/.test((s.people.find(p => p.name === a.name) || {}).kubun || '');
    const arr = staff ? b.lead : b.mem;
    if (!arr.includes(a.name)) arr.push(a.name);
  });
  return { days: s.days, people: s.people, cap: s.cap, boards };
}
async function load(f) {
  if (MOCK) { const j = await (await fetch('wb_mock.json', { cache: 'no-store' })).json(); S = j; return; }
  const s = await callApi('api=schedule' + (f ? '&from=' + f : ''));
  from = s.start; S = DEMO ? demoBoards(s) : fromSchedule(s);
}
function present(day) { return S.people.filter(p => (S.cap[p.name] || {})[day] > 0).map(p => p.name); }
function placedCount(day, n) { return (S.boards[day] || []).reduce((c, b) => c + (b.lead.includes(n) ? 1 : 0) + (b.mem.includes(n) ? 1 : 0), 0); }

function mg(n, day, from) {
  const k = kindOf(n), dup = placedCount(day, n) > 1;
  return `<span class="mg ${k}${dup ? ' dup' : ''}${sel && sel.n === n && sel.day === day && sel.from === from ? ' sel' : ''}" draggable="true" data-n="${esc(n)}" data-day="${day}" data-from="${from}" title="${esc(n)}${dup ? '（ほかの枠にもいる：午前・午後など）' : ''}">${esc(short(n))}</span>`;
}
function draw() {
  const el = document.getElementById('board');
  el.innerHTML = S.days.map(d => {
    const wd = d.label.match(/\((.)\)/) ? d.label.match(/\((.)\)/)[1] : '';
    const pres = present(d.key), bl = S.boards[d.key] || [];
    const rest = pres.filter(n => placedCount(d.key, n) === 0);
    return `<div class="day${d.today ? ' today' : ''}" data-day="${d.key}">
      <div class="dh"><span class="d">${Number(d.key.slice(8))}</span><span class="w ${wd === '日' ? 'sun' : wd === '土' ? 'sat' : ''}">${wd}</span>
        <span class="n">出勤 ${pres.length}人<br>まだ置いていない ${rest.length}人</span></div>
      <div class="body">
        ${bl.map(b => `<div class="blk" data-day="${d.key}" data-b="${b.id}">
          <div class="bh" data-edit="${b.id}" title="押すと場所・業務・メモを直す"><span class="pl">${esc(b.place)}</span><span>${esc(b.biz)}</span><span class="nt">${esc(b.note)}</span><span class="x">${b.lead.length + b.mem.length}人</span></div>
          <div class="lead" data-drop="lead" data-b="${b.id}" data-day="${d.key}"><span class="lb">担当</span>${b.lead.map(n => mg(n, d.key, b.id + ':lead')).join('') || '<span class="muted">社員の札をここへ</span>'}</div>
          <div class="mem" data-drop="mem" data-b="${b.id}" data-day="${d.key}">${b.mem.map(n => mg(n, d.key, b.id + ':mem')).join('')}</div>
        </div>`).join('')}
        <button type="button" class="add" data-add="${d.key}">＋ 枠を足す（場所・業務）</button>
      </div>
      <div class="tray" data-drop="tray" data-day="${d.key}"><div class="tt">まだ置いていない人（その日に出勤）</div><div class="mem">${rest.map(n => mg(n, d.key, 'tray')).join('') || '<span class="muted">全員置いた</span>'}</div></div>
    </div>`;
  }).join('');
  const a = S.days[0], z = S.days[S.days.length - 1];
  document.getElementById('ttl').textContent = a ? a.label + ' 〜 ' + z.label : '';
}

// ---- 札を動かす：PC はつかんで落とす（Ctrl を押しながらで、元の枠にも残す＝午前・午後）。スマホは札を押してから、置く先を押す ----
let sel = null;   // 押して選んだ札 { n, day, from }
function moveTo(src, dropEl, copy) {
  const day = dropEl.dataset.day, kind = dropEl.dataset.drop, bid = dropEl.dataset.b;
  if (src.day !== day) { toast('ほかの日へは動かせません（その日に出勤する人だけ置けます）'); return; }
  const bl = S.boards[day];
  if (!copy && src.from !== 'tray') { const [ob, ok] = src.from.split(':'); const b = bl.find(x => x.id === ob); if (b) b[ok] = b[ok].filter(x => x !== src.n); }
  if (kind !== 'tray') {
    const b = bl.find(x => x.id === bid);
    if (kind === 'lead' && kindOf(src.n) !== 'staff') { toast('「担当」に置けるのは社員の札です'); draw(); return; }
    if (!b[kind].includes(src.n)) b[kind].push(src.n);
  }
  draw();
}
const board = document.getElementById('board');
board.addEventListener('dragstart', ev => { const m = ev.target.closest('.mg'); if (!m) return; ev.dataTransfer.setData('text/plain', JSON.stringify({ n: m.dataset.n, day: m.dataset.day, from: m.dataset.from })); });
board.addEventListener('dragover', ev => { const t = ev.target.closest('[data-drop]'); if (!t) return; ev.preventDefault(); document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); (t.closest('.blk') || t).classList.add('drop'); });
board.addEventListener('dragleave', ev => { if (!ev.relatedTarget || !board.contains(ev.relatedTarget)) document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); });
board.addEventListener('drop', ev => {
  const t = ev.target.closest('[data-drop]'); document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
  if (!t) return; ev.preventDefault();
  try { moveTo(JSON.parse(ev.dataTransfer.getData('text/plain')), t, ev.ctrlKey); } catch (e) {}
});
board.addEventListener('click', ev => {
  const m = ev.target.closest('.mg');
  if (m) { sel = sel && sel.n === m.dataset.n && sel.from === m.dataset.from ? null : { n: m.dataset.n, day: m.dataset.day, from: m.dataset.from }; draw(); return; }
  const add = ev.target.closest('[data-add]');
  if (add) { const v = prompt('場所と業務（例：1H 出荷 ／ 3H 寄せ植え ／ 接ぎ木）\n業務：' + BIZ.join('・'), ''); if (!v) return; const [pl, ...rest] = v.trim().split(/\s+/); const biz = rest.length ? rest.join(' ') : pl; S.boards[add.dataset.add].push({ id: newId(), place: rest.length ? pl : '', biz, note: '', lead: [], mem: [] }); draw(); return; }
  const ed = ev.target.closest('[data-edit]');
  if (ed && !sel) {
    const day = ed.closest('.blk').dataset.day, b = S.boards[day].find(x => x.id === ed.dataset.edit);
    const v = prompt('場所・業務・メモ（例：16H 出荷 AM）。空にすると枠を消す', [b.place, b.biz, b.note].filter(Boolean).join(' '));
    if (v === null) return;
    if (!v.trim()) { S.boards[day] = S.boards[day].filter(x => x !== b); draw(); return; }
    const p = v.trim().split(/\s+/);
    if (p.length === 1) Object.assign(b, { place: '', biz: p[0], note: '' }); else Object.assign(b, { place: p[0], biz: p[1], note: p.slice(2).join(' ') });
    draw(); return;
  }
  const t = ev.target.closest('[data-drop]');
  if (t && sel) { const s = sel; sel = null; moveTo(s, t, false); }
});
document.getElementById('prev').onclick = () => go(-7);
document.getElementById('next').onclick = () => go(7);
async function go(n) {
  if (MOCK) { toast('見本では1週間ぶんだけです'); return; }
  const d = new Date(Date.parse(from + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
  await load(d); draw();
}
load('').then(draw).catch(e => { document.getElementById('board').innerHTML = '<p style="padding:16px">' + esc(e.message) + '</p>'; });
</script>
</body>
</html>
