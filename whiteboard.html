<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホワイトボード｜なえログ</title>
<script>
// ホワイトボード（11H のホワイトボードと同じ形の、毎日の段取り。2026-11-23 近藤さんFB）。index.html?go=whiteboard の中にはめ込んで出す。
//   1日 ＝ 列。「場所＋業務」の枠（1H 出荷・3H 寄せ植え など）に、担当（社員）と人の札を置く。
//   枠のもとは計画：その日に予定がある作業を、工程ごとに「83TR・2件・必要2人」と出す（枠がまだない工程は、点線の「計画から」の枠で出る）。
//   「この作業が終わったら、こっち」は矢印で引く（札は元の枠に残る）。
//   置いたものは窓口（ホワイトボード.gs）が、スケジュール用のスプレッドシートの「ホワイトボード」シートに残す。直せるのは計画担当だけ。
// ?demo=1 … 見本（保存しない。枠は人の一覧と出勤からその場で作る）。?mock=1 … 手元の試験（wb_mock.json）
(function () {
  const q = location.search, embed = /[?&]embed=1(&|$)/.test(q), test = /[?&](demo|mock)=1(&|$)/.test(q);
  if (!embed && !test && window.top === window.self) { location.replace('index.html?go=whiteboard'); return; }
  if (embed) { document.documentElement.classList.add('embed'); const b = document.createElement('base'); b.target = '_top'; document.head.appendChild(b); }
})();
</script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
  :root { --green: #4f9363; --green-d: #2f6b3a; --green-l: #f0f6f1; --orange: #d4834a; --line: #dfe5e0; --gray: #6b6b6b; --red: #c33; --bg: #f6f7f5; --board: #fff; --arrow: #4262ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: #222; font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; }
  button, select, input { font-family: inherit; }
  header { background: var(--green); color: #fff; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  header h1 { font-size: 17px; margin: 0; }
  header a { color: #fff; font-size: 13px; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 4px 10px; text-decoration: none; }
  html.embed header { display: none; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
  .bar button { background: #fff; border: 1px solid #bbb; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .bar button.on { background: #333; color: #fff; border-color: #333; }
  .bar .ttl { font-size: 18px; font-weight: bold; }
  .bar .sp { flex: 1; }
  .bar .note { background: #fff6c8; border: 1px solid #e8d48a; color: #5a4800; border-radius: 8px; padding: 3px 10px; font-size: 12px; }
  .bar .sv { font-size: 12px; color: var(--gray); }
  .bar .sv.err { color: var(--red); font-weight: bold; }
  .bar .vsw { display: inline-flex; border: 1px solid #bbb; border-radius: 999px; overflow: hidden; }
  .bar .vsw a { padding: 5px 14px; font-size: 13px; color: #333; text-decoration: none; white-space: nowrap; background: #fff; }
  .bar .vsw a + a { border-left: 1px solid #bbb; }
  .bar .vsw a.on { background: var(--green-l); color: var(--green-d); font-weight: bold; }
  .legend { font-size: 12px; color: var(--gray); display: flex; gap: 6px; align-items: center; }
  /* キャンバス（Miro のような点の方眼） */
  #board { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: stretch; background-color: #f5f6f8; background-image: radial-gradient(#c9ccd4 1px, transparent 1px); background-size: 18px 18px; padding: 22px; gap: 22px; }
  body.arrow #board { cursor: crosshair; }
  /* 1日 ＝ ホワイトボードの1列 */
  .day { flex: none; width: 286px; background: rgba(255,255,255,.72); border: 1px solid #e3e5ea; border-radius: 14px; display: flex; flex-direction: column; box-shadow: 0 2px 10px rgba(30,40,60,.06); backdrop-filter: blur(2px); }
  .day.today { border-color: #4262ff; box-shadow: 0 0 0 2px rgba(66,98,255,.18), 0 2px 10px rgba(30,40,60,.06); }
  .day.past { opacity: .75; }
  .day .dh { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px 8px; border-bottom: 1px solid #eceef2; }
  .day .dh .d { font-size: 20px; font-weight: bold; line-height: 1; color: #1f2430; }
  .day .dh .w { background: #eef0f5; color: #555c6b; border-radius: 6px; padding: 1px 7px; font-weight: bold; font-size: 12px; }
  .day .dh .w.sun { background: #fdecec; color: #c44; } .day .dh .w.sat { background: #e8f0fb; color: #2f6fb7; }
  .day .dh .n { margin-left: auto; font-size: 11px; color: var(--gray); text-align: right; }
  .day .body { flex: 1; overflow-y: auto; padding: 12px 46px 12px 12px; display: flex; flex-direction: column; gap: 14px; position: relative; }
  .day .body svg.arw { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 2; }
  .day .body svg.arw path.ln { fill: none; stroke: var(--arrow); stroke-width: 2.4; stroke-linecap: round; pointer-events: none; }
  .day .body svg.arw path.hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  .day .body svg.arw path.hit:hover + path.ln { stroke: var(--red); stroke-width: 3.2; }
  .day .body svg.arw circle { fill: #fff; stroke: var(--arrow); stroke-width: 2; }
  /* 業務から業務への矢印（枠ごと次へ）：灰色の太い線 */
  .day .body svg.arw path.ln.bk { stroke: #5b6170; stroke-width: 2.8; }
  .day .body svg.arw circle.bk { stroke: #5b6170; }
  /* 枠 ＝ 「1H 出荷」の見出しと、その下の札 */
  /* 枠：白いカード（Miro の付せん・カードの見え方） */
  .blk { border-radius: 9px; padding: 6px 7px 7px; position: relative; z-index: 1; background: #fff; border: 1px solid #e3e5ea; box-shadow: 0 1px 4px rgba(30,40,60,.08); }
  .blk.auto { border: 1.5px dashed #c7cbd4; background: rgba(255,255,255,.55); box-shadow: none; }
  .blk.drop, .tray.drop { background: #e8f1ff; outline: 2px dashed #6c9bd8; }
  .blk .bh { display: flex; align-items: baseline; gap: 5px; font-size: 13px; font-weight: bold; color: #1f2430; }
  .blk .bh .grip { color: #b5bac5; font-size: 11px; cursor: grab; letter-spacing: -2px; }
  .blk.dragging { opacity: .4; }
  /* 矢印のつまみ：枠にマウスを乗せると4辺の真ん中に小さな丸。そこから行き先の枠へ引っぱる（Miro と同じ） */
  .hd { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: #fff; border: 2px solid #4262ff; opacity: 0; z-index: 6; cursor: crosshair; touch-action: none; transition: opacity .12s, transform .12s; }
  .hd:hover { transform: scale(1.35); background: #4262ff; }
  .hd.t { top: -6px; left: calc(50% - 6px); } .hd.b { bottom: -6px; left: calc(50% - 6px); }
  .hd.l { left: -6px; top: calc(50% - 6px); } .hd.r { right: -6px; top: calc(50% - 6px); }
  body.can .blk:not(.auto):hover > .hd, body.linking .blk > .hd { opacity: 1; }
  /* 名前の札のつまみ（その人だけ途中からこっちへ） */
  .mg { position: relative; }
  .mg .hdm { position: absolute; right: -5px; top: calc(50% - 5px); width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 2px solid #4262ff; opacity: 0; cursor: crosshair; touch-action: none; z-index: 6; }
  .mg .hdm:hover { background: #4262ff; }
  body.can .mg:hover .hdm { opacity: 1; }
  @media (hover: none) { body.can .blk:not(.auto) > .hd { opacity: .55; } body.can .blk .mg .hdm { opacity: .55; } }
  .blk.target { outline: 2px solid #4262ff; outline-offset: 2px; }
  #tmp { position: fixed; inset: 0; pointer-events: none; z-index: 40; width: 100vw; height: 100vh; }
  #tmp path { fill: none; stroke: #4262ff; stroke-width: 2.4; stroke-dasharray: 6 4; }
  .blk .bh.ed { cursor: pointer; }
  .blk .bh .pl { color: var(--green-d); }
  .blk .bh .nt { font-size: 11px; color: var(--gray); font-weight: normal; }
  .blk .bh .x { margin-left: auto; font-size: 11px; color: #999; font-weight: normal; white-space: nowrap; }
  .blk .bh .x.short { color: var(--red); font-weight: bold; }
  .blk .wk { font-size: 10px; color: #555c6b; background: #f3f5f9; border-radius: 6px; padding: 2px 6px; margin: 3px 0; cursor: pointer; }
  .blk .wk b { color: #222; }
  .blk .wk .auto { color: var(--orange); font-weight: bold; }
  .blk .pls { font-size: 11px; margin: 2px 0 4px; border-left: 3px solid #cfe0d2; padding-left: 6px; }
  .blk .pls div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk .pls .done { color: #999; text-decoration: line-through; }
  .blk .lead { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; min-height: 22px; font-size: 10px; color: var(--gray); margin: 2px 0; }
  .blk .lead > span.lb { margin-right: 2px; }
  .blk .mem { display: flex; flex-wrap: wrap; gap: 3px; min-height: 24px; }
  .blk .mem:empty::before { content: '名前の札をここへ'; color: #bbb; font-size: 10px; align-self: center; }
  /* 名前の札（マグネット）。社員は緑の枠、実習生は青い字 */
  .mg { display: inline-flex; align-items: center; height: 22px; padding: 0 6px; background: #fff; border: 1.5px solid #d9dce3; border-radius: 6px; font-size: 12px; font-weight: bold; color: #b0322b; user-select: none; letter-spacing: .06em; box-shadow: 0 1px 2px rgba(30,40,60,.10); white-space: nowrap; }
  body.can .mg { cursor: grab; }
  .mg.staff { border-color: #7cc456; color: #1f3d8a; background: #f3f9ee; }
  .mg.trainee { color: #1a5fb4; border-color: #8fb4e6; }
  .mg.sel { outline: 3px solid var(--orange); }
  .mg.dup::after { content: '2'; font-size: 9px; color: #fff; background: var(--orange); border-radius: 999px; padding: 0 4px; margin-left: 4px; letter-spacing: 0; }
  .add { border: 1px dashed #aaa; background: none; color: #777; border-radius: 6px; padding: 4px; cursor: pointer; font-size: 12px; }
  /* まだ置いていない人（その日に出勤する人） */
  .tray { border-top: 1px dashed #d4d7de; padding: 8px 10px 10px; background: rgba(245,246,248,.9); border-radius: 0 0 14px 14px; max-height: 34%; overflow-y: auto; flex: none; }
  .tray .tt { font-size: 10px; color: var(--gray); margin-bottom: 4px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px; }
  .tray .tt .tw { display: inline-block; font-size: 12px; transition: transform .15s; }
  .tray.shut .tt { margin-bottom: 0; }
  .tray.shut .tt .tw { transform: rotate(-90deg); }
  .tray.shut .mem { display: none; }
  .tray .mem { display: flex; flex-wrap: wrap; gap: 3px; }
  .muted { color: var(--gray); font-size: 12px; }
  /* 入力の画面（場所・業務・メモ） */
  #frm { position: fixed; inset: 0; z-index: 60; background: rgba(20,24,34,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #frm[hidden], #frm [hidden] { display: none !important; }
  #frm .lt { display: flex; align-items: center; }
  #frm .box { background: #fff; border-radius: 14px; width: min(380px, 100%); padding: 18px 18px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 10px; }
  #frm h3 { margin: 0 0 2px; font-size: 16px; }
  #frm label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #444; font-weight: bold; }
  #frm .req { color: #fff; background: var(--red); border-radius: 4px; font-size: 10px; padding: 0 5px; margin-left: 6px; font-weight: normal; display: inline-block; }
  #frm label { position: relative; }
  #frm .opt { color: var(--gray); font-weight: normal; font-size: 10px; margin-left: 6px; }
  #frm input, #frm select { font-size: 15px; padding: 8px 10px; border: 1px solid #ccd0d8; border-radius: 8px; font-weight: normal; }
  #frm input:focus, #frm select:focus { outline: 2px solid #4262ff; border-color: #4262ff; }
  #frm .err { color: var(--red); font-size: 12px; margin: 0; min-height: 1em; }
  #frm .btns { display: flex; gap: 8px; align-items: center; }
  #frm .btns .sp { flex: 1; }
  #frm .btns button { border: 1px solid #ccd0d8; background: #fff; border-radius: 8px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  #frm .btns .ok { background: #4262ff; border-color: #4262ff; color: #fff; font-weight: bold; }
  #frm .btns .del { color: var(--red); border-color: #f0b4b4; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  #toast.show { opacity: 1; }
  @media (max-width: 700px) { .day { width: 86vw; } .legend { display: none; } }
</style>
</head>
<body>
<header><h1>ホワイトボード</h1><a href="index.html?go=whiteboard">なえログで開く</a></header>
<div class="bar">
  <button type="button" id="today">今日</button><button type="button" id="prev">‹</button><button type="button" id="next">›</button>
  <span class="ttl" id="ttl"></span>
  <span class="note" id="mode" hidden></span>
  <span class="sv" id="sv"></span>
  <span class="sp"></span>
  <button type="button" id="arrow" style="display:none" title="人の札（途中からこっち）か、枠の見出し（業務が終わったらこっち）をつかんで、行き先の枠へ落とす（スマホは札を押してから枠を押す）。矢印を押すと消せる">→ 矢印を引く</button>
  <span class="legend"><span class="mg staff">社員</span><span class="mg">パート</span><span class="mg trainee">実習生</span></span>
  <span class="vsw"><a href="index.html?go=calendar">カレンダー</a><a href="index.html?go=whiteboard" class="on">ホワイトボード</a><a href="index.html?go=schedule">人の割り振り表</a></span>
</div>
<div id="board"></div>
<div id="frm" hidden><form class="box" id="frmf" autocomplete="off">
  <h3 id="frmt">枠を足す</h3>
  <label><span class="lt">場所<span class="req">必須</span></span><input id="fpl" list="plist" placeholder="例：1H、12H、F12、PV"></label>
  <datalist id="plist"></datalist>
  <label><span class="lt">業務<span class="req">必須</span></span><select id="fbz"></select></label>
  <label id="fbx" hidden>業務の名前<input id="fbz2" placeholder="例：床そうじ"></label>
  <label><span class="lt">メモ<span class="opt">なくてもよい</span></span><input id="fnt" placeholder="例：AM、種とり"></label>
  <p class="err" id="ferr"></p>
  <div class="btns"><button type="button" class="del" id="fdel" hidden>この枠を消す</button><span class="sp"></span><button type="button" id="fcancel">やめる</button><button type="submit" class="ok">決める</button></div>
</form></div>
<svg id="tmp"></svg>
<div id="toast"></div>
<script>
const Q = location.search;
const MOCK = /[?&]mock=1(&|$)/.test(Q), DEMO = /[?&]demo=1(&|$)/.test(Q), TRY = MOCK || DEMO;
const BIZ = ['播種', 'ポット入れ', '土入れ', '土並べ', '接ぎ木', '鉢上げ', '薬散', 'ラベル差し', '出荷', '店振り', '箱作り', '寄せ植え', '除草', 'その他'];
const DAYS = 7;
let S = null;          // { days, people, cap, boards:{日:[枠]}, work:{日:[工程の作業]} }
let start = '';
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.className = 'show'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2400); };
const num = h => String(Math.round(Number(h) * 10) / 10);
const addDays = (k, n) => new Date(Date.parse(k + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
function localToday() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// 直せるか：計画担当でログインしている。見本・試験ではいつでも（保存はしない）
function canEdit() { if (TRY) return true; try { return !!(authToken() && authCaps().planner); } catch (e) { return false; } }
const kindOf = n => { const p = S.people.find(x => x.name === n); const k = p ? p.kubun : ''; return /社員|取締役/.test(k) ? 'staff' : /実習/.test(k) ? 'trainee' : ''; };
const short = n => String(n).split(/[\s　]/)[0].slice(0, 4);   // 札は姓だけ（ホワイトボードと同じ）
let seq = 1;
const newId = () => 'w' + Date.now().toString(36).slice(-5) + (seq++);

// ---- 読む ----
function demoBoards(s) {
  let seed = 3; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const pat = [['1H', '出荷'], ['', '接ぎ木'], ['16H', '出荷', 'AM'], ['', '除草'], ['3H', '寄せ植え'], ['PV', '出荷'], ['4H', 'その他', '床そうじ'], ['12H', '鉢上げ'], ['7H', 'その他', '種とり'], ['F12', '出荷'], ['1H', '土並べ']];
  const boards = {};
  s.days.forEach((d, i) => {
    const pres = s.people.filter(p => (s.cap[p.name] || {})[d.key] > 0);
    const staff = pres.filter(p => /社員/.test(p.kubun)).map(p => p.name), part = pres.filter(p => !/社員|取締役/.test(p.kubun)).map(p => p.name);
    const n = 5 + Math.floor(rnd() * 3), list = [];
    for (let k = 0; k < n; k++) { const x = pat[(i * 2 + k) % pat.length]; list.push({ id: newId(), place: x[0], biz: x[1], major: '', note: x[2] || '', lead: [], mem: [], next: {} }); }
    staff.slice(0, n).forEach((nm, k) => list[k].lead.push(nm));
    part.slice(0, Math.floor(part.length * 0.85)).forEach((nm, k) => list[k % n].mem.push(nm));
    if (list[2].mem[0]) list[2].next[list[2].mem[0]] = list[4].id;   // 矢印の見本
    boards[d.key] = list;
  });
  return { days: s.days, people: s.people, cap: s.cap, boards, work: {} };
}
async function load(from) {
  if (MOCK) { S = await (await fetch('wb_mock.json', { cache: 'no-store' })).json(); S.work = S.work || {}; start = S.days[0].key; }
  else if (DEMO) { const s = await callApi('api=schedule' + (from ? '&from=' + from + '&exact=1' : '')); start = s.start; S = demoBoards(s); }
  else { const s = await callApi('api=board&days=' + DAYS + (from ? '&from=' + from : '')); start = s.start; S = s; }
  Object.values(S.boards).forEach(list => list.forEach(b => { b.next = b.next || {}; b.lead = b.lead || []; b.mem = b.mem || []; }));
}
const present = day => S.people.filter(p => (S.cap[p.name] || {})[day] > 0).map(p => p.name);
const placedCount = (day, n) => (S.boards[day] || []).reduce((c, b) => c + (b.lead.includes(n) ? 1 : 0) + (b.mem.includes(n) ? 1 : 0), 0);
// 1人の出勤の時間（その日の出勤の合計 ÷ 人数。分からなければ 8）
function perPerson(day) { const ps = present(day); if (!ps.length) return 8; return ps.reduce((n, x) => n + (S.cap[x][day] || 0), 0) / ps.length || 8; }
const needOf = (day, w) => w && w.h > 0 ? Math.ceil(w.h / perPerson(day) * 2) / 2 : 0;

// その日の枠：置いた枠 ＋ まだ枠がない工程の作業（点線の「計画から」の枠）
function blocksOf(day) {
  const bl = S.boards[day] || [], ws = S.work[day] || [];
  const auto = ws.filter(w => !bl.some(b => b.major === w.s)).map(w => ({ id: 'auto:' + w.s, auto: true, place: '', biz: w.s, major: w.s, note: '', lead: [], mem: [], next: {} }));
  return bl.concat(auto);
}
// 点線の枠に人を置いたら、本物の枠にする
function realize(day, id) {
  if (!id.startsWith('auto:')) return S.boards[day].find(x => x.id === id);
  const major = id.slice(5), b = { id: newId(), place: '', biz: major, major, note: '', lead: [], mem: [], next: {} };
  S.boards[day].push(b);
  return b;
}

// ---- 描く ----
// 「まだ置いていない人」をたたんでいるか（どの日も同じ。このブラウザに覚える）
let trayShut = (() => { try { return localStorage.getItem('qrdemo.wbTray') === '1'; } catch (e) { return false; } })();
const openPl = new Set();   // 計画の一覧を開いている枠（日|枠ID）
let sel = null;             // 押して選んだ札 { n, day, from }
function mg(n, day, from) {
  const k = kindOf(n), dup = placedCount(day, n) > 1;
  return `<span class="mg ${k}${dup ? ' dup' : ''}${sel && sel.n === n && sel.day === day && sel.from === from ? ' sel' : ''}" ${canEdit() ? 'draggable="true"' : ''} data-n="${esc(n)}" data-day="${day}" data-from="${from}" title="${esc(n)}${dup ? '（ほかの枠にもいる）' : ''}">${esc(short(n))}${canEdit() && from !== 'tray' ? '<span class="hdm" title="引っぱると、この人だけ途中からほかの業務へ"></span>' : ''}</span>`;
}
function workHtml(day, b) {
  const w = (S.work[day] || []).find(x => x.s === b.major);
  if (!w) return '';
  const need = needOf(day, w), key = day + '|' + b.id, open = openPl.has(key);
  return `<div class="wk" data-pl="${esc(key)}" title="押すと計画の一覧">${b.auto ? '<span class="auto">計画から　</span>' : ''}<b>${w.q ? num(w.q) + (w.u || 'TR') : w.n + '件'}</b>・${w.n}件${w.dn ? '（済' + w.dn + '）' : ''}${w.h ? '・残り ' + num(w.h) + 'h' : ''}${need ? '・必要 ' + need + '人' : ''} ${open ? '▾' : '▸'}</div>`
    + (open ? `<div class="pls">${w.plans.map(p => `<div class="${p.done ? 'done' : ''}">${esc(p.n)}　<span class="muted">${esc(p.c)}${p.hs ? '・' + esc(p.hs) : ''}${p.q !== '' ? '・' + esc(num(p.q)) + 'TR' : ''}</span></div>`).join('')}</div>` : '');
}

}
// 角を丸めた折れ線（たて・よこの線を、半径 rad で丸めてつなぐ）
function elbow(pts, rad) {
  let d = 'M' + pts[0][0] + ',' + pts[0][1];
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [cx, cy] = pts[i], [nx, ny] = pts[i + 1];
    const l1 = Math.hypot(cx - px, cy - py), l2 = Math.hypot(nx - cx, ny - cy), r = Math.min(rad, l1 / 2, l2 / 2);
    const ax = cx - (cx - px) / (l1 || 1) * r, ay = cy - (cy - py) / (l1 || 1) * r, bx = cx + (nx - cx) / (l2 || 1) * r, by = cy + (ny - cy) / (l2 || 1) * r;
    d += ' L' + ax + ',' + ay + ' Q' + cx + ',' + cy + ' ' + bx + ',' + by;
  }
  const e = pts[pts.length - 1];
  return d + ' L' + e[0] + ',' + e[1];
}
// 矢印：札から、行き先の枠の見出しへ。列の右の余白を回って下ろす（ホワイトボードの手書きの矢印と同じ見え方）
// 曲線の道筋：始まり a（点と向き）から、終わり z（点と向き）へ。向きの方へ、きょりに合わせてふくらませる（Miro のつなぎ線）
function curve(a, z) {
  const d = Math.max(24, Math.min(80, Math.hypot(z.x - a.x, z.y - a.y) * 0.45));
  return 'M' + a.x + ',' + a.y + ' C' + (a.x + a.dx * d) + ',' + (a.y + a.dy * d) + ' ' + (z.x + z.dx * d) + ',' + (z.y + z.dy * d) + ' ' + z.x + ',' + z.y;
}
// 2つの箱（rect）の、向き合う辺の真ん中どうし。下の箱へは 下の辺→上の辺。離れているとき・横に並ぶときは 右の辺→右の辺（右の余白を回る弧）
function ends(A, B, fromMg) {
  const gap = B.y - (A.y + A.h), gapUp = A.y - (B.y + B.h);
  if (!fromMg && gap >= 0 && gap < 40) return [{ x: A.x + A.w / 2, y: A.y + A.h, dx: 0, dy: 1 }, { x: B.x + B.w / 2, y: B.y - 3, dx: 0, dy: -1 }];
  if (!fromMg && gapUp >= 0 && gapUp < 40) return [{ x: A.x + A.w / 2, y: A.y, dx: 0, dy: -1 }, { x: B.x + B.w / 2, y: B.y + B.h + 3, dx: 0, dy: 1 }];
  // 名前の札からは、札の下から出す（となりの札の上を通らない）
  if (fromMg) {
    // すぐ下の枠へは、札の下から枠の上の辺へ（まっすぐに近い弧）。離れた枠へは、札の右から右の余白を回る
    if (B.y > A.y && B.y - (A.y + A.h) < 90) { const x = Math.max(B.x + 16, Math.min(B.x + B.w - 16, A.x + A.w / 2)); return [{ x: A.x + A.w / 2, y: A.y + A.h, dx: 0, dy: 1 }, { x, y: B.y - 3, dx: 0, dy: -1 }]; }
    return [{ x: A.x + A.w, y: A.y + A.h / 2, dx: 1, dy: 0 }, { x: B.x + B.w + 3, y: B.y + Math.min(14, B.h / 2), dx: 1, dy: 0 }];
  }
  return [{ x: A.x + A.w, y: A.y + A.h / 2, dx: 1, dy: 0 }, { x: B.x + B.w + 3, y: B.y + Math.min(14, B.h / 2), dx: 1, dy: 0 }];
}
function drawArrows() {
  document.querySelectorAll('.day .body').forEach(body => {
    const day = body.dataset.day, bl = blocksOf(day), br = body.getBoundingClientRect();
    const pos = el => { const r = el.getBoundingClientRect(); return { x: r.left - br.left + body.scrollLeft, y: r.top - br.top + body.scrollTop, w: r.width, h: r.height }; };
    let paths = '';
    bl.forEach(b => Object.keys(b.next).forEach(n => {
      const tb = body.querySelector(`.blk[data-b="${CSS.escape(b.next[n])}"]`);
      const src = n === '*' ? body.querySelector(`.blk[data-b="${CSS.escape(b.id)}"]`) : body.querySelector(`.mg[data-n="${CSS.escape(n)}"][data-from^="${CSS.escape(b.id + ':')}"]`);
      if (!tb || !src) return;
      const [a, z] = ends(pos(src), pos(tb), n !== '*');
      const to = bl.find(x => x.id === b.next[n]) || {}, bk = n === '*';
      const d = curve(a, z), key = esc(b.id) + '|' + esc(n);
      const tip = (bk ? [b.place, b.biz].filter(Boolean).join(' ') + ' が終わったら ' : short(n) + '：途中から ') + [to.place, to.biz].filter(Boolean).join(' ') + ' へ' + (canEdit() ? '（押すと消す）' : '');
      paths += `<path class="hit" data-arw="${key}" d="${d}"><title>${esc(tip)}</title></path><path class="ln${bk ? ' bk' : ''}" d="${d}" marker-end="url(#${bk ? 'ahb' : 'ah'})"/><circle class="${bk ? 'bk' : ''}" cx="${a.x}" cy="${a.y}" r="3.5"/>`;
    }));
    if (!paths) return;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'arw'); svg.setAttribute('width', body.scrollWidth); svg.setAttribute('height', body.scrollHeight);
    svg.innerHTML = `<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L11,6 L0,11 z" fill="#4262ff"/></marker><marker id="ahb" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L11,6 L0,11 z" fill="#5b6170"/></marker></defs>` + paths;
    body.appendChild(svg);
  });
}

// ---- 保存（その日の枠をまとめて送る。続けて動かしたら最後に1回） ----
const dirty = new Set(); let saveT = 0, saving = 0;
function changed(day) {
  draw();
  if (TRY) return;
  dirty.add(day); clearTimeout(saveT); saveT = setTimeout(flush, 800);
  sv('保存中…');
}
async function flush() {
  const days = [...dirty]; dirty.clear();
  for (const d of days) {
    saving++;
    try { await postApi({ action: 'board', d, blocks: (S.boards[d] || []).map(b => ({ id: b.id, place: b.place, biz: b.biz, major: b.major, note: b.note, lead: b.lead, mem: b.mem, next: b.next })) }); }
    catch (e) { sv('保存できませんでした：' + e.message, true); saving--; return; }
    saving--;
  }
  if (!dirty.size && !saving) sv('保存しました');
}
function sv(t, err) { const s = document.getElementById('sv'); s.textContent = t; s.className = 'sv' + (err ? ' err' : ''); }

// ---- 札を動かす・矢印を引く ----
// PC：つかんで落とす（Ctrl を押しながらで、元の枠にも残す＝午前・午後）。スマホ：札を押してから、置く先を押す
// 「→ 矢印を引く」を押している間は、落とした先の枠へ矢印を引く（札は動かない）
let arrowMode = false;
function act(src, dropEl, copy) {
  const day = dropEl.dataset.day, kind = dropEl.dataset.drop;
  if (src.day !== day) { toast('ほかの日へは動かせません（その日に出勤する人だけ置けます）'); draw(); return; }
  const bl = S.boards[day];
  const [ob, ok] = src.from === 'tray' ? [null, null] : src.from.split(':');
  if (arrowMode) {
    if (!ob || kind === 'tray') { toast('矢印は、枠に置いてある札から、ほかの枠へ引きます'); draw(); return; }
    const from = realize(day, ob), to = realize(day, dropEl.dataset.b);
    if (from === to) { toast('同じ枠には引けません'); draw(); return; }
    from.next[src.n] = to.id;
    toast(short(src.n) + '：終わったら「' + [to.place, to.biz].filter(Boolean).join(' ') + '」へ');
    changed(day); return;
  }
  if (kind === 'lead' && kindOf(src.n) !== 'staff') { toast('「担当」に置けるのは社員の札です'); draw(); return; }
  if (!copy && ob) { const b = bl.find(x => x.id === ob); if (b) { b[ok] = b[ok].filter(x => x !== src.n); if (!b.lead.includes(src.n) && !b.mem.includes(src.n)) delete b.next[src.n]; } }
  if (kind !== 'tray') { const b = realize(day, dropEl.dataset.b); if (!b[kind].includes(src.n)) b[kind].push(src.n); }
  // 行き先がなくなった矢印は消す
  bl.forEach(b => Object.keys(b.next).forEach(n => { if (!bl.some(x => x.id === b.next[n])) delete b.next[n]; }));
  changed(day);
}
const board = document.getElementById('board');
board.addEventListener('dragstart', ev => {
  if (!canEdit()) return;
  const m = ev.target.closest('.mg');
  if (m) { ev.dataTransfer.setData('text/plain', JSON.stringify({ n: m.dataset.n, day: m.dataset.day, from: m.dataset.from })); return; }
  const h = ev.target.closest('[data-bh]');
  if (h) { ev.dataTransfer.setData('text/plain', JSON.stringify({ blk: h.dataset.bh, day: h.dataset.day })); h.closest('.blk').classList.add('dragging'); }
});
board.addEventListener('dragend', () => document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')));
// 枠を落としたとき：並べ替え（落とした枠の前へ）か、「→ 矢印を引く」中なら業務から業務への矢印
function actBlock(src, dropEl) {
  const tb = dropEl.closest('.blk');
  if (!tb) return;
  const day = tb.dataset.day;
  if (src.day !== day) { toast('ほかの日へは動かせません'); return; }
  const from = realize(day, src.blk), to = realize(day, tb.dataset.b);
  if (from === to) return;
  if (arrowMode) { from.next['*'] = to.id; toast('「' + [from.place, from.biz].filter(Boolean).join(' ') + '」が終わったら「' + [to.place, to.biz].filter(Boolean).join(' ') + '」へ'); changed(day); return; }
  const list = S.boards[day];
  list.splice(list.indexOf(from), 1);
  list.splice(list.indexOf(to), 0, from);
  changed(day);
}
board.addEventListener('dragover', ev => { const t = ev.target.closest('[data-drop]') || ev.target.closest('.blk'); if (!t) return; ev.preventDefault(); document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); (t.closest('.blk') || t).classList.add('drop'); });
board.addEventListener('dragleave', ev => { if (!ev.relatedTarget || !board.contains(ev.relatedTarget)) document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); });
board.addEventListener('drop', ev => {
  document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
  let t = ev.target.closest('[data-drop]'); if (!t) { const b = ev.target.closest('.blk'); if (b) t = b.querySelector('[data-drop="mem"]'); }
  if (!t) return; ev.preventDefault();
  try { const src = JSON.parse(ev.dataTransfer.getData('text/plain')); if (src.blk) actBlock(src, t); else act(src, t, ev.ctrlKey); } catch (e) {}
});
board.addEventListener('click', ev => {
  const ln = ev.target.closest('[data-arw]');
  if (ln) {
    if (!canEdit()) return;
    const i = ln.dataset.arw.indexOf('|'), bid = ln.dataset.arw.slice(0, i), n = ln.dataset.arw.slice(i + 1), day = ln.closest('.body').dataset.day, b = S.boards[day].find(x => x.id === bid);
    if (b && confirm((n === '*' ? '「' + [b.place, b.biz].filter(Boolean).join(' ') + '」からの' : short(n) + ' の') + '矢印を消しますか？')) { delete b.next[n]; changed(day); }
    return;
  }
  if (ev.target.closest('[data-tray]')) { trayShut = !trayShut; try { localStorage.setItem('qrdemo.wbTray', trayShut ? '1' : ''); } catch (e) {} draw(); return; }
  const pl = ev.target.closest('[data-pl]');
  if (pl) { openPl.has(pl.dataset.pl) ? openPl.delete(pl.dataset.pl) : openPl.add(pl.dataset.pl); draw(); return; }
  if (!canEdit()) return;
  const m = ev.target.closest('.mg');
  if (m) { sel = sel && sel.n === m.dataset.n && sel.from === m.dataset.from ? null : { n: m.dataset.n, day: m.dataset.day, from: m.dataset.from }; draw(); return; }
  const add = ev.target.closest('[data-add]');
  if (add) { openForm(add.dataset.add, null); return; }
  const ed = ev.target.closest('[data-edit]');
  if (ed && !sel && !ev.target.closest('.grip')) {
    const day = ed.closest('.blk').dataset.day, b = S.boards[day].find(x => x.id === ed.dataset.edit);
    if (b) openForm(day, b);
    return;
  }
  const t = ev.target.closest('[data-drop]') || (ev.target.closest('.blk') && ev.target.closest('.blk').querySelector('[data-drop="mem"]'));
  if (t && sel) { const s = sel; sel = null; act(s, t, false); }
});
// ---- 枠の入力の画面：場所と業務は必須。業務は一覧から（一覧にないものは「その他（名前を書く）」） ----
let frmDay = '', frmBlk = null;
const OTHER = '__other';
function openForm(day, b) {
  frmDay = day; frmBlk = b;
  const places = new Set();
  Object.values(S.boards).forEach(l => l.forEach(x => { if (x.place) places.add(x.place); }));
  document.getElementById('plist').innerHTML = [...places].sort().map(p => '<option value="' + esc(p) + '">').join('');
  const works = (S.work[day] || []).map(w => w.s);
  const names = [...new Set(works.concat(BIZ))];
  const cur = b ? b.biz : '';
  const known = !cur || names.includes(cur);
  document.getElementById('fbz').innerHTML = '<option value="">－ 選ぶ －</option>'
    + (works.length ? '<optgroup label="この日の計画にある作業">' + works.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('') + '</optgroup>' : '')
    + '<optgroup label="業務">' + BIZ.filter(n => !works.includes(n)).map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('') + '</optgroup>'
    + '<option value="' + OTHER + '">一覧にない（名前を書く）</option>';
  document.getElementById('fbz').value = known ? cur : OTHER;
  document.getElementById('fbz2').value = known ? '' : cur;
  document.getElementById('fbx').hidden = known;
  document.getElementById('fpl').value = b ? b.place : '';
  document.getElementById('fnt').value = b ? b.note : '';
  document.getElementById('frmt').textContent = b ? '枠を直す' : '枠を足す（' + day.slice(5).replace('-', '/') + '）';
  document.getElementById('fdel').hidden = !b;
  document.getElementById('ferr').textContent = '';
  document.getElementById('frm').hidden = false;
  setTimeout(() => document.getElementById('fpl').focus(), 0);
}
function closeForm() { document.getElementById('frm').hidden = true; frmBlk = null; }
document.getElementById('fbz').onchange = e => { const o = e.target.value === OTHER; document.getElementById('fbx').hidden = !o; if (o) document.getElementById('fbz2').focus(); };
document.getElementById('fcancel').onclick = closeForm;
document.getElementById('frm').addEventListener('mousedown', e => { if (e.target.id === 'frm') closeForm(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('frm').hidden) closeForm(); });
document.getElementById('fdel').onclick = () => {
  const b = frmBlk, day = frmDay; if (!b) return;
  if (!confirm('この枠を消しますか？（札は「まだ置いていない人」へもどる）')) return;
  S.boards[day] = S.boards[day].filter(x => x !== b);
  S.boards[day].forEach(x => Object.keys(x.next).forEach(n => { if (x.next[n] === b.id) delete x.next[n]; }));
  closeForm(); changed(day);
};
document.getElementById('frmf').onsubmit = e => {
  e.preventDefault();
  const place = document.getElementById('fpl').value.trim().normalize('NFKC');
  const sv = document.getElementById('fbz').value;
  const biz = (sv === OTHER ? document.getElementById('fbz2').value : sv).trim();
  const note = document.getElementById('fnt').value.trim();
  const err = document.getElementById('ferr');
  if (!place && !biz) { err.textContent = '場所と業務を入れてください'; return; }
  if (!place) { err.textContent = '場所を入れてください（例：1H）'; document.getElementById('fpl').focus(); return; }
  if (!biz) { err.textContent = '業務を選んでください'; return; }
  const day = frmDay, w = (S.work[day] || []).find(x => x.s === biz);
  if (frmBlk) Object.assign(frmBlk, { place, biz, note, major: w ? w.s : (frmBlk.major === biz ? frmBlk.major : '') });
  else S.boards[day].push({ id: newId(), place, biz, note, major: w ? w.s : '', lead: [], mem: [], next: {} });
  closeForm(); changed(day);
};
// ---- つまみから引っぱって矢印をつなぐ（枠の4辺の丸 ＝ 業務から業務へ。札の右の丸 ＝ その人だけ途中からこっちへ） ----
let link = null;
board.addEventListener('pointerdown', ev => {
  const h = ev.target.closest('.hd, .hdm');
  if (!h || !canEdit()) return;
  ev.preventDefault(); ev.stopPropagation();
  const blk = h.closest('.blk'), m = h.closest('.mg');
  const r0 = h.getBoundingClientRect();
  link = { day: blk.dataset.day, from: blk.dataset.b, n: m ? m.dataset.n : '*', x: r0.left + r0.width / 2, y: r0.top + r0.height / 2, to: null };
  document.body.classList.add('linking');
  try { h.setPointerCapture(ev.pointerId); } catch (e) {}
  const move = e => {
    const tmp = document.getElementById('tmp');
    const dx = e.clientX - link.x, dy = e.clientY - link.y, d = Math.max(20, Math.min(70, Math.hypot(dx, dy) * 0.4));
    const sx = h.classList.contains('l') ? -1 : h.classList.contains('t') || h.classList.contains('b') ? 0 : 1, sy = h.classList.contains('t') ? -1 : h.classList.contains('b') ? 1 : 0;
    tmp.innerHTML = '<path d="M' + link.x + ',' + link.y + ' C' + (link.x + sx * d) + ',' + (link.y + sy * d) + ' ' + e.clientX + ',' + e.clientY + ' ' + e.clientX + ',' + e.clientY + '"/>';
    const el = document.elementFromPoint(e.clientX, e.clientY), t = el && el.closest('.blk');
    document.querySelectorAll('.blk.target').forEach(x => x.classList.remove('target'));
    link.to = t && t.dataset.day === link.day && t.dataset.b !== link.from ? t : null;
    if (link.to) link.to.classList.add('target');
  };
  const up = () => {
    h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
    document.getElementById('tmp').innerHTML = '';
    document.body.classList.remove('linking');
    document.querySelectorAll('.blk.target').forEach(x => x.classList.remove('target'));
    const L = link; link = null;
    if (!L || !L.to) return;
    const from = realize(L.day, L.from), to = realize(L.day, L.to.dataset.b);
    if (!from || !to || from === to) return;
    from.next[L.n] = to.id;
    toast(L.n === '*' ? '「' + [from.place, from.biz].filter(Boolean).join(' ') + '」が終わったら「' + [to.place, to.biz].filter(Boolean).join(' ') + '」へ' : short(L.n) + '：途中から「' + [to.place, to.biz].filter(Boolean).join(' ') + '」へ');
    changed(L.day);
  };
  h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
});
// つまみからは、札・枠のつかみ（並べ替え・動かす）を始めない
board.addEventListener('dragstart', ev => { if (link) { ev.preventDefault(); ev.stopImmediatePropagation(); } }, true);
document.getElementById('arrow').onclick = ev => { arrowMode = !arrowMode; ev.currentTarget.classList.toggle('on', arrowMode); document.body.classList.toggle('arrow', arrowMode); toast(arrowMode ? '人の札か枠の見出しをつかんで、行き先の枠へ落とす（もう一度押すと終わる）' : '矢印を引くのを終わりました'); };
window.addEventListener('resize', () => { if (S) draw(); });
async function go(k) {
  if (MOCK) { toast('試験のデータは1週間ぶんだけです'); return; }
  if (dirty.size) { clearTimeout(saveT); await flush(); }
  try { await load(k); draw(); } catch (e) { toast(e.message); }
}
document.getElementById('prev').onclick = () => go(addDays(start, -DAYS));
document.getElementById('next').onclick = () => go(addDays(start, DAYS));
document.getElementById('today').onclick = () => go(addDays(localToday(), -1));
load(MOCK ? '' : addDays(localToday(), -1)).then(draw).catch(e => { document.getElementById('board').innerHTML = '<p style="padding:16px">' + esc(e.message) + '</p>'; });
// 1分ごとに読み直す（ほかの人の手直しを取り込む。動かしている途中・保存待ちのときは待つ）
setInterval(() => { if (!TRY && !document.hidden && !dirty.size && !saving && !sel) load(start).then(draw).catch(() => {}); }, 60000);
</script>
