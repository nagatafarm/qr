<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カレンダー｜なえログ</title>
<script>
// カレンダーは「index.html?go=calendar」の中にはめ込んで出す（スケジュールと同じ）。直接開いたら、そちらへ移す。
// ?mock=1 は手元の試験用（cal_mock.json を読む）。はめ込まれたときは、リンクを画面全体で開く
(function () {
  const q = location.search, embed = /[?&]embed=1(&|$)/.test(q), mock = /[?&]mock=1(&|$)/.test(q);
  if (!embed && !mock && window.top === window.self) { location.replace('index.html?go=calendar'); return; }
  if (embed) {
    document.documentElement.classList.add('embed');
    const b = document.createElement('base'); b.target = '_top'; document.head.appendChild(b);
  }
})();
</script>
<script src="config.js?v=g1"></script>
<script src="common.js?v=g1"></script>
<script src="viewsync.js"></script>
<style>
  :root { --green: #4f9363; --green-d: #2f6b3a; --green-l: #f0f6f1; --orange: #d4834a; --orange-l: #fdf5ee; --line: #dfe5e0; --gray: #6b6b6b; --red: #c33; --bg: #f6f7f5; --side: 250px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: #222; font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; }
  button, select, input { font-family: inherit; }
  header { background: var(--green); color: #fff; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  header h1 { font-size: 17px; margin: 0; }
  header a { color: #fff; font-size: 13px; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 4px 10px; text-decoration: none; white-space: nowrap; }
  html.embed header, html.embed .bar a.link { display: none; }
  .muted { color: var(--gray); font-size: 12px; }

  /* 上の帯：今日・前・次・見出し・月/週 */
  .bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); }
  .bar button, .bar select { background: #fff; border: 1px solid #bbb; border-radius: 999px; padding: 5px 14px; font-size: 14px; cursor: pointer; color: #222; }
  .bar .nav { border-radius: 50%; width: 34px; height: 34px; padding: 0; font-size: 15px; }
  .bar .ttl { font-size: 19px; font-weight: bold; min-width: 9em; cursor: pointer; border-radius: 8px; padding: 2px 6px; }
  .bar .ttl:hover, .bar .ttl.open { background: #f1f4f1; }
  .bar .ttl::after { content: ' ▾'; font-size: 26px; line-height: 0; vertical-align: -2px; color: #777; font-weight: normal; }
  /* 見出しを押すと出る、小さなカレンダー（任意の日に飛ぶ） */
  #mini { position: fixed; z-index: 45; background: #fff; border: 1px solid #ccc; border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 8px 10px 10px; width: 260px; }
  #mini[hidden] { display: none; }
  #mini .mh { display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  #mini .mh button { border: none; background: none; font-size: 18px; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: #333; }
  #mini .g { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; text-align: center; }
  #mini .g .w { font-size: 11px; color: #888; padding: 2px 0; }
  #mini .g button { border: none; background: none; height: 32px; padding: 0; cursor: pointer; font-size: 13px; color: #222; border-radius: 50%; }
  #mini .g button.o { color: #bbb; }
  #mini .g button.in { background: var(--green-l); border-radius: 0; }
  #mini .g button.t { color: #1a73e8; font-weight: bold; box-shadow: inset 0 0 0 2px #1a73e8; border-radius: 50%; }
  #mini .g .sun { color: #d33; } #mini .g .sat { color: #1a5fb4; }
  #mini .mh button:hover, #mini .g button:hover { background: #e3ece4; }
  #mini .mf { display: flex; justify-content: flex-end; margin-top: 6px; }
  #mini .mf button { background: #fff; border: 1px solid #bbb; border-radius: 999px; padding: 3px 12px; font-size: 12px; cursor: pointer; }
  .bar .seg { display: inline-flex; border: 1px solid #bbb; border-radius: 999px; overflow: hidden; }
  .bar .seg button { border: none; border-radius: 0; padding: 5px 14px; }
  .bar .seg button.on { background: var(--green-l); color: var(--green-d); font-weight: bold; }
  .bar .sp { flex: 1; }
  .bar .loading { font-size: 12px; color: var(--green-d); }
  .bar .loading[hidden] { display: none; }
  /* 絞り込み中の札：上の帯の中に出す（出ても消えても、カレンダーの大きさは変わらない） */
  .bar .fnote { display: inline-flex; align-items: center; gap: 6px; background: var(--orange-l); border: 1px solid #ecc3a3; color: #9a5320; border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 12px; white-space: nowrap; }
  .bar .fnote[hidden] { display: none; }
  .bar .fnote button { background: #fff; border: 1px solid #ecc3a3; color: #9a5320; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .bar a.link { font-size: 13px; color: var(--green-d); white-space: nowrap; }
  /* カレンダー／人の割り振り表の切り替え：どちらの画面でも、白い帯の右はしの同じ場所に出す */
  .bar .vsw { display: inline-flex; border: 1px solid #bbb; border-radius: 999px; overflow: hidden; }
  .bar .vsw a { padding: 5px 14px; font-size: 13px; color: #333; text-decoration: none; white-space: nowrap; background: #fff; }
  .bar .vsw a + a { border-left: 1px solid #bbb; }
  .bar .vsw a.on { background: var(--green-l); color: var(--green-d); font-weight: bold; }
  @media (max-width: 560px) { .bar .vsw { max-width: 100%; overflow-x: auto; } .bar .vsw a { padding: 5px 9px; font-size: 12px; } }   /* 4つ並んでも、スマホの幅に収める */
  #fbtn { display: none; }

  .body { flex: 1; min-height: 0; display: flex; }
  /* 左の列：レイヤ（チェックで出す・隠す） */
  aside { width: var(--side); flex: none; overflow-y: auto; background: #fff; border-right: 1px solid var(--line); padding: 10px 12px 60px; }
  aside h3 { font-size: 13px; margin: 14px 0 6px; color: #333; display: flex; align-items: center; justify-content: space-between; }
  aside h3:first-child { margin-top: 2px; }
  aside h3 button { font-size: 11px; background: none; border: none; color: var(--green-d); cursor: pointer; padding: 0; }
  aside label { display: flex; align-items: center; gap: 7px; padding: 3px 2px; cursor: pointer; font-size: 13px; border-radius: 6px; }
  aside label:hover { background: #f4f6f4; }
  aside label .n { margin-left: auto; color: #999; font-size: 11px; }
  aside input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--c, var(--green)); flex: none; }
  aside .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
  aside details { margin-left: 4px; }
  aside details > summary { list-style: none; cursor: pointer; }
  aside details > summary::-webkit-details-marker { display: none; }
  aside details > summary label { padding-left: 0; }
  aside details > summary .tw { width: 18px; color: #888; font-size: 16px; flex: none; text-align: center; transition: transform .15s; }
  aside details[open] > summary .tw { transform: rotate(90deg); }
  aside .kids { margin-left: 20px; }
  aside .preset { display: flex; gap: 6px; flex-wrap: wrap; }
  aside .preset select { flex: 1 1 100%; padding: 6px; border: 1px solid #bbb; border-radius: 8px; font-size: 14px; background: #fff; }
  aside .preset button, aside .allbtn { background: #fff; border: 1px solid #bbb; border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  aside .allbtn { width: 100%; margin-top: 6px; padding: 6px; font-size: 13px; }
  /* 使えないときも消さずに薄くする（出たり消えたりして、下の行がずれないように） */
  aside button:disabled { opacity: .4; cursor: default; }
  aside .opt { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gray); margin-bottom: 6px; white-space: nowrap; }
  aside .opt select { min-width: 0; max-width: 100%; flex: 1; }
  aside .opt select { font-size: 13px; padding: 3px 6px; border: 1px solid #bbb; border-radius: 6px; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; }
  .note { margin: 8px 12px 0; background: var(--orange-l); border: 1px solid #ecc3a3; color: #9a5320; border-radius: 10px; padding: 6px 10px; font-size: 13px; }
  .dow { flex: none; display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); }
  .dow div { text-align: center; font-size: 11px; color: var(--gray); padding: 4px 0; }
  .dow .sun { color: #c44; } .dow .sat { color: #2f6fb7; }
  #scroller { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; position: relative; }

  /* 月表示：週の行を縦に続ける */
  .wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); min-height: 118px; }
  .day { border-right: 1px solid var(--line); padding: 3px 4px 4px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .day:last-child { border-right: none; }
  .day.odd { background: #fbfbf8; }
  .day.past { background: #f7f7f7; }
  .day .dn { text-align: center; font-size: 12px; color: #444; height: 22px; line-height: 22px; }
  .day .dn b { display: inline-block; min-width: 22px; height: 22px; border-radius: 999px; }
  .day.today .dn b { background: #1a73e8; color: #fff; }
  .day.first .dn { font-weight: bold; }
  .chip { display: flex; align-items: baseline; gap: 4px; width: 100%; text-align: left; border: none; border-radius: 5px; background: var(--c); color: #fff; font-size: 12px; padding: 2px 6px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .chip b { font-weight: bold; }
  .chip small { margin-left: auto; opacity: .9; font-size: 10px; }
  .chip.done { opacity: .42; }
  .chip.part { background: linear-gradient(90deg, var(--c) var(--p), color-mix(in srgb, var(--c) 55%, #fff) var(--p)); }
  .load { margin-top: auto; font-size: 10px; color: #8a8a8a; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .load.over { color: #fff; background: var(--red); border-radius: 4px; padding: 0 4px; font-weight: bold; }
  .wait { color: #bbb; font-size: 11px; text-align: center; }

  /* 週表示：日の列を横に続ける */
  /* 週表示：表全体を縦にも横にも動かす。くるくる＝縦、Shift＋くるくる＝横（Chrome にもともとある動き） */
  #scroller.week { overflow: auto; }
  /* 2週：1列をせまくする（PC で14日が1画面に入る）。字は少し小さく */
  /* 2週：2段（上に1週目、下に2週目）。列の幅は週と同じ（7日で横いっぱい）。上下に動かす（2026-11-23 意見） */
  /* せまい画面（スマホ）では列がつぶれないよう、1列 140px より細くしない（横にも動かせる）。2026-11-23 意見 */
  #scroller.w2 { overflow: auto; }
  #scroller.w2 .w2row { border-bottom: 3px solid #d5dbd5; }
  #scroller.w2 .strip { display: flex; width: max-content; min-width: 100%; }
  #scroller.w2 .col { width: max(140px, calc((100vw - var(--side) - 18px) / 7)); }
  #scroller.w2 .col .ch { position: relative; z-index: auto; }
  /* 列を横に並べる箱。高さは「画面の高さ」か「いちばん長い列」の大きいほうで、どの列もその高さにそろう（区切り線が途中で切れない） */
  #scroller.week .strip { display: flex; align-items: stretch; width: max-content; min-height: 100%; }
  /* 列の頭に吸い付くのはスマホ（指で送る）だけ。PC で付けると、ホイールで少し動かしても元の列へ引き戻される */
  @media (max-width: 820px) and (pointer: coarse) { #scroller.week { scroll-snap-type: x proximity; } }
  .col { flex: none; width: max(var(--colmin, 150px), calc((100vw - var(--side) - 2px) / var(--days, 7)));border-right: 1px solid var(--line); display: flex; flex-direction: column; scroll-snap-align: start; }
  .col.past { background: #f7f7f7; }
  .col .ch { flex: none; text-align: center; padding: 6px 4px; border-bottom: 1px solid var(--line); background: #fff; position: sticky; top: 0; z-index: 2; }
  .col.past .ch { background: #f7f7f7; }
  .col .ch .w { font-size: 11px; color: var(--gray); }
  .col .ch .w.sun { color: #c44; } .col .ch .w.sat { color: #2f6fb7; }
  .col .ch .d { font-size: 20px; }
  .col.today .ch .d b { background: #1a73e8; color: #fff; border-radius: 999px; padding: 0 8px; }
  .col .ch .load { text-align: center; margin-top: 2px; }
  .col .cb { flex: 1 0 auto; padding: 6px; }
  .grp { margin-bottom: 8px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--c) 35%, #fff); overflow: hidden; }
  .grp .gh { background: var(--c); color: #fff; padding: 4px 8px; font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .grp .gh small { margin-left: auto; flex: none; }
  .grp.band { position: relative; z-index: 1; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .grp.tail { visibility: hidden; }
  .grp .gh .spd { font-size: 11px; opacity: .9; margin-left: 2px; }
  /* のばした作業の帯：右の端ぜんぶが「つまみ」。横に引っぱってのばす・縮める（2026-11-24 意見：もっと横にのばせそうな見た目に） */
  .grp.ed, .grp.spg { position: relative; }
  .grp.spg.ed .gh, .grp.spg.ed a.row { padding-right: 18px; }
  .grp .gx.l { left: 0; right: auto; border-left: none; border-right: 1px solid color-mix(in srgb, var(--c) 40%, #fff); }
  .grp .gx.l::after { content: '‹'; }
  .grp:not(.spg) .gx, .grp.spg .gx.l { width: 9px; }
  @media (hover: hover) { .grp:not(.spg) .gx, .grp.spg .gx.l { opacity: 0; transition: opacity .1s; } .grp:hover .gx, .grp .gx.on { opacity: 1; } }
  .grp .gx { position: absolute; right: 0; top: 0; bottom: 0; width: 12px; cursor: ew-resize; touch-action: none; z-index: 2;
    background: color-mix(in srgb, var(--c) 22%, #fff); border-left: 1px solid color-mix(in srgb, var(--c) 40%, #fff); display: flex; align-items: center; justify-content: center; }
  .grp .gx::before { content: ''; width: 4px; height: 16px; border-left: 2px dotted var(--c); border-right: 2px dotted var(--c); }
  .grp .gx::after { content: '›'; position: absolute; top: 1px; left: 0; right: 0; text-align: center; color: #fff; font-weight: bold; font-size: 13px; line-height: 18px; }
  .grp .gx:hover, .grp .gx.on { background: var(--c); }
  .grp .gx:hover::before, .grp .gx.on::before { border-color: #fff; }
  .grp:not(.spg) .gx::before, .grp .gx.l::before { height: 12px; width: 2px; border-right: none; }
  /* 引っぱっている間の、のびる先の見本（点線の帯） */
  #ghost { position: fixed; z-index: 30; pointer-events: none; border: 2px dashed var(--c, #1a73e8); border-radius: 8px; background: color-mix(in srgb, var(--c, #1a73e8) 14%, transparent); display: flex; align-items: flex-start; justify-content: flex-end; }
  #ghost[hidden], #ghost b[hidden] { display: none; }
  /* 計画の予定日より後ろの日（のばした・動かした分。前に入るのはよい）：斜線とオレンジの線（2026-11-24 意見） */
  .grp .offd { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 1; border-top: 3px solid #f08c00;
    background: repeating-linear-gradient(135deg, rgba(240,140,0,.20) 0 6px, transparent 6px 12px); }
  .grp .gh .mv { font-size: 10px; background: #fff3d6; color: #8a5a00; border-radius: 999px; padding: 0 6px; flex: none; }
  /* 見出しをつかんで、別の日へ動かす（マウス） */
  .grp.ed > .gh { cursor: grab; }
  body.moving, body.moving * { cursor: grabbing !important; user-select: none; }
  /* 手直しの履歴（右に出す・しまう） */
  #histbtn { position: relative; }
  #hpanel { position: fixed; right: 0; top: 96px; bottom: 0; width: 330px; max-width: 92vw; box-sizing: border-box; background: #fff; border-left: 1px solid var(--line); box-shadow: -4px 0 12px rgba(0,0,0,.08); z-index: 40; display: flex; flex-direction: column; }
  #hpanel[hidden] { display: none; }
  #hpanel .hh { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-weight: bold; }
  #hpanel .hh .sp { flex: 1; }
  #hpanel .hh button { font-size: 12px; padding: 2px 8px; white-space: nowrap; flex: none; }
  #hpanel .hh { white-space: nowrap; }
  #hpanel ol { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  #hpanel li { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
  #hpanel li .tm { color: var(--gray); font-size: 11px; margin-right: 6px; }
  #hpanel li.undone { color: #aaa; text-decoration: line-through; }
  #hpanel .hf { padding: 6px 10px; font-size: 11px; color: var(--gray); border-top: 1px solid var(--line); }   /* 離したら消す（display:flex が hidden に勝って、残っていた） */
  #ghost b { background: var(--c, #1a73e8); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 0 6px 0 6px; white-space: nowrap; }
  .grp .gh .tg { font-size: 23px; width: 18px; line-height: 1; flex: none; transition: transform .15s; }
  .grp.shut .gh .tg { transform: rotate(-90deg); }
  .grp.shut a.row { display: none; }
  .grp a.row { display: block; padding: 4px 8px; border-top: 1px solid #eee; color: #222; text-decoration: none; font-size: 12px; }
  .grp a.row:hover { background: #f6f8f6; }
  .grp a.row .nm { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grp a.row .sub { color: var(--gray); font-size: 11px; display: flex; gap: 6px; white-space: nowrap; }
  .grp a.row .sub span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .grp a.row .sub b { color: #222; margin-left: auto; }
  .grp a.row.done { opacity: .5; }
  .grp a.row.done .nm::before { content: '✓ '; color: var(--green-d); }
  .empty { color: #bbb; font-size: 12px; text-align: center; margin-top: 12px; }
  /* 必要人数（工程の見出し）。計画担当は押して人数を手で決められる（2026-11-23 近藤さんFB） */
  .grp .gh .ppl { flex: none; font-size: 11px; background: rgba(255,255,255,.25); border-radius: 999px; padding: 0 6px; }
  .grp .gh .ppl.man { background: #fff; color: var(--c); font-weight: bold; }
  .grp .gh .ppl.edit { cursor: pointer; text-decoration: underline dotted; }
  /* メモ（計画にない作業：土づくり・廃棄・除草剤 など） */
  .cnote { display: block; background: #fff6c8; border: 1px solid #e8d48a; color: #5a4800; border-radius: 5px; font-size: 11px; padding: 1px 5px; margin-top: 2px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cnote.del { cursor: pointer; }
  .addnote { border: 1px dashed #c9b25a; background: none; color: #8a7420; border-radius: 5px; font-size: 11px; padding: 0 6px; cursor: pointer; margin-top: 2px; font-family: inherit; }
  .day .addnote { align-self: flex-start; }
  /* マウスのある画面では、「＋メモ」はその日に乗ったときだけ出す（並ぶとうるさい） */
  /* スマホ（マウスを乗せられない）の月：「＋メモ」の枠はやめて、日のマスの右上に小さな「＋」だけ（2026-11-23 意見） */
  @media (hover: none) { .day { position: relative; } .day .addnote, .col .ch .addnote { position: absolute; top: 1px; right: 1px; margin: 0; border: none; padding: 3px 5px; font-size: 0; line-height: 1; } .day .addnote::before, .col .ch .addnote::before { content: '＋'; font-size: 15px; color: #b39a3a; } }
  @media (hover: hover) { .addnote { opacity: 0; } .col:hover .addnote, .day:hover .addnote, .addnote:focus { opacity: 1; } }
  /* 計画ごとのまとめ（取引先＝メーカー・品目・ハウス）。押すと中の計画を出す */
  .grp .sum { display: flex; gap: 6px; align-items: center; padding: 4px 8px; border-top: 1px solid #eee; font-size: 12px; cursor: pointer; background: #fafcfa; white-space: nowrap; }
  .grp .sum b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .grp .sum .tw2 { font-size: 19px; width: 15px; line-height: 1; flex: none; color: #555; transform: rotate(-90deg); transition: transform .15s; }
  .grp .sum.open .tw2 { transform: none; }
  .day .grp .sum .tw2 { font-size: 13px; width: 11px; }
  .grp.shut .sum { display: none; }
  .grp a.row.sub2 { padding-left: 22px; }
  .grp .nrow { display: block; padding: 4px 8px; border-top: 1px solid #eee; font-size: 12px; background: #fffbe6; }

<script>
// ===== カレンダー：計画の作業（工程 × 計画）を、月・週で並べる。左のチェックで出す・隠す（Google カレンダーのレイヤと同じ） =====
const MOCK = /[?&]mock=1(&|$)/.test(location.search);
function load(k) { try { return localStorage.getItem('qrdemo.' + k) || ''; } catch (e) { return ''; } }
function save(k, v) { try { localStorage.setItem('qrdemo.' + k, v); } catch (e) {} }
function loadJson(k, d) { try { const v = JSON.parse(load(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.className = ''; }, 3000);
}
const num = h => String(Math.round(Number(h) * 10) / 10);

// ---- 日付（yyyy-MM-dd の文字で持つ） ----
const DAY = 86400000;
const utc = k => Date.parse(k + 'T00:00:00Z');
const addDays = (k, n) => new Date(utc(k) + n * DAY).toISOString().slice(0, 10);
const dow = k => new Date(utc(k)).getUTCDay();
const diff = (a, b) => Math.round((utc(b) - utc(a)) / DAY);
function localToday() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const TODAY = localToday();
const WD = '日月火水木金土';
const md = k => Number(k.slice(5, 7)) + '/' + Number(k.slice(8));
const label = k => md(k) + '(' + WD[dow(k)] + ')';

// ---- 見え方の好み（このブラウザに覚える） ----
// 表示：month 月／week 週（7日）／week2 2週（14日を1画面に。2026-11-23 近藤さんFB）。week と week2 は列の幅と送る日数だけがちがう
let view = ['week', 'week2'].includes(load('calView')) ? load('calView') : 'month';
const span = () => view === 'week2' ? 14 : 7;
let wdStart = /^[0-6]$/.test(load('calDow')) ? Number(load('calDow')) : 0;   // 週の始まりの曜日（0＝日）
// 隠すもの（新しく出てきた工程・品目・取引先は、はじめは出す）。s ＝ 工程、t ＝ 「営利|野菜|トマト」、c ＝ 取引先
let off = fromSaved(loadJson('calOff', {}));
let presets = loadJson('calPresets', {});           // 自分の担当：名前 → { s, t, c }
let presetName = load('calPreset');
function fromSaved(o) { return { s: new Set(o.s || []), t: new Set(o.t || []), c: new Set(o.c || []) }; }
function toSaved(o) { return { s: [...o.s], t: [...o.t], c: [...o.c] }; }
function saveOff() { save('calOff', JSON.stringify(toSaved(off))); }

// ---- 工程の色（決まった色。ほかの工程は順に） ----
const STEP_COLORS = { '播種': '#8e44ad', '土入れ': '#a0662b', '土並べ': '#b08900', '鉢上げ': '#2e8b57', '接木': '#d0457a', '出荷': '#1a8fd8' };
const MORE_COLORS = ['#e07b39', '#5c6bc0', '#00897b', '#6d4c41', '#c0392b', '#7f8c8d'];
function colorOf(s) {
  if (STEP_COLORS[s]) return STEP_COLORS[s];
  const i = steps.filter(x => !STEP_COLORS[x]).indexOf(s);
  return MORE_COLORS[(i < 0 ? 0 : i) % MORE_COLORS.length];
}

// ---- データ：28日ずつの塊で読む。塊は覚えておき、このブラウザにも取っておく（次に開いたとき、すぐ出す） ----
const EPOCH = '2025-12-28', BLOCK = 28, FRESH_MS = 60000;
const blocks = new Map();          // 塊の番号 → { events, days, at }
const inflight = new Map();
let plans = {}, steps = [];
let byDay = new Map();             // 日 → [作業]
let capOf = new Map();             // 日 → 出勤の時間の合計
let capN = new Map();              // 日 → 出勤する人数
let notesOf = new Map();           // 日 → [メモ]（カレンダーの手直し）
let manPeople = {};                // '日|工程' → 手で決めた人数
// 行のまとめ方：c 取引先（メーカー）ごと／i 品目ごと／h ハウスごと／row 1行ずつ。はじめは取引先ごと（生産計画＝Excel の1ファイルごとに見る。近藤さんFB）
let groupBy = ['row', 'c', 'i', 'h'].includes(load('calGroup')) ? load('calGroup') : 'c';
const sumOpen = new Set();         // ひらいている、まとめの行（日|工程|まとめの名前）
// 手直し（メモ・人数・日数）ができるか：ログインした計画担当。手元の試験（?mock=1）では、いつでもできる
// 窓口に「計画担当だけ」と断られたら true（ログインのあとで部署が変わった人。このブラウザが覚えている権限が古い）。以後、手直しの部品を出さない
let editDenied = false;
function canEdit() { if (MOCK) return true; if (editDenied) return false; try { return !!(authToken() && authCaps().planner); } catch (e) { return false; } }
const blockOf = k => Math.floor(diff(EPOCH, k) / BLOCK);
const blockStart = b => addDays(EPOCH, b * BLOCK);
(function restore() {
  const v = loadJson('calCache', null);
  if (!v || !v.blocks) return;
  plans = v.plans || {}; steps = v.steps || [];
  Object.keys(v.blocks).forEach(b => blocks.set(Number(b), Object.assign(v.blocks[b], { at: 0 })));   // 古い扱い（すぐ読み直す）
  reindex();
})();
function persist() {
  // 今日に近い8塊だけ取っておく（localStorage の大きさを守る）
  const t = blockOf(TODAY), keep = {};
  [...blocks.keys()].sort((a, b) => Math.abs(a - t) - Math.abs(b - t)).slice(0, 8).forEach(b => { const x = blocks.get(b); keep[b] = { events: x.events, days: x.days, notes: x.notes || [] }; });
  const used = new Set(); Object.values(keep).forEach(x => x.events.forEach(e => used.add(e.id)));
  const pl = {}; used.forEach(id => { if (plans[id]) pl[id] = plans[id]; });
  try { localStorage.setItem('qrdemo.calCache', JSON.stringify({ blocks: keep, plans: pl, steps })); } catch (e) {}
}
function reindex() {
  byDay = new Map(); capOf = new Map(); capN = new Map(); notesOf = new Map();
  blocks.forEach(x => {
    x.events.forEach(e => { if (!byDay.has(e.d)) byDay.set(e.d, []); byDay.get(e.d).push(e); });
    x.days.forEach(d => { capOf.set(d.d, d.cap); capN.set(d.d, d.n || 0); });
    (x.notes || []).forEach(n => { if (!notesOf.has(n.d)) notesOf.set(n.d, []); notesOf.get(n.d).push(n); });
  });
}
// 手元の試験用（?mock=1）：手直しは、このページの中だけに覚える
const mockEdits = { notes: [], people: {}, spans: {} };
async function fetchRange(from, to) {
  if (!MOCK) return callApi('api=calendar&from=' + from + '&to=' + to);
  const all = window.__mock || (window.__mock = await (await fetch('cal_mock.json', { cache: 'no-store' })).json());
  await new Promise(r => setTimeout(r, 400));
  const ev = [];
  all.events.forEach(e => {
    const sp = mockEdits.spans[e.id + '|' + e.s], n = sp ? (sp.n || sp) : 1, st = (sp && sp.st) || e.d;
    for (let i = 0; i < n; i++) ev.push(Object.assign({}, e, { o: e.d, d: addDays(st, i), q: e.q === '' ? '' : Math.round(e.q / n * 10) / 10, h: e.h == null ? null : e.h / n, part: i + 1, of: n, d0: st }));
  });
  return Object.assign({}, all, { from, to, events: ev.filter(e => e.d >= from && e.d <= to), days: all.days.filter(d => d.d >= from && d.d <= to),
    notes: mockEdits.notes.flatMap(x => Array.from({ length: x.n || 1 }, (_, i) => ({ id: x.id, t: x.t, by: x.by, d: addDays(x.d, i), part: i + 1, of: x.n || 1, d0: x.d }))).filter(x => x.d >= from && x.d <= to), people: Object.assign({}, mockEdits.people) });
}
// 手直しを窓口に送る。送ったら、読み込んだ分を古い扱いにして読み直す
async function calEditApi(o) {
  if (MOCK) {
    if (o.op === 'note') mockEdits.notes.push({ id: String(Date.now()), d: o.d, t: o.text, by: 'ためし', n: 1 });
    if (o.op === 'notespan') o.items.forEach(x => { const n = mockEdits.notes.find(y => y.id === x.id); if (n) { n.d = x.d; n.n = x.n; } });
    if (o.op === 'delnote') mockEdits.notes = mockEdits.notes.filter(n => n.id !== o.id);
    if (o.op === 'people') { if (o.n === '') delete mockEdits.people[o.d + '|' + o.s]; else mockEdits.people[o.d + '|' + o.s] = Number(o.n); }
    if (o.op === 'span') { if (o.days > 1) mockEdits.spans[o.id + '|' + o.s] = o.days; else delete mockEdits.spans[o.id + '|' + o.s]; }
    if (o.op === 'spans') o.items.forEach(x => { const key = x.id + '|' + x.s; if (x.days > 1 || x.start) mockEdits.spans[key] = { n: x.days, st: x.start }; else delete mockEdits.spans[key]; });
  } else {
    try {
      await postApi(Object.assign({ action: 'calEdit', from: TODAY, to: TODAY }, o));
    } catch (e) {
      // 保存できなかった：画面の上だけ変わった分を、窓口の中身に戻す。計画担当でないと断られたら、手直しの部品も消す
      if (/計画担当だけ/.test(e && e.message || '')) editDenied = true;
      blocks.forEach(x => { x.at = 0; });
      draw(true); need();
      throw e;
    }
  }
  blocks.forEach(x => { x.at = 0; });
  need();
}
function fetchBlock(b) {
  if (inflight.has(b)) return inflight.get(b);
  const from = blockStart(b), to = addDays(from, BLOCK - 1);
  const p = fetchRange(from, to).then(r => {
    Object.assign(plans, r.plans || {});
    if (r.steps && r.steps.length) steps = r.steps;
    blocks.set(b, { events: r.events || [], days: r.days || [], notes: r.notes || [], at: Date.now() });
    if (r.people) manPeople = r.people;
    if (r.noBook) noBook = true;
    reindex(); persist(); return r;
  }).finally(() => { inflight.delete(b); showLoading(); });
  inflight.set(b, p); showLoading();
  return p;
}
let noBook = false;
function showLoading() { document.getElementById('loading').hidden = !inflight.size; }
// 見ている範囲の塊を読む（ない・古いものだけ）。届いたら描き直す
let lastErr = 0;
function ensure(from, to) {
  const need = [];
  for (let b = blockOf(from); b <= blockOf(to); b++) {
    const x = blocks.get(b);
    if (!inflight.has(b) && (!x || Date.now() - x.at > FRESH_MS)) need.push(b);
  }
  need.forEach(b => fetchBlock(b).then(() => draw(true)).catch(e => {
    if (Date.now() - lastErr > 5000) { lastErr = Date.now(); toast(e.message, true); }
  }));
}

// ---- 絞り込み ----
const tkey = p => p.k + '|' + p.f + '|' + p.i;
const custOf = p => p.c || '（なし）';
function shown(e) {
  const p = plans[e.id] || { k: '量販', f: '未分類', i: '（品目なし）', c: '' };
  return !off.s.has(e.s) && !off.t.has(tkey(p)) && !off.c.has(custOf(p));
}
function eventsOn(k) { return (byDay.get(k) || []).filter(shown); }
const offCount = () => off.s.size + off.t.size + off.c.size;

// ---- 左の列 ----
function tree() {
  // 営利/量販 → 花/野菜 → 品目。数は読み込んだ分の作業の件数
  const t = {}, cnt = {};
  const seen = new Set();
  byDay.forEach(list => list.forEach(e => { cnt[e.id] = (cnt[e.id] || 0) + 1; seen.add(e.id); }));
  seen.forEach(id => {
    const p = plans[id]; if (!p) return;
    ((t[p.k] = t[p.k] || {})[p.f] = t[p.k][p.f] || {})[p.i] = (t[p.k][p.f][p.i] || 0) + cnt[id];
  });
  return t;
}
const ORDER_K = ['営利', '量販'], ORDER_F = ['野菜', '花', '未分類'];
const sortBy = order => (a, b) => (order.indexOf(a) < 0 ? 99 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 99 : order.indexOf(b)) || a.localeCompare(b, 'ja');
function drawSide() {
  const t = tree();
  // 取引先は、営利／量販ごとに分けて数える（絞り込みの鍵は取引先の名前のまま。両方にある取引先は、両方に出て一緒に切り替わる）
  const stepCnt = {}, custK = {};
  byDay.forEach(list => list.forEach(e => { stepCnt[e.s] = (stepCnt[e.s] || 0) + 1; const p = plans[e.id]; if (p) { const g = custK[p.k] = custK[p.k] || {}; g[custOf(p)] = (g[custOf(p)] || 0) + 1; } }));
  const keysUnder = (k, f) => Object.keys(t[k] || {}).filter(x => !f || x === f).flatMap(ff => Object.keys(t[k][ff]).map(i => k + '|' + ff + '|' + i));
  const box = (keys, attrs) => {
    const on = keys.filter(x => !off.t.has(x)).length;
    return `<input type="checkbox" ${attrs} ${on === keys.length ? 'checked' : ''} data-mix="${on > 0 && on < keys.length ? 1 : ''}">`;
  };
  const openK = loadJson('calOpen', {});
  const kHtml = Object.keys(t).sort(sortBy(ORDER_K)).map(k => {
    const fs = Object.keys(t[k]).sort(sortBy(ORDER_F));
    return `<details data-open="${esc(k)}"${openK[k] !== false ? ' open' : ''}><summary><label><span class="tw">▶</span>${box(keysUnder(k), `data-tk="${esc(k)}"`)}<b>${esc(k)}</b></label></summary>
      <div class="kids">${fs.map(f => {
        const items = Object.keys(t[k][f]).sort((a, b) => a.localeCompare(b, 'ja'));
        const ok = k + '/' + f;
        return `<details data-open="${esc(ok)}"${openK[ok] ? ' open' : ''}><summary><label><span class="tw">▶</span>${box(keysUnder(k, f), `data-tk="${esc(k)}" data-tf="${esc(f)}"`)}${esc(f)}<span class="n">${items.length}品目</span></label></summary>
          <div class="kids">${items.map(i => { const key = k + '|' + f + '|' + i; return `<label><input type="checkbox" data-ti="${esc(key)}"${off.t.has(key) ? '' : ' checked'}>${esc(i)}<span class="n">${t[k][f][i]}</span></label>`; }).join('')}</div></details>`;
      }).join('')}</div></details>`;

function stepGroups(list) {
  const g = new Map();

  return steps.filter(s => g.has(s)).concat([...g.keys()].filter(s => !steps.includes(s))).map(s => {
    const es = g.get(s), q = es.reduce((n, e) => n + (Number(e.q) || 0), 0), dn = es.filter(e => e.done).length;

}

function dispGroups(list) {

  const sp = new Map();
  list.filter(isSp).forEach(e => { const key = e.s + '|' + e.id + '@' + (e.d0 || ''); if (!sp.has(key)) sp.set(key, []); sp.get(key).push(e); });
  [...sp.values()].forEach(es => {
    const e = es[0], g = { s: e.s, es, q: es.reduce((n, x) => n + (Number(x.q) || 0), 0), dn: es.filter(x => x.done).length, span: e };
    const i = out.findIndex(x => x.s === e.s);
    const si = steps.indexOf(e.s);
    const j = i >= 0 ? i : out.findIndex(x => steps.indexOf(x.s) > si);
    out.splice(j < 0 ? out.length : j, 0, g);
  });

}

}

  const rows = view === 'month' ? [...s.querySelectorAll('.wk')] : [...s.querySelectorAll('.strip')];
  rows.forEach(row => {

    // つながり：となりの日の、同じ工程で、同じ計画（同じのばし始め）をふくむまとまり
    const chains = [], at = new Map();
    cells.forEach((c, i) => c.querySelectorAll('.grp.spg').forEach(g => {
      const prev = i > 0 ? [...cells[i - 1].querySelectorAll('.grp.spg')].find(p => p.dataset.gs === g.dataset.gs && p.dataset.sp === g.dataset.sp) : null;
      const ch = prev && at.get(prev) ? at.get(prev) : [];

  startDrag(h, h.closest('.grp'), 'size', ev, h.dataset.side || 'r');
  try { h.setPointerCapture(ev.pointerId); } catch (e) {}
  h.classList.add('on');
  h.onpointermove = moveDrag;
  h.onpointerup = h.onpointercancel = () => { h.onpointermove = h.onpointerup = h.onpointercancel = null; endDrag(); };
});
// 見出しをつかんで、別の日へ動かす（マウス。スマホは画面を動かす指と重なるので、つまみだけ）
sc().addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'touch' || ev.button !== 0) return;
  const gh = ev.target.closest('.grp.ed > .gh');
  if (!gh || ev.target.closest('.ppl.edit, small')) return;
  if (!canEdit()) { draw(true); return; }
  const grp = gh.parentElement, h = grp.querySelector(':scope > .gx.r');
  if (!h) return;
  const x0 = ev.clientX, y0 = ev.clientY, id = ev.pointerId;
  const mv = e => {
    if (!drag) {
      if (Math.hypot(e.clientX - x0, e.clientY - y0) < 6) return;   // 少し動かすまでは、押しただけ（たたむ・ひらく）
      startDrag(h, grp, 'move', { clientX: x0, clientY: y0 }, '');
      document.body.classList.add('moving');
      try { gh.setPointerCapture(id); } catch (e2) {}
    }
    moveDrag(e);
  };
  const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); if (drag && drag.mode === 'move') { dragJust = Date.now(); endDrag(); } };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
});
// のばした・動かした結果を、手元の読み込んだ分に先に当てて描き直す（窓口から返ってきたら、その中身で描き直す）
function preview(kind, s, items, a, days) {
  const ids = new Set(items.map(it => it.id)), r1 = v => Math.round(v * 10) / 10;
  if (kind === 'note') {
    const base = new Map();
    blocks.forEach(x => { x.notes = (x.notes || []).filter(n => { if (!ids.has(n.id)) return true; if (!base.has(n.id)) base.set(n.id, n); return false; }); });
    base.forEach(n => { for (let i = 0; i < days; i++) { const di = addDays(a, i), x = blocks.get(blockOf(di)); if (x) x.notes.push(Object.assign({}, n, { d: di, part: i + 1, of: days, d0: a })); } });
  } else {
    const base = new Map();
    blocks.forEach(x => { x.events = x.events.filter(e => { if (!(ids.has(e.id) && e.s === s)) return true; if (!base.has(e.id)) base.set(e.id, e); return false; }); });
    base.forEach(e => {
      const of = e.of || 1, q = e.q === '' ? '' : (Number(e.q) || 0) * of, h = e.h == null ? null : e.h * of;
      for (let i = 0; i < days; i++) { const di = addDays(a, i), x = blocks.get(blockOf(di)); if (x) x.events.push(Object.assign({}, e, { d: di, q: q === '' ? '' : r1(q / days), h: h == null ? null : h / days, part: i + 1, of: days, d0: a })); }
    });
  }
  reindex(); draw(true);
}
// 日の範囲を当てる（手元に先に当てて、窓口へ送る）
function applyRange(kind, s, items, a, days, msg) {
  preview(kind, s, items, a, days);
  if (kind === 'note') return sendEdit({ op: 'notespan', items: items.map(it => ({ id: it.id, d: a, n: days })) }, msg);
  return sendEdit({ op: 'spans', items: items.map(it => ({ id: it.id, s, days, start: a === it.o ? '' : a })) }, msg);
}
// ---- 手直しの履歴：戻す（Ctrl+Z）・やり直す（Ctrl+Y）。このブラウザに50件まで覚える ----
let hist = (() => { try { const v = JSON.parse(localStorage.getItem('qrdemo.calHist') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } })();
let hpos = hist.filter(x => !x.undone).length;   // 当てた数（これより後ろは「戻したもの」）
const saveHist = () => { try { localStorage.setItem('qrdemo.calHist', JSON.stringify(hist.slice(-50))); } catch (e) {} };
function run(x, back) {
  const st = back ? x.from : x.to, msg = (back ? '戻した：' : 'やり直した：') + x.text;
  if (x.type === 'range') return applyRange(x.kind, x.s, x.items, st.a, st.n, back || x.redo ? msg : x.text);
  if (x.type === 'people') return sendEdit({ op: 'people', d: x.d, s: x.s, n: st == null ? '' : String(st) }, back || x.redo ? msg : x.text);
}
function doEdit(x) {
  hist = hist.slice(0, hpos); x.at = Date.now(); hist.push(x); hpos = hist.length;
  if (hist.length > 50) { hist = hist.slice(-50); hpos = hist.length; }
  saveHist(); drawHist(); run(x, false);
}
function undo() {
  if (!canEdit()) return;
  if (!hpos) return toast('戻せる手直しがありません');
  const x = hist[--hpos]; x.undone = true; saveHist(); drawHist(); run(x, true);
}
function redo() {
  if (!canEdit()) return;
  if (hpos >= hist.length) return toast('やり直せる手直しがありません');
  const x = hist[hpos++]; x.undone = false; x.redo = true; saveHist(); drawHist(); run(x, false);
}
function drawHist() {
  const hb = document.getElementById('histbtn');
  hb.hidden = !canEdit();
  hb.textContent = '履歴' + (hpos ? ' ' + hpos : '');
  const p = document.getElementById('hpanel');
  if (p.hidden) return;
  const tm = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
  document.getElementById('hlist').innerHTML = hist.length ? hist.map((x, i) => ({ x, i })).reverse().map(({ x, i }) => `<li class="${i >= hpos ? 'undone' : ''}"><span class="tm">${tm(x.at)}</span>${esc(x.text)}</li>`).join('') : '<li class="undone" style="text-decoration:none">まだありません</li>';
  document.getElementById('h-undo').disabled = !hpos;
  document.getElementById('h-redo').disabled = hpos >= hist.length;
}
document.getElementById('histbtn').onclick = () => { const p = document.getElementById('hpanel'); p.hidden = !p.hidden; drawHist(); };
document.getElementById('h-x').onclick = () => { document.getElementById('hpanel').hidden = true; };
document.getElementById('h-undo').onclick = undo;
document.getElementById('h-redo').onclick = redo;
document.addEventListener('keydown', ev => {
  if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
  if (ev.target.closest && ev.target.closest('input, textarea, select, [contenteditable]')) return;
  const k = ev.key.toLowerCase();
  if (k === 'z' && !ev.shiftKey) { ev.preventDefault(); undo(); }
  else if (k === 'y' || (k === 'z' && ev.shiftKey)) { ev.preventDefault(); redo(); }
});
drawHist();
document.getElementById('fold').onclick = () => { foldAll = !foldAll; foldExc.clear(); save('calFold', foldAll ? '1' : ''); draw(true); };
function openPop(k, s) {
  const es = eventsOn(k).filter(e => e.s === s);
  if (!es.length) return;
  const by = new Map();
  es.forEach(e => { const p = plans[e.id] || {}, c = custOf(p); if (!by.has(c)) by.set(c, { q: 0, n: 0, dn: 0 }); const x = by.get(c); x.q += Number(e.q) || 0; x.n++; if (e.done) x.dn++; });
  const total = es.reduce((n, e) => n + (Number(e.q) || 0), 0), h = es.filter(e => !e.done && e.h != null).reduce((n, e) => n + e.h, 0);
  const pop = document.getElementById('pop');
  pop.innerHTML = `<div class="box" role="dialog" aria-label="${esc(s)}の内訳" style="--c:${colorOf(s)}">
    <div class="ph"><h2>${esc(label(k))}　${esc(s)}<br><span style="font-size:14px;font-weight:normal">${total ? num(total) + 'TR・' : ''}${es.length}件${es.some(e => e.done) ? '（済 ' + es.filter(e => e.done).length + '件）' : ''}${h ? '・残り ' + num(h) + ' 時間' : ''}</span></h2><button type="button" class="x" aria-label="閉じる">×</button></div>
    <div class="pb">
      <h4>取引先ごと</h4>
      <table><thead><tr><th>取引先</th><th class="r">量</th><th class="r">件数</th></tr></thead><tbody>
        ${[...by.entries()].sort((a, b) => b[1].q - a[1].q || b[1].n - a[1].n).map(([c, x]) => `<tr><td>${esc(c)}</td><td class="r">${x.q ? num(x.q) + 'TR' : '—'}</td><td class="r">${x.n}件${x.dn ? '（済 ' + x.dn + '）' : ''}</td></tr>`).join('')}
      </tbody></table>
      <h4>計画</h4>
      <table><thead><tr><th>計画</th><th>取引先</th><th class="r">量</th><th class="r">時間</th></tr></thead><tbody>
        ${es.slice().sort(byPlan).map(e => { const p = plans[e.id] || { n: e.id }; return `<tr class="${e.done ? 'done' : ''}"><td>${e.done ? '✓ ' : ''}<a href="index.html?id=${encodeURIComponent(e.id)}&view=1">${esc(p.n)}</a><span class="tag">${esc(p.k || '')}・${esc(p.f || '')}</span><div class="muted">${esc(e.id)}${p.v ? '　' + esc(p.v) : ''}</div></td><td>${esc(p.c || '')}</td><td class="r">${e.q !== '' ? esc(num(e.q)) + esc(e.u) : '—'}</td><td class="r">${e.done ? '済' : e.h != null ? num(e.h) + 'h' : '—'}</td></tr>`; }).join('')}
      </tbody></table>
      <p class="muted">時間は、残りの作業の時間（1人前で。作業ペースのシートから）。計画の名前を押すと、その計画の画面を開きます。</p>
    </div></div>`;
  pop.hidden = false;
  pop.querySelector('.x').onclick = () => { pop.hidden = true; };
}
document.getElementById('pop').addEventListener('click', ev => { if (ev.target.id === 'pop') ev.currentTarget.hidden = true; });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') document.getElementById('pop').hidden = true; });

// ---- はじめ ----
presetName = matchPreset();
drawSide();
document.getElementById('vsbtn').outerHTML = viewSync.button();
viewSync.bind(document.querySelector('[data-vsync]'), () => anchorDay());
reset(viewSync.day() || TODAY);   // 連動中は、ほかの画面で見ていた日から
// 手元の試験用：?mock=1&pop=日|工程 で、読み込んだあと内訳を開く
if (MOCK && /[?&]pop=/.test(location.search)) {
  const [pk, ps] = decodeURIComponent(location.search.match(/[?&]pop=([^&]*)/)[1]).split('|');
  const tryPop = () => (byDay.has(pk) ? openPop(pk, ps) : setTimeout(tryPop, 200));
  tryPop();
}
// 1分ごとに、見ている範囲を読み直す（画面を開いたままでも新しくなる）
setInterval(() => { if (!document.hidden) need(); }, FRESH_MS);
// データが届いたら左の列も描き直す（品目・取引先が増える）
const _draw = draw;
draw = function (keepPos) { _draw(keepPos); if (keepPos) drawSide(); };
</script>
