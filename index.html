<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR一元管理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
  :root { --orange: #d4834a; --orange-d: #9a5320; --orange-l: #fdf5ee; --green: #4f9363; --green-d: #2f6b3a; --green-l: #f0f6f1; --line: #d6e2d8; --gray: #6b6b6b; --red: #c33; --bg: #f6f7f5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #222; font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 15px; line-height: 1.5; }
  a { color: var(--green); }
  button { font-family: inherit; }
  header { background: var(--green); color: #fff; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { font-size: 12px; opacity: .9; }
  header a, header .hbtn { color: #fff; font-size: 13px; white-space: nowrap; background: none; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 4px 10px; text-decoration: none; cursor: pointer; }
  #sync { font-size: 12px; background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  #sync[hidden] { display: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 90px; }
  .muted { color: var(--gray); font-size: 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }

  /* 担当の登録 */
  .roles { display: grid; gap: 10px; margin-top: 12px; }
  .role { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; font-size: 17px; font-weight: bold; }
  .role small { display: block; font-weight: normal; font-size: 12px; color: var(--gray); margin-top: 2px; }
  .role.sel { border-color: var(--green); background: var(--green-l); }
  .field { display: block; margin-top: 16px; font-size: 13px; color: var(--gray); }
  .field input { display: block; width: 100%; font-size: 18px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 4px; font-family: inherit; }
  .primary { width: 100%; margin-top: 18px; padding: 14px; font-size: 17px; font-weight: bold; border-radius: 12px; border: none; background: var(--green); color: #fff; cursor: pointer; }
  .primary:disabled { background: #b9c9bd; }
  .names { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .nmbtn { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 16px; cursor: pointer; color: #222; }
  .nmbtn.sel { border-color: var(--green); background: var(--green-l); font-weight: bold; }
  .myassign { margin-bottom: 12px; border-color: var(--green); }
  .myassign h3 { margin: 0 0 6px; font-size: 15px; color: var(--green-d); }
  .myassign .ma { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 6px 0; border-top: 1px dashed #e5e5e5; font-size: 14px; }
  .myassign .ma a { font-weight: bold; color: inherit; }
  .myassign .ma .what { flex: 1; min-width: 90px; color: #444; }
  .backbtn { width: 100%; margin-top: 10px; padding: 12px; font-size: 15px; border-radius: 12px; border: 1px solid #ccc; background: #fff; color: #444; cursor: pointer; }

  /* 最初の画面（作業を登録する／作業を調べる） */
  .big { display: block; width: 100%; text-align: left; border: none; border-radius: 16px; padding: 28px 22px; margin-top: 16px; font-size: 26px; font-weight: bold; color: #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .big small { display: block; font-size: 13px; font-weight: normal; opacity: .95; margin-top: 6px; }
  .big.reg { background: var(--orange); }
  .big.find { background: var(--green); }
  .role.part { border-style: dashed; }
  /* パートさん用：だれとして記録するかの確認 */
  #ask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #ask[hidden] { display: none; }
  #ask .box { background: #fff; border-radius: 18px; padding: 24px 22px 20px; width: 88%; max-width: 380px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  #ask .msg { font-size: 23px; font-weight: bold; line-height: 1.4; }
  #ask button { display: block; width: 100%; margin-top: 12px; padding: 16px; font-size: 19px; font-weight: bold; border-radius: 12px; cursor: pointer; }
  #ask .yes { background: var(--green); color: #fff; border: none; }
  #ask .no { background: #fff; border: 2px solid #bbb; color: #444; }
  .whobar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-size: 16px; }
  .whobar b { font-size: 20px; }
  .whobar button { flex: none; background: #fff; border: 2px solid var(--orange); color: var(--orange-d); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: bold; cursor: pointer; }
  /* 調べる */
  .findrow { width: 100%; text-align: left; font-family: inherit; font-size: 15px; cursor: pointer; color: #222; }
  .findrow .fs span { margin-right: 10px; white-space: nowrap; }
  .findrow .fs .ok { color: var(--green-d); }
  button.btn-link { cursor: pointer; font-family: inherit; }

  /* タブ */
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 2px solid var(--line); }
  .tabs button { background: none; border: none; padding: 8px 12px; font-size: 15px; font-weight: bold; color: var(--gray); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tabs button.on { color: var(--green-d); border-bottom-color: var(--green); }
  .tabs .n { font-size: 12px; background: var(--orange); color: #fff; border-radius: 999px; padding: 0 7px; margin-left: 4px; }

  /* やること（担当者） */
  .day { margin: 16px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .day h3 { margin: 0; font-size: 15px; }
  .day h3 .when { font-size: 12px; font-weight: normal; border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
  .day h3 .late { background: #f8dcdc; color: var(--red); }
  .day h3 .today { background: #fbe4d2; color: var(--orange-d); }
  .selall { font-size: 13px; background: #fff; border: 1px solid var(--green); color: var(--green); border-radius: 8px; padding: 3px 10px; cursor: pointer; }
  .task { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
  .task.picked { border-color: var(--green); background: var(--green-l); }
  .task input[type=checkbox] { width: 24px; height: 24px; flex: none; accent-color: var(--green); }
  .task .body { flex: 1; min-width: 0; }
  .task .nm { font-weight: bold; }
  .task .nm a { color: inherit; text-decoration: none; }
  .task .fs { font-size: 12px; color: #444; }
  .task .fs b { font-weight: normal; color: var(--gray); }
  .task .warn { font-size: 11px; color: var(--orange-d); }
  .task .act { flex: none; display: flex; align-items: center; gap: 6px; }
  .qty { width: 64px; font-size: 16px; padding: 8px 6px; border: 1px solid #ccc; border-radius: 8px; text-align: right; font-family: inherit; }
  .done-btn { padding: 10px 14px; font-size: 15px; font-weight: bold; border-radius: 10px; border: none; background: var(--orange); color: #fff; cursor: pointer; white-space: nowrap; }
  .empty { text-align: center; padding: 30px 10px; color: var(--gray); }
  /* 場所（ハウス・ベンチ）の入力 */
  .place { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--gray); }
  .place input, .place select { font-size: 16px; padding: 7px 6px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; background: #fff; color: #222; }
  .place input { width: 62px; text-align: right; }
  .place input.memo { flex: 1; min-width: 120px; width: auto; text-align: left; }
  /* 不足（足りなかった本数）と、その対処 */
  .fixed { color: var(--green-d); }
  .sh { background: #fff; border: 1px solid #e3b4b4; border-left: 5px solid var(--red); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  .sh.ok { border-color: #cfe3d4; border-left-color: var(--green); background: var(--green-l); }
  .sh .top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .sh .top b { font-size: 16px; }
  .sh .t { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .sh .fx { display: flex; gap: 6px; margin-top: 8px; }
  .sh .fx input { flex: 1; min-width: 0; font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
  .sh .fx button { flex: none; padding: 8px 12px; font-size: 14px; font-weight: bold; border-radius: 8px; border: none; background: var(--green); color: #fff; cursor: pointer; }
  .sh .fx button.sub { background: #fff; color: var(--gray); border: 1px solid #ccc; font-weight: normal; }
  /* QR をまとめて読む */
  .scanbtn { display: block; width: 100%; margin: 0 0 4px; padding: 12px; background: #fff; border: 2px solid var(--green); color: var(--green-d); border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
  #scan { position: fixed; inset: 0; background: #111; color: #fff; z-index: 40; display: flex; flex-direction: column; }
  #scan[hidden] { display: none; }
  #scan video { width: 100%; flex: 1; min-height: 0; object-fit: cover; background: #000; }
  #scan .bar { flex: none; padding: 10px 14px 14px; background: #222; }
  #scan .msg { font-size: 14px; }
  #scan .msg.err { color: #ffb4b4; font-weight: bold; }
  #scan .cnt { font-size: 18px; font-weight: bold; margin-top: 4px; }
  #scan .list { max-height: 26vh; overflow-y: auto; margin-top: 6px; font-size: 14px; }
  #scan .list div { padding: 3px 0; border-top: 1px solid #3a3a3a; }
  #scan .list .ng { color: #ffb4b4; }
  #scan .list small { opacity: .7; }
  #scan button { width: 100%; margin-top: 10px; padding: 14px; font-size: 17px; font-weight: bold; border-radius: 12px; border: none; background: var(--orange); color: #fff; cursor: pointer; }
  .bulkbar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 2px solid var(--green); padding: 10px 16px; display: flex; gap: 8px; align-items: center; justify-content: center; z-index: 6; box-shadow: 0 -4px 14px rgba(0,0,0,.08); }
  .bulkbar[hidden] { display: none; }
  .bulkbar .cnt { font-weight: bold; }
  .bulkbar button { padding: 12px 16px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; }
  .bulkbar .go { background: var(--orange); color: #fff; border: none; }
  .bulkbar .clear { background: #fff; border: 1px solid #ccc; color: #444; }

  /* 履歴 */
  .log { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }
  .log .body { flex: 1; min-width: 0; }
  .log .t { font-size: 12px; color: var(--gray); }
  .log.cancel { opacity: .6; }
  .del { flex: none; background: #fff; border: 1px solid var(--red); color: var(--red); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .filter button { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .filter button.on { background: var(--green); border-color: var(--green); color: #fff; }

  /* 一覧（計画担当） */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .btn-link { display: inline-block; background: #fff; border: 1px solid var(--green); color: var(--green); border-radius: 8px; padding: 6px 12px; text-decoration: none; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .plan-head { display: flex; gap: 12px; align-items: flex-start; }
  .qr { flex: none; text-align: center; }
  .qr svg { display: block; width: 96px; height: 96px; }
  .qr .id { font-size: 11px; color: var(--gray); font-family: monospace; }
  .name { font-weight: bold; font-size: 16px; }
  .meta { font-size: 13px; color: #444; }
  .steps { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13px; }
  .steps li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px dashed #e5e5e5; }
  .steps li .what { flex: 1; }
  .steps li .when { color: var(--gray); font-size: 12px; text-align: right; }
  .steps li.ng .what { color: #888; }
  .tag { display: inline-block; flex: none; font-size: 11px; font-weight: bold; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .tag.ok { background: #e1efe4; color: var(--green-d); }
  .tag.now { background: #fbe4d2; color: var(--orange-d); }
  .tag.ng { background: #eee; color: #888; }
  .open { display: block; text-align: center; margin-top: 10px; padding: 8px; border-radius: 8px; background: var(--green-l); text-decoration: none; font-weight: bold; }

  /* 進み具合のステップ表示（大項目ごと） */
  .stepper { display: flex; list-style: none; margin: 14px 0 4px; padding: 0; }
  .stepper li { flex: 1; position: relative; text-align: center; color: #999; font-size: 13px; }
  .stepper li::before { content: ""; position: absolute; z-index: 0; top: 16px; left: -50%; right: 50%; height: 4px; background: #ddd; }
  .stepper li:first-child::before { display: none; }
  .stepper li.done + li::before { background: var(--green); }
  .stepper .dot { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%;
    background: #fff; border: 3px solid #ccc; font-weight: bold; font-size: 15px; color: #999; }
  .stepper .lb { display: block; margin-top: 4px; font-weight: bold; }
  .stepper .ct { display: block; font-size: 11px; }
  .stepper li.done { color: var(--green); }
  .stepper li.done .dot { background: var(--green); border-color: var(--green); color: #fff; }
  .stepper li.part { color: var(--green-d); }
  .stepper li.part .dot { border-color: var(--green); color: var(--green); }
  .stepper li.now { color: var(--orange); }
  .stepper li.now .dot { border-color: var(--orange); color: var(--orange); box-shadow: 0 0 0 4px rgba(212, 131, 74, .15); }
  .stepper li.mine .lb { text-decoration: underline; text-underline-offset: 3px; }
  .stepper.small { margin: 12px 0 2px; }
  .stepper.small li { font-size: 12px; }
  .stepper.small li::before { top: 12px; height: 3px; }
  .stepper.small .dot { width: 28px; height: 28px; font-size: 13px; border-width: 2px; }

  /* 計画画面（QRを読んだとき） */
  .plan-card .badge { display: inline-block; font-family: monospace; font-size: 12px; background: var(--green-l); color: var(--green-d); border-radius: 6px; padding: 1px 8px; }
  .plan-card .name { font-size: 20px; margin: 6px 0 8px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; }
  .kv dt { color: var(--gray); }
  .kv dd { margin: 0; }
  .kv.all { margin-top: 10px; padding-top: 10px; border-top: 1px solid #e3e3e3; gap: 4px 12px; }
  .kv.all dd { overflow-wrap: anywhere; }
  .seeplan { display: block; width: 100%; margin-top: 10px; padding: 10px; background: var(--green-l); color: var(--green-d); border: 0; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .next { margin: 12px 0; padding: 12px 14px; background: var(--orange-l); border: 1px solid #ecc3a3; border-radius: 12px; font-size: 15px; color: var(--orange-d); }
  .next b { font-size: 17px; }
  .next .fdone { color: var(--gray); opacity: .7; }
  .next .flater { color: var(--orange-d); opacity: .75; }
  .next .farrow { margin: 0 6px; color: var(--orange); }
  .next.all { background: var(--green); border-color: var(--green); color: #fff; font-weight: bold; text-align: center; }
  .major { margin-top: 18px; }
  .major h2 { display: flex; justify-content: space-between; align-items: center; font-size: 16px; margin: 0 0 8px; }
  .major h2 .tag { font-size: 12px; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl > li { position: relative; padding: 0 0 10px 40px; }
  .tl > li::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 0; width: 3px; background: #ddd; }
  .tl > li:last-child::before { display: none; }
  .tl > li.done::before { background: var(--green); }
  .tl .mark { position: absolute; left: 0; top: 12px; width: 29px; height: 29px; border-radius: 50%; border: 3px solid #ccc; background: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 15px; box-sizing: border-box; }
  .tl li.done .mark { background: var(--green); border-color: var(--green); }
  .tl li.cur .mark { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(212, 131, 74, .15); }
  .tl .box { border-radius: 12px; padding: 12px 14px; background: #fff; border: 1px solid var(--line); }
  .tl li.done .box { background: var(--green-l); border-color: #cfe3d4; }
  .tl li.cur .box { border: 2px solid #ecc3a3; box-shadow: 0 2px 8px rgba(212, 131, 74, .10); }
  .tl li.todo .box { background: #fafafa; border-style: dashed; }
  .tl .t { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 17px; font-weight: bold; }
  .tl li.done .t { color: var(--green-d); }
  .tl li.todo .t { color: #777; }
  .tl .desc { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .tl .info { font-size: 13px; color: #333; margin-top: 4px; }
  .tl .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .tl .do { flex: 1; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: #fff; color: var(--green); border: 2px solid var(--green); }
  .tl li.cur .do { background: var(--orange); border-color: var(--orange); color: #fff; padding: 14px; font-size: 17px; }
  .tl .qty { width: 80px; padding: 12px 8px; }
  .tl .del { margin-top: 8px; }
  .short { color: #c62828; font-weight: bold; }
  .others { display: block; width: 100%; margin-top: 16px; padding: 10px; background: #fff; border: 1px dashed #bbb; border-radius: 10px; color: var(--gray); cursor: pointer; font-size: 14px; }

  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90%; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }

  /* 真ん中のポップアップ */
  #saving { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 30; }
  #saving[hidden] { display: none; }
  #saving.ok { background: rgba(0,0,0,.15); }
  #saving .box { background: #fff; border-radius: 18px; padding: 22px 28px 20px; min-width: 230px; max-width: 86%; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  #saving .spin { width: 46px; height: 46px; margin: 0 auto 14px; border: 5px solid var(--green-l); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
  #saving .mark { width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; color: #fff; background: var(--green); }
  #saving.err .mark { background: var(--red); }
  #saving .msg { font-size: 18px; font-weight: bold; }
  #saving .sub { font-size: 13px; color: var(--gray); margin-top: 6px; }
  #saving button { margin-top: 14px; font-size: 15px; padding: 8px 22px; border-radius: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  #saving button.undo { border-color: var(--red); color: var(--red); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 農薬散布（spray.js） */
  .sp { margin-bottom: 12px; }
  .sp h3 { margin: 0 0 8px; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--green-l); border: 1px solid #cfe3d4; border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 13px; }
  .chip small { color: var(--gray); }
  .chip button { border: none; background: none; font-size: 16px; color: var(--gray); cursor: pointer; padding: 0 4px; }
  .sub-btn { background: #fff; border: 1px solid var(--green); color: var(--green); border-radius: 8px; padding: 6px 12px; font-size: 14px; cursor: pointer; margin-top: 4px; }
  .picker { margin-top: 8px; border-top: 1px dashed #ddd; padding-top: 8px; max-height: 360px; overflow-y: auto; }
  .picker input[type=search] { width: 100%; font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
  .prow2 { display: flex; gap: 8px; align-items: center; padding: 6px 2px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .prow2 input { width: 22px; height: 22px; flex: none; accent-color: var(--green); }
  .prow { border-top: 1px dashed #e5e5e5; padding: 8px 0; }
  .prow:first-of-type { border-top: none; }

  .pline .muted { flex: none; max-width: 45%; }
  .x { flex: none; border: 1px solid #ccc; background: #fff; border-radius: 8px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; }
  .ck-line { font-size: 13px; padding: 2px 0; }
  .ck-line.ok { color: var(--green-d); }
  .ck-line.bad { color: var(--red); font-weight: bold; }
  .ck-line.warn, b.warn { color: var(--orange-d); }
  .fl { display: block; margin-top: 10px; font-size: 13px; color: var(--gray); }
  .fl input { display: block; width: 100%; font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; margin-top: 4px; font-family: inherit; color: #222; }
  .eq { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .eq button { flex: 1; min-width: 70px; padding: 10px 6px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-size: 15px; cursor: pointer; font-family: inherit; }
  .eq button.on { background: var(--green); border-color: var(--green); color: #fff; font-weight: bold; }
  label.ck { display: block; margin-top: 10px; font-size: 14px; line-height: 1.5; }
  label.ck input { width: 20px; height: 20px; vertical-align: -4px; accent-color: var(--green); }
  .overbox { background: #fbe9e9; border: 1px solid #e3b4b4; color: var(--red); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  table.ut { border-collapse: collapse; width: 100%; font-size: 13px; }

<body>
<div id="app"></div>
<div class="bulkbar" id="bulkbar" hidden>
  <span class="cnt" id="bulk-cnt"></span>
  <button type="button" class="clear" id="bulk-clear">やめる</button>
  <button type="button" class="go" id="bulk-go">まとめて完了にする</button>
</div>
<div id="toast"></div>
<div id="saving" hidden><div class="box" id="saving-box"></div></div>
<div id="ask" hidden><div class="box"><div class="msg" id="ask-msg"></div>
  <button type="button" class="yes" id="ask-yes">はい</button><button type="button" class="no" id="ask-no">やり直す</button></div></div>
<div id="scan" hidden>
  <video id="scan-video" playsinline muted></video>
  <div class="bar">
    <div class="msg" id="scan-msg"></div>
    <div class="cnt" id="scan-cnt"></div>
    <div class="list" id="scan-list"></div>
    <button type="button" id="scan-end">読み終わる</button>
  </div>
</div>

<script>
// QR から開いたときは ?id=QRID が付いている
let ID = new URLSearchParams(location.search).get('id') || '';
// 調べるだけのときは &view=1 が付く（記録のボタンを出さない）
let VIEW = new URLSearchParams(location.search).get('view') === '1';
// 名札の QR から開いたときは ?who=名前 が付いている
const WHO = (new URLSearchParams(location.search).get('who') || '').trim();
const GO = new URLSearchParams(location.search).get('go') || '';
// 今の画面：front（最初の画面）／reg（作業を登録する）／find（作業を調べる）。QR から開いたときは最初の画面を飛ばす
let page = ID ? (VIEW ? 'find' : 'reg') : WHO ? 'reg' : GO === 'find' ? 'find' : GO === 'reg' ? 'reg' : 'front';
const PLANNER = '__all__';         // 計画担当（すべてを見る）
const PART = '__part__';           // パートさん用（共有のスマホ）。名札の QR を読んで、その人として記録する
const PART_IDLE_MIN = 10;          // パートさん用：この分数さわらなければ、名札の読み取りへ戻す
let partAt = 0;                    // パートさん用：最後にさわった時刻
let gateManual = false;            // 名札の読み取りを手で閉じた（カメラを自動で開き直さない）
let asking = null;                 // 「〇〇 さんとして記録します」を出している間の名前
let findText = '';                 // 調べる画面：探す文字
let findShort = false;             // 調べる画面：不足の一覧を出すか
let server = null;                 // 窓口から受け取った最新の状態
let state = null;                  // 画面に出す状態（server に、まだ送り終わっていない記録を重ねたもの）
const queue = [];                  // 送る順番待ち（送信中のものも含む）
let sending = false;
let tab = '';                      // 今のタブ
let showPlan = false;              // 計画画面で、計画の全部の列（Excel から送った中身）を出すか
let showAll = false;               // 計画画面で、自分の担当以外の工程も出すか
let logFilter = '';                // 履歴の絞り込み（大項目）
const picked = new Set();          // 一括登録で選んだ計画（QRID）
const qtyEdit = {};                // 手で直した数量（画面を描き直しても消えないように）
const placeEdit = {};              // 入れた場所と不足（計画|工程 → {house, col, num, short, memo}）。画面を描き直しても消えないように
const fixEdit = {};                // 「不足」タブで書きかけの対処（記録ID → 文）。fixOpen は、対処済みの行を直すために開いているもの
const fixOpen = {};
let inSetup = false;               // 担当・名前を選ぶ画面を出しているか（「担当・名前」を押したときも）
let scan = null;                   // QR をまとめて読んでいる間の状態
const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';   // BarcodeDetector がないブラウザ（iPhone など）で使う

// ---------- 担当と名前（このスマホに覚えさせる） ----------
function load(k) { try { return localStorage.getItem('qrdemo.' + k) || ''; } catch (e) { return ''; } }
function save(k, v) { try { localStorage.setItem('qrdemo.' + k, v); } catch (e) {} }
function getName() { return load('person'); }
function getRole() { return load('role'); }
function isPlanner() { return getRole() === PLANNER; }
function isPart() { return load('mode') === 'part'; }   // このスマホは「パートさん用」か
function majors() {
  const list = [];
  state.steps.forEach(s => { if (list.indexOf(s.major) < 0) list.push(s.major); });
  return list;
}
// 担当の一覧は「工程」シートの大項目から作る（大項目が増えれば担当も増える）
function roles() {
  return [{ key: PLANNER, label: '計画担当', desc: 'すべての計画・工程と、全員の履歴を見る' }]
    .concat(majors().map(m => {
      const names = state.steps.filter(s => s.major === m).map(taskName);
      const label = (names.length === 1 && names[0] === m ? m : names.join('・')) + '担当';
      return { key: m, label: label, desc: 'やること：' + names.join(' → ') };
    }))
    .concat(pestOn() ? [sprayRole()] : []);   // 農薬のシートがあれば「農薬散布担当」も（spray.js）
}
function roleLabel() { if (isPart()) return 'パートさん'; const r = roles().find(x => x.key === getRole()); return r ? r.label : ''; }
function myMajors() { return isPlanner() || isPart() ? majors() : sprayMode() ? [] : [getRole()]; }
// 農薬散布（spray.js）を読めたか。読めなかったとき（置き忘れなど）は農薬の部分だけ出さず、ほかの画面は動かす
function hasSpray() { return typeof window.renderSpray === 'function'; }
function pestOn() { return !!(state && state.pest && hasSpray()); }
function sprayMode() { return hasSpray() && isSpray(); }

// ---------- 共通 ----------
function qrSvg(text) {
  try {
    const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
    return qr.createSvgTag({ cellSize: 3, margin: 2, scalable: true });
  } catch (e) { return '<div class="muted">QRを表示できません</div>'; }
}
function majorSteps(m) { return state.steps.filter(s => s.major === m); }
function isDone(plan, s) { return !!(plan.status[s.key] || {}).done; }
function majorProgress(plan, m) {
  const ss = majorSteps(m);
  return { done: ss.filter(s => isDone(plan, s)).length, total: ss.length };
}
function majorState(plan, m, nx) {
  const pr = majorProgress(plan, m);
  if (pr.done === pr.total) return 'done';
  if (nx && nx.major === m) return 'now';
  return pr.done > 0 ? 'part' : 'todo';
}
function stepperHtml(plan, small) {
  const nx = nextStep(plan), mine = myMajors();
  return `<ol class="stepper${small ? ' small' : ''}">` + majors().map((m, i) => {
    const st = majorState(plan, m, nx), pr = majorProgress(plan, m);
    return `<li class="${st}${!isPlanner() && !isPart() && mine.includes(m) ? ' mine' : ''}"><span class="dot">${st === 'done' ? '✓' : i + 1}</span><span class="lb">${esc(m)}</span>
      <span class="ct">${st === 'done' ? '完了' : pr.done + ' / ' + pr.total}</span></li>`;
  }).join('') + '</ol>';
}
function nextStep(plan) { return state.steps.find(s => !isDone(plan, s)); }
function nextIn(plan, m) { return majorSteps(m).find(s => !isDone(plan, s)); }
function taskName(s) { return s.minor.replace(/\s*完了$/, '') || s.minor; }
function fullTask(s, sep) { const t = taskName(s); return t === s.major ? t : s.major + sep + t; }
function nextFlowHtml(plan, nx) {
  return majorSteps(nx.major).map(s => {
    if (s.key === nx.key) return '<b>' + esc(taskName(s)) + '</b>';
    const done = isDone(plan, s);
    return '<span class="' + (done ? 'fdone' : 'flater') + '">' + (done ? '✓' : '') + esc(taskName(s)) + '</span>';
  }).join('<span class="farrow">→</span>');
}
// 計画の名前：「0311 ﾐﾆﾄﾏﾄ ﾐﾆｷｬﾛﾙ」（播種予定日の月日 ＋ 品目 ＋ 品種）。播種予定日がなければ月日なし。
// 営利の表（品目・品種がない）は「注文NO 穂木×台木」、それもなければ商品名。Code.gs の planName_ と同じ形
function planName(p) {
  const has = c => p.v[c] !== undefined && String(p.v[c]).trim() !== '';
  const m = String((p.w && p.w['播種予定日']) || p.v['播種予定日'] || '').match(/(\d{1,2})\/(\d{1,2})(?!\d)/);
  const md = m ? [m[1].padStart(2, '0') + m[2].padStart(2, '0')] : [];
  const a = ['品目', '品種'].filter(has).map(c => p.v[c]);
  if (a.length) return md.concat(a).join(' ');
  const g = ['穂木', '台木'].filter(has).map(c => p.v[c]).join('×');
  const b = [has('注文NO') ? p.v['注文NO'] : '', g || (has('商品名') ? p.v['商品名'] : '')].filter(x => String(x) !== '');
  if (b.length) return md.concat(b).join(' ');
  return has('品番') ? String(p.v['品番']) : p.id;
}
// 場所の入力欄（「場所の入力」が「あり」の工程だけ）。入れなくても記録できる
function placeHtml(plan, s) {
  if (!s.needPlace) return '';
  const k = esc(plan.id + '|' + s.key), e = placeEdit[plan.id + '|' + s.key] || {};
  const opt = (list, cur) => '<option value="">－</option>' + list.map(x => `<option${String(x) === String(cur || '') ? ' selected' : ''}>${x}</option>`).join('');
  return `<div class="place">ハウス<input type="number" inputmode="numeric" min="1" step="1" data-pk="${k}" data-pl="house" value="${esc(e.house || '')}" aria-label="ハウス番号">
    ベンチ<select data-pk="${k}" data-pl="col" aria-label="ベンチの列">${opt(['A', 'B', 'C'], e.col)}</select><select data-pk="${k}" data-pl="num" aria-label="ベンチの番号">${opt(Array.from({ length: 25 }, (_, i) => i + 1), e.num)}</select></div>`;
}
// 不足の入力欄（「不足の入力」が「あり」の工程だけ）。足りなかった本数と、理由などのメモ。入れなくても記録できる
function shortHtml(plan, s) {
  if (!s.needShort) return '';
  const k = esc(plan.id + '|' + s.key), e = placeEdit[plan.id + '|' + s.key] || {};
  return `<div class="place">不足<input type="number" inputmode="numeric" min="0" step="1" data-pk="${k}" data-pl="short" value="${esc(e.short || '')}" aria-label="不足の本数">本
    <input class="memo" type="text" maxlength="100" data-pk="${k}" data-pl="memo" value="${esc(e.memo || '')}" placeholder="理由など（なくてもよい）" aria-label="不足のメモ"></div>`;
}
// 記録に出す不足：「不足 12本」（赤）。メモと、計画担当が書いた対処も続けて出す
function shortInfo(r, withFix) {
  if (!r || !(Number(r.short) > 0)) return '';
  let h = '<span class="short">不足 ' + esc(r.short) + '本</span>' + (r.memo ? '（' + esc(r.memo) + '）' : '');
  if (withFix) h += r.fix ? '<br><span class="fixed">対処：' + esc(r.fix) + '</span><span class="muted">　' + esc(r.fixBy || '') + ' ' + esc(r.fixAt || '') + '</span>' : '<br><span class="muted">対処はまだ書かれていません</span>';
  return h;
}
function bindPlace() {
  document.querySelectorAll('[data-pk]').forEach(el => el.oninput = el.onchange = () => {
    (placeEdit[el.dataset.pk] = placeEdit[el.dataset.pk] || {})[el.dataset.pl] = el.value;
  });
}
// 記録に出す場所：「ハウス3 ベンチA12」
function placeText(r) {
  return [r && r.house ? 'ハウス' + r.house : '', r && r.bench ? 'ベンチ' + r.bench : ''].filter(String).join(' ');
}
// 担当の大項目で見る計画の列：工程シートの「色を付ける列」＋ 大項目の名前で始まる列。2つ目以降の大項目はポットの大きさ・色も
function majorFields(m) {
  const cols = [];
  majorSteps(m).forEach(s => (s.colorCols || []).forEach(c => { if (!cols.includes(c)) cols.push(c); }));
  const sample = state.plans[0] ? Object.keys(state.plans[0].v) : [];
  // 自動で書く工程の列（小項目の名前・「完了」を取った名前）と「次の作業」の列は、計画の情報ではないので出さない
  const auto = ['次の作業'];
  state.steps.forEach(s => { auto.push(s.minor, taskName(s)); if (s.qtyCol) auto.push(s.qtyCol); });
  sample.forEach(c => { if (c.indexOf(m) === 0 && !cols.includes(c) && !auto.includes(c)) cols.push(c); });
  if (majors().indexOf(m) > 0) ['Pサイズ', 'P色'].forEach(c => { if (sample.includes(c) && !cols.includes(c)) cols.push(c); });
  return cols;
}
// その大項目の予定日の列（「色を付ける列」のうち、名前が「日」で終わる最初の列）
function dateCol(m) {
  return majorFields(m).find(c => /日$/.test(c)) || '';
}
function fieldsHtml(plan, m) {
  return majorFields(m).filter(c => c !== dateCol(m)).map(c => `<b>${esc(c)}</b> ${esc(plan.v[c])}`).join('　');
}
// 「この計画を見る」で出す列：計画の表の全部の列（表の並びのまま）。自動で書く工程の列・QRID・空の列は出さない
function planAllHtml(plan) {
  const auto = ['次の作業', 'QRID'];
  state.steps.forEach(s => { auto.push(s.minor, taskName(s)); if (s.qtyCol) auto.push(s.qtyCol); });
  const rows = Object.keys(plan.v).filter(c => !auto.includes(c) && String(plan.v[c]).trim() !== '')
    .map(c => `<dt>${esc(c)}</dt><dd>${esc(plan.w[c] || plan.v[c])}</dd>`).join('');
  return rows ? `<dl class="kv all">${rows}</dl>` : '<div class="fs muted">計画の列がありません。</div>';
}
function defaultQty(plan, s) {
  if (qtyEdit[plan.id + '|' + s.key] !== undefined) return qtyEdit[plan.id + '|' + s.key];
  return s.compare && plan.v[s.compare] !== undefined ? plan.v[s.compare] : '';
}
function bindQty(list) {
  document.querySelectorAll('[data-qty]').forEach(el => el.oninput = () => {
    const x = list(el.dataset.qty);
    if (x) qtyEdit[x.p.id + '|' + x.s.key] = el.value;
  });
}
// 予定との過不足（HTML）。予定を下回っていたら赤
function diffText(plan, step, qty) {
  if (!step.compare || plan.v[step.compare] === undefined || qty === '' || qty == null) return '';
  const d = Math.round((Number(qty) - Number(plan.v[step.compare])) * 10) / 10;
  const t = '（予定' + plan.v[step.compare] + '、過不足 ' + (d > 0 ? '+' : '') + d + '）';
  return d < 0 ? '<span class="short">' + esc(t) + '</span>' : esc(t);
}
function isShortQty(plan, step, qty) {
  if (!step.compare || qty === '' || qty == null) return false;
  const want = Number(plan.v[step.compare]);
  return !isNaN(want) && want > 0 && Number(qty) < want;
}
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.className = ''; }, 2600);
}
// 真ん中のポップアップ。kind：wait／ok（少しして消える。取り消しボタン付き）／err。引数なしで閉じる
function popup(kind, msg, sub, onUndo) {
  const el = document.getElementById('saving');
  clearTimeout(popup.timer);
  if (!kind) { el.hidden = true; return; }
  el.className = kind;
  document.getElementById('saving-box').innerHTML =
    (kind === 'wait' ? '<div class="spin"></div>' : '<div class="mark">' + (kind === 'ok' ? '✓' : '✕') + '</div>') +
    '<div class="msg">' + esc(msg) + '</div>' + (sub ? '<div class="sub">' + esc(sub).replace(/\n/g, '<br>') + '</div>' : '') +
    (kind === 'err' ? '<button type="button" id="pop-close">閉じる</button>' : '') +
    (kind === 'ok' && onUndo ? '<button type="button" class="undo" id="pop-undo">まちがえた（取り消す）</button>' : '');
  el.hidden = false;
  const c = document.getElementById('pop-close'); if (c) c.onclick = () => popup();
  const u = document.getElementById('pop-undo'); if (u) u.onclick = () => { popup(); onUndo(); };
  if (kind === 'ok') { el.onclick = e => { if (e.target === el) popup(); }; popup.timer = setTimeout(() => popup(), onUndo ? 2600 : 1200); }
}

// ---------- 送信（押したらすぐ画面に反映し、裏で送る） ----------
function rebuild() {
  state = JSON.parse(JSON.stringify(server));
  if (!state.logs) state.logs = [];
  const name = getName();
  queue.forEach(job => {
    if (job.type !== 'record' || job.cancel) return;
    job.items.forEach(it => {
      const plan = state.plans.find(p => p.id === it.id);
      if (plan) plan.status[it.major + '／' + it.minor] = { done: true, time: '送信中…', person: name, qty: it.qty, house: it.house, bench: it.bench, short: Number(it.short) > 0 ? Number(it.short) : 0, memo: it.memo || '', pending: true };
    });
  });
}
function syncBadge() {
  const n = queue.filter(j => j.type === 'record' && !j.cancel).reduce((a, j) => a + j.items.length, 0);
  const b = document.getElementById('sync');
  if (b) { b.hidden = !n; b.textContent = '送信中 ' + n + '件'; }
}
function enqueue(job) {
  queue.push(job);
  rebuild(); render(); syncBadge();
  pump();
  return job;
}
async function pump() {
  if (sending || !queue.length) return;
  sending = true;
  const job = queue[0];
  try {
    if (job.type === 'record' && !job.cancel) {
      const s = await postApi({ action: 'recordMany', items: job.items, person: getName() });
      server = s; job.created = s.created || [];
      if (job.cancel) {  // 送っている間に「取り消す」が押された
        server = await postApi({ action: 'delete', logIds: job.created, person: getName(), planner: isPlanner() });
      }
    } else if (job.type === 'delete') {
      server = await postApi({ action: 'delete', logIds: job.logIds, person: getName(), planner: isPlanner() });
    }
    queue.shift();
    if (job.done) job.done();
  } catch (e) {
    queue.shift();
    popup('err', job.type === 'delete' ? '消せませんでした' : '記録できませんでした', e.message + (job.type === 'record' ? '\nもう一度押してください' : ''));
    try { server = await fetchState(); } catch (e2) {}
  }
  sending = false;
  rebuild(); render(); syncBadge();
  pump();
}
// 記録する（items：[{id, major, minor, qty}]）。押した瞬間に完了の表示にして、取り消しボタン付きの ✓ を出す
function complete(items, label) {
  if (!items.length) return;
  const job = enqueue({ type: 'record', items: items.map(it => Object.assign({ op: '完了' }, it)) });
  popup('ok', label, items.length > 1 ? items.length + '件をまとめて記録しました' : '', () => undo(job));
}
function undo(job) {
  if (queue[0] === job && sending) { job.cancel = true; toast('取り消しています…'); }
  else if (queue.includes(job)) { queue.splice(queue.indexOf(job), 1); toast('取り消しました'); }
  else if (job.created && job.created.length) { enqueue({ type: 'delete', logIds: job.created, done: () => toast('取り消しました') }); }
  rebuild(); render(); syncBadge();
}
function removeLogs(ids, what) {
  if (!confirm(what + '\nこの記録を消しますか？（実績シートからも消えます）')) return;
  popup('wait', '消しています…');
  enqueue({ type: 'delete', logIds: ids, done: () => popup('ok', '消しました') });
}
function refresh() {
  if (queue.length || !document.getElementById('saving').hidden) return;
  if (inSetup || scan || asking) return;       // 担当・名前を選んでいる間、QR を読んでいる間は描き直さない
  if (document.activeElement && /^(INPUT|SELECT)$/.test(document.activeElement.tagName)) return;  // 入力中は描き直さない
  fetchState().then(s => { server = s; rebuild(); render(); }).catch(() => {});
}

// ---------- 画面：はじめに（担当と名前の登録） ----------
// その担当で出す名前の一覧（「担当者」シート）。担当が空の人は、どの担当でも出す
function peopleFor(role) {
  const r = roles().find(x => x.key === role);
  const hit = x => !r || x === r.key || r.label.indexOf(x) >= 0 || (r.key === PLANNER && x.indexOf('計画') === 0);
  return (state.people || []).filter(p => !p.roles || !p.roles.length || p.roles.some(hit));
}
// 名札の QR を読んだとき：その名前に切り替える。「担当者」シートでその人の担当が1つならその担当に。なければ（複数でも）担当を選ぶ画面へ
function applyWho(name) {
  name = String(name || '').trim().slice(0, 40);
  if (!name) return;
  save('person', name);
  const p = (state.people || []).find(x => x.name === name);
  const hit = (r, x) => x === r.key || r.label.indexOf(x) >= 0 || (r.key === PLANNER && x.indexOf('計画') === 0);
  const rs = p ? roles().filter(r => (p.roles || []).some(x => hit(r, x))) : [];
  if (rs.length === 1) { save('role', rs[0].key); inSetup = false; } else inSetup = true;
  tab = ''; picked.clear();
  toast(name + ' さんに切り替えました' + (rs.length === 1 ? '' : '。担当を選んでください'));
}
function renderSetup() {
  inSetup = true;

      <div style="display:flex;gap:6px;flex:none"><button type="button" class="hbtn" id="home">最初へ</button></div></header>
    <main style="max-width:520px">
      <div class="roles">${roles().map(r => `<button type="button" class="role${r.key === role ? ' sel' : ''}" data-role="${esc(r.key)}">${esc(r.label)}<small>${esc(r.desc)}</small></button>`).join('')}
        <button type="button" class="role part" id="partbtn">パートさん用<small>共有のスマホ用。名札の QR を読んで、その人として記録する</small></button></div>
      <button type="button" class="scanbtn" id="badgebtn" style="margin-top:14px">名札の QR を読む</button>

      <div class="names" id="names"></div>

      <button type="button" class="primary" id="go" disabled>はじめる</button>
      ${canBack ? '<button type="button" class="backbtn" id="back">変えずにもどる</button>' : ''}
      <p class="muted">このスマホに覚えます。あとから画面の上の「担当・名前」で変えられます。</p>
    </main>`;
  const go = document.getElementById('go'), nm = document.getElementById('nm');

    document.getElementById('nm-lb').textContent = list.length ? '一覧にない人は、ここに名前を入れる' : '';
    document.querySelectorAll('[data-name]').forEach(b => b.onclick = () => { nm.value = b.dataset.name; drawNames(); check(); });
  };

    drawNames(); check();
  });
  nm.oninput = () => { document.querySelectorAll('[data-name]').forEach(b => b.classList.toggle('sel', b.dataset.name === nm.value.trim())); check(); };
  drawNames(); check();
  go.onclick = () => { save('mode', ''); save('role', role); save('person', nm.value.trim()); inSetup = false; tab = ''; picked.clear(); render(); };
  // パートさん用：このスマホに覚えて、名札の読み取りへ
  document.getElementById('partbtn').onclick = () => { save('mode', 'part'); save('role', PART); save('person', ''); inSetup = false; gateManual = false; tab = ''; picked.clear(); render(); };
  document.getElementById('home').onclick = () => goPage('front');

}
// 上の帯：題名の下に今の担当と名前。右に「最初へ」「一覧へ」と、「担当・名前」（パートさん用のスマホでは「次の人」）
function headerHtml(sub, back) {

      isPart() ? '<button type="button" class="hbtn" id="nextp">次の人</button>' : '<button type="button" class="hbtn" id="chg">担当・名前</button>'}</div></header>`;
}
function bindHeader() {

// ---------- 画面：担当者のホーム（やること・終わった） ----------
// 今日のあなたの割り振り（スケジュールの画面で組んだもの）。なければ何も出さない
function myAssignHtml() {
  const mine = (state.assign || []).filter(a => a.name === getName());
  if (!mine.length) return '';
  const total = Math.round(mine.reduce((n, a) => n + Number(a.hours || 0), 0) * 100) / 100;
  return `<div class="card myassign"><h3>今日のあなたの割り振り<span class="muted">　合わせて ${esc(total)} 時間</span></h3>` + mine.map(a => {
    const p = state.plans.find(x => x.id === a.id), s = state.steps.find(x => x.key === a.key);
    return `<div class="ma"><a href="${esc(planUrl(a.id))}">${esc(p ? planName(p) : a.id)}</a> <span class="muted">${esc(a.id)}</span>
      <span class="what">${esc(s ? fullTask(s, '：') : a.key)}</span><b>${esc(a.hours)} 時間</b></div>`;
  }).join('') + '</div>';
}
function todoList(m) {
  const col = dateCol(m);
  return state.plans.map(p => ({ p, s: nextIn(p, m) })).filter(x => x.s)
    .map(x => Object.assign(x, { key: (x.p.w[col] || x.p.v[col] || '') }))
    .sort((a, b) => a.key < b.key ? -1 : a.key > b.key ? 1 : a.p.id < b.p.id ? -1 : 1);
}
function todayKey() { const d = new Date(); return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0'); }
function renderWorker() {
  const m = getRole();
  const list = todoList(m);
  const mineLogs = state.logs.filter(l => l.major === m && l.person === getName() && l.canDelete);
  if (!tab) tab = 'todo';
  let body = '';
  if (tab === 'todo') {
    const groups = [];
    list.forEach(x => { const g = groups[groups.length - 1]; if (g && g.key === x.key) g.items.push(x); else groups.push({ key: x.key, items: [x] }); });
    const today = todayKey();
    body = (list.length ? '<button type="button" class="scanbtn" id="scanbtn">QR をまとめて読む</button><p class="muted" style="margin:0 0 6px">読んだ計画が選ばれます。そのあと下の「まとめて完了にする」で一度に記録できます。</p>' : '') + groups.map(g => {
      const k = g.key.slice(0, 5);
      const when = !k ? '' : k < today ? '<span class="when late">予定日を過ぎています</span>' : k === today ? '<span class="when today">今日</span>' : '';
      return `<div class="day"><h3>${esc(g.key || '予定日なし')}${when}<span class="muted">　${g.items.length}件</span></h3>
        <button type="button" class="selall" data-day="${esc(g.key)}">全部選ぶ</button></div>` +
        g.items.map(({ p, s }) => {
          const prev = majors().slice(0, majors().indexOf(m)).find(mm => majorProgress(p, mm).done < majorProgress(p, mm).total);
          return `<div class="task${picked.has(p.id) ? ' picked' : ''}" data-row="${esc(p.id)}">
            <input type="checkbox" data-pick="${esc(p.id)}"${picked.has(p.id) ? ' checked' : ''} aria-label="選ぶ">
            <div class="body"><div class="nm"><a href="${esc(planUrl(p.id))}">${esc(planName(p))}</a> <span class="muted">${esc(p.id)}</span></div>
              <div class="fs">${fieldsHtml(p, m)}</div>
              ${placeHtml(p, s)}${shortHtml(p, s)}
              ${prev ? `<div class="warn">※ 前の工程（${esc(prev)}）が未記録</div>` : ''}</div>
            <div class="act">${s.needQty ? `<input class="qty" type="number" inputmode="decimal" step="any" data-qty="${esc(p.id)}" value="${esc(defaultQty(p, s))}" aria-label="数量">` : ''}
              <button type="button" class="done-btn" data-do="${esc(p.id)}">${majorSteps(m).length > 1 ? esc(taskName(s)) + '<br>' : ''}完了</button></div>
          </div>`;
        }).join('');
    }).join('') || '<div class="empty">✓ やることはありません</div>';
  } else {
    body = (mineLogs.length ? mineLogs.map(logHtml).join('') : '<div class="empty">24時間以内のあなたの記録はありません</div>') +
      '<p class="muted">押しまちがえた記録は、24時間以内なら「消す」で消せます。それより前の記録は計画担当に連絡してください。</p>';
  }
  document.getElementById('app').innerHTML = headerHtml('', false) + `
    <main style="max-width:720px">
      ${tab === 'todo' ? myAssignHtml() : ''}
      <div class="tabs"><button type="button" data-tab="todo" class="${tab === 'todo' ? 'on' : ''}">やること<span class="n">${list.length}</span></button>
        <button type="button" data-tab="mine" class="${tab === 'mine' ? 'on' : ''}">自分の記録（24時間）</button></div>
      ${body}
      <p class="muted">最終更新 ${esc(state.updated)}。QRを読むと、その計画の画面が開きます。</p>
    </main>`;
  bindHeader();
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.querySelectorAll('[data-pick]').forEach(c => c.onchange = () => { c.checked ? picked.add(c.dataset.pick) : picked.delete(c.dataset.pick); render(); });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    const ids = list.filter(x => x.key === b.dataset.day).map(x => x.p.id);
    const all = ids.every(id => picked.has(id));
    ids.forEach(id => all ? picked.delete(id) : picked.add(id));
    render();
  });
  document.querySelectorAll('[data-do]').forEach(b => b.onclick = () => {
    const x = list.find(y => y.p.id === b.dataset.do);
    const item = itemFor(x.p, x.s);
    if (item) { picked.delete(x.p.id); complete([item], '「' + taskName(x.s) + '」完了'); }
  });
  bindDelete();
  bindQty(id => list.find(y => y.p.id === id));
  bindPlace();
  const sb = document.getElementById('scanbtn'); if (sb) sb.onclick = startScan;
  // 一括登録のバー
  const ids = [...picked].filter(id => list.some(x => x.p.id === id));
  picked.forEach(id => { if (!ids.includes(id)) picked.delete(id); });
  const bar = document.getElementById('bulkbar');
  bar.hidden = !(tab === 'todo' && ids.length);
  document.getElementById('bulk-cnt').textContent = ids.length + '件を選択中';
  document.getElementById('bulk-clear').onclick = () => { picked.clear(); render(); };
  document.getElementById('bulk-go').onclick = () => {
    const items = [];
    for (const id of ids) { const x = list.find(y => y.p.id === id); const it = itemFor(x.p, x.s); if (!it) return; items.push(it); }
    picked.clear();
    complete(items, items.length + '件を完了にしました');
  };
}
// 1件分の記録。数量が要る工程は、行の入力欄の数（最初は予定の数）を使う。場所が要る工程は、入れてあればハウス・ベンチも付ける
function itemFor(p, s) {
  let qty = '';
  if (s.needQty) {
    const el = document.querySelector('[data-qty="' + CSS.escape(p.id + '|' + s.key) + '"]') || document.querySelector('[data-qty="' + CSS.escape(p.id) + '"]');
    qty = el ? el.value : defaultQty(p, s);
    if (qty === '' || isNaN(Number(qty))) { toast(planName(p) + '：数量を入れてください', true); return null; }
  }
  const e = s.needPlace ? (placeEdit[p.id + '|' + s.key] || {}) : {};
  if (!e.col !== !e.num) { toast(planName(p) + '：ベンチは列（A・B・C）と番号の両方を選んでください', true); return null; }
  // 不足が要る工程は、入れてあれば不足の本数とメモも付ける（空 ＝ 不足なし）
  const x = s.needShort ? (placeEdit[p.id + '|' + s.key] || {}) : {};
  const short = String(x.short === undefined ? '' : x.short).trim();
  if (short !== '' && (isNaN(Number(short)) || Number(short) < 0)) { toast(planName(p) + '：不足は 0 以上の数字で入れてください', true); return null; }
  return { id: p.id, major: s.major, minor: s.minor, qty: qty, house: String(e.house || '').trim(), bench: e.col ? e.col + e.num : '',
    short: short === '' ? '' : Number(short), memo: String(x.memo || '').trim() };
}
function logHtml(l) {
  const s = state.steps.find(x => x.major === l.major && x.minor === l.minor);
  const task = s ? fullTask(s, '：') : l.major + '：' + l.minor;
  const unit = s ? s.unit : '';
  return `<div class="log${l.op === '取消' ? ' cancel' : ''}"><div class="body">
    <div>${esc(l.name)} <span class="muted">${esc(l.id)}</span></div>
    <div class="t">${esc(l.time)}　${esc(task)}${l.op === '取消' ? '（取り消し）' : ''}${l.qty !== '' && l.qty != null ? '　' + esc(l.qty) + esc(unit) : ''}${placeText(l) ? '　' + esc(placeText(l)) : ''}${shortInfo(l) ? '　' + shortInfo(l) : ''}　${esc(l.person)}</div></div>
    ${l.canDelete && (isPlanner() || l.person === getName()) ? `<button type="button" class="del" data-del="${esc(l.logId)}">消す</button>` : ''}</div>`;
}
function bindDelete() {
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const l = state.logs.find(x => x.logId === b.dataset.del);
    removeLogs([l.logId], l.time + '　' + l.name + '　' + l.major + '：' + l.minor);
  });
}

// ---------- 画面：計画担当のホーム（一覧・履歴） ----------

            <div class="meta">播種 ${esc(p.v['播種予定日'])} → ポット ${esc(p.v['ポット使用日'])} → 鉢上げ ${esc(p.v['鉢上予定日'])}</div></div></div>

      `<p class="muted">新しい順に最大${state.logs.length >= 500 ? '500' : state.logs.length}件。24時間以内の記録は「消す」で消せます（実績シートからも消えます）。</p>`;

    <main>

// ---------- 計画担当の「不足」タブ：不足のある記録の一覧と、その対処（マイナス報告用紙の代わり） ----------

// ---------- QR をまとめて読む（やること画面）：読んだ計画を「選んだ」状態にする ----------
function scanDraw(msg, isErr) {
  const m = document.getElementById('scan-msg');
  if (msg !== undefined) { m.textContent = msg; m.className = 'msg' + (isErr ? ' err' : ''); }
  const n = scan ? scan.items.filter(x => x.ok).length : 0;
  const multi = !scan || !scan.mode;   // 計画の QR をまとめて読んでいる
  document.getElementById('scan-cnt').textContent = multi && n ? n + '件を選びました' : '';
  document.getElementById('scan-list').innerHTML = (scan ? scan.items : []).map(x =>
    `<div class="${x.ok ? '' : 'ng'}">${x.ok ? '✓ ' : '✕ '}${esc(x.text)} <small>${esc(x.id)}</small></div>`).join('');
  document.getElementById('scan-end').textContent = scan && scan.mode === 'gate' ? '名前の一覧から選ぶ'
    : !multi ? 'やめる' : n ? '読み終わる（' + n + '件を選んだ）' : '読み終わる';
}
// QR の中身（画面のURL?id=QRID）から QRID を取り出す。QRID だけの QR も読める
function qrId(text) {
  text = String(text || '').trim();
  try { const id = new URL(text).searchParams.get('id'); if (id) return id.trim(); } catch (e) {}
  return /^[A-Za-z0-9][A-Za-z0-9_-]{2,39}$/.test(text) ? text : '';
}
function onScan(text) {
  if (!scan) return;
  if (scan.mode === 'badge') {        // 名札を読む：1枚読んだら、その人に切り替えて終わる
    let who = '';
    try { who = (new URL(String(text).trim()).searchParams.get('who') || '').trim(); } catch (e) {}
    if (who) { stopScan(true); applyWho(who); render(); return; }
    if (!scan.seen['?' + text]) { scan.seen['?' + text] = true; scan.items.unshift({ ok: false, id: String(text).slice(0, 30), text: '名札の QR ではありません' }); scanDraw(); }
    return;
  }
  if (scan.mode === 'gate') {         // パートさん用：名札を読んだら「〇〇 さんとして記録します」と確かめる
    if (scan.hold) return;
    let who = '';
    try { who = (new URL(String(text).trim()).searchParams.get('who') || '').trim(); } catch (e) {}
    if (who) return askWho(who);
    if (!scan.seen['?' + text]) { scan.seen['?' + text] = true; scan.items.unshift({ ok: false, id: String(text).slice(0, 30), text: '名札の QR ではありません' }); scanDraw(); }
    return;
  }
  if (scan.mode === 'one' || scan.mode === 'find') {   // 1つ読んだら、その計画の画面を開く（find は見るだけ）
    const id1 = qrId(text), k1 = id1 || '?' + text;
    if (id1 && state.plans.some(p => p.id === id1)) { const v = scan.mode === 'find'; stopScan(true); openPlan(id1, v); return; }
    if (!scan.seen[k1]) { scan.seen[k1] = true; scan.items.unshift({ ok: false, id: id1 || String(text).slice(0, 30), text: id1 ? 'この QR の計画が見つかりません' : '計画の QR ではありません' }); scanDraw(); }
    return;
  }
  const id = qrId(text), key = id || '?' + text;
  if (scan.seen[key]) return;          // 同じ QR は1回だけ
  scan.seen[key] = true;
  const x = id && myTodo().find(y => y.p.id === id);
  if (x) {
    picked.add(id);
    scan.items.unshift({ ok: true, id: id, text: planName(x.p) + '（' + taskName(x.s) + '）' });
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
  } else {
    const p = id && state.plans.find(q => q.id === id);
    scan.items.unshift({ ok: false, id: id || String(text).slice(0, 30),
      text: !id ? '計画の QR ではありません' : p ? planName(p) + '：あなたのやることにありません（飛ばしました）' : 'この QR の計画が見つかりません（飛ばしました）' });
  }
  scanDraw();
}
function loadScript(src) {
  return new Promise((ok, ng) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => ng(new Error('読み込めません'));
    document.head.appendChild(s);
  });
}
// mode：'badge' ＝ 名札を読む（担当・名前の画面から）、'gate' ＝ 名札を読んで確かめる（パートさん用）、
//       'one' ＝ 計画の QR を1つ読んで開く、'find' ＝ 1つ読んで調べる。それ以外は計画の QR をまとめて読む
async function startScan(mode) {
  if (scan) return;
  const el = document.getElementById('scan'), video = document.getElementById('scan-video');
  const me = scan = { seen: {}, items: [], stream: null, timer: 0, busy: false, mode: ['badge', 'gate', 'one', 'find'].indexOf(mode) >= 0 ? mode : '', hold: false };
  el.hidden = false;
  document.getElementById('scan-end').onclick = stopScan;
  scanDraw('カメラを開いています…');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return scanDraw('このブラウザではカメラを使えません。https で始まるURLを、Safari か Chrome で開いてください。', true);
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  } catch (e) {
    if (scan !== me) return;
    return scanDraw(e.name === 'NotAllowedError' || e.name === 'SecurityError' ? 'カメラが許可されていません。ブラウザの設定でこのページのカメラを許可してから、もう一度、読み取りのボタンを押してください。'
      : e.name === 'NotFoundError' || e.name === 'OverconstrainedError' ? 'カメラが見つかりません。'
      : e.name === 'NotReadableError' ? 'カメラをほかのアプリが使っています。そのアプリを閉じてから、もう一度押してください。'
      : 'カメラを開けませんでした（' + e.name + '）。', true);
  }
  if (scan !== me) { stream.getTracks().forEach(tr => tr.stop()); return; }   // 開いている間に「読み終わる」が押された
  me.stream = stream;
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  // 読み取り：BarcodeDetector があればそれ、なければ jsQR
  let detector = null;
  try {
    if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] });
  } catch (e) {}
  if (!detector && typeof window.jsQR !== 'function') {
    try { await loadScript(JSQR_URL); } catch (e) {
      if (scan === me) scanDraw('QR を読む部品を読み込めませんでした。電波の状態を確認して、読み終わってからもう一度押してください。', true);
      return;
    }
  }
  if (scan !== me) return;
  scanDraw(me.mode === 'badge' || me.mode === 'gate' ? '自分の名札の QR にカメラを向けてください。' : me.mode ? '計画の QR にカメラを向けてください。' : 'QR にカメラを向けてください。続けて何枚でも読めます。');
  const canvas = document.createElement('canvas');
  me.timer = setInterval(async () => {
    if (scan !== me || me.busy || video.readyState < 2 || !video.videoWidth) return;
    me.busy = true;
    try {
      let texts = [];
      if (detector) {
        texts = (await detector.detect(video)).map(c => c.rawValue);
      } else {
        const k = Math.min(1, 800 / Math.max(video.videoWidth, video.videoHeight));
        const w = canvas.width = Math.round(video.videoWidth * k), h = canvas.height = Math.round(video.videoHeight * k);
        const g = canvas.getContext('2d', { willReadFrequently: true });
        g.drawImage(video, 0, 0, w, h);
        const c = window.jsQR(g.getImageData(0, 0, w, h).data, w, h);
        if (c && c.data) texts = [c.data];
      }
      texts.forEach(onScan);
    } catch (e) {}
    me.busy = false;
  }, 250);
}
function stopScan(keep) {
  const me = scan;
  scan = null;
  if (me) {
    clearInterval(me.timer);
    if (me.stream) me.stream.getTracks().forEach(tr => tr.stop());
  }
  const video = document.getElementById('scan-video');
  try { video.pause(); video.srcObject = null; } catch (e) {}
  document.getElementById('scan').hidden = true;
  if (!asking) document.getElementById('ask').hidden = true;
  if (keep === true || (me && me.mode === 'badge')) return;   // 名札を読んでいたときは、担当・名前の画面のまま
  if (me && me.mode === 'gate') gateManual = true;            // パートさん用：カメラを閉じた。名前の一覧から選べる
  if (me && me.mode) { if (state) render(); return; }
  if (state) { tab = 'todo'; render(); }
}

function knownPerson(name) { const l = state.people || []; return !l.length || l.some(p => p.name === name); }
// 名札を読んだ・名前を選んだ：「〇〇 さんとして記録します」「はい」「やり直す」
function askWho(name) {
  name = String(name || '').trim().slice(0, 40);
  if (!name) return;
  if (!knownPerson(name)) {
    const msg = '「' + name + '」さんは、人の一覧にありません。名札を確かめて、もう一度読んでください。';
    asking = null;
    if (scan) {
      if (!scan.seen['x' + name]) { scan.seen['x' + name] = true; setTimeout(() => { if (scan) delete scan.seen['x' + name]; }, 4000); scanDraw(msg, true); }
    } else { toast(msg, true); if (state) render(); }

  if (scan) scan.hold = true;
  asking = name;
  const el = document.getElementById('ask');
  document.getElementById('ask-msg').textContent = name + ' さんとして記録します';
  el.hidden = false;
  document.getElementById('ask-yes').onclick = () => {

}
// 次の人に替わる：名札の読み取りへ戻る

// 一定の時間さわらなければ、名札の読み取りへ戻す（前の人のまま記録しないように）

  if (!isPart() || !getName() || queue.length || scan || asking || !partExpired()) return;

}
['pointerdown', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, () => { if (isPart() && getName() && Date.now() - partAt > 5000) touchPart(); }, true));

      </div>
      <details class="card" style="margin-top:12px"${gateManual ? ' open' : ''}><summary>カメラが使えないとき：名前の一覧から選ぶ</summary>
        <div class="names" style="margin-top:10px">${names.map(p => `<button type="button" class="nmbtn" data-gname="${esc(p.name)}">${esc(p.name)}</button>`).join('')}</div>
        ${names.length ? '' : `<label class="field">名前を入れる<input id="g-name" type="text" placeholder="例：いいだ"></label>
          <button type="button" class="sub-btn" id="g-ok" style="margin-top:8px">この名前で記録する</button>`}
      </details>
      <button type="button" class="others" id="g-staff">社員の画面にする（担当を選び直す）</button>
    </main>`;
  document.getElementById('bulkbar').hidden = true;
  document.getElementById('home').onclick = () => goPage('front');
  document.getElementById('g-scan').onclick = () => { gateManual = false; startScan('gate'); };
  document.querySelectorAll('[data-gname]').forEach(b => b.onclick = () => askWho(b.dataset.gname));
  const ok = document.getElementById('g-ok'); if (ok) ok.onclick = () => askWho(document.getElementById('g-name').value);
  document.getElementById('g-staff').onclick = () => { save('mode', ''); save('role', ''); save('person', ''); renderSetup(); };
  if (!gateManual && !scan && !asking) startScan('gate');
}
// パートさんが、その計画で完了にできる工程：今日の自分の割り振りにある工程。なければ、その計画の次の作業
function partAllowed(p) {
  const mine = (state.assign || []).filter(a => a.name === getName() && a.id === p.id)
    .map(a => state.steps.find(s => s.key === a.key)).filter(s => s && !isDone(p, s));
  if (mine.length) return mine.map(s => s.key);
  const nx = nextStep(p);
  return nx ? [nx.key] : [];
}
function partList() {
  return state.plans.map(p => ({ p, s: state.steps.find(s => s.key === partAllowed(p)[0]), key: '' })).filter(x => x.s);
}
// まとめ読みで選べる計画：社員は担当のやること、パートさんは終わっていない計画（割り振りの工程か、次の作業）
function myTodo() { return isPart() ? partList() : todoList(getRole()); }
// パートさんの登録の画面：今日の割り振り、QR を読む、読んだ計画の一覧
function renderPart() {
  const all = partList();
  const mineIds = (state.assign || []).filter(a => a.name === getName()).map(a => a.id);
  const list = all.filter(x => picked.has(x.p.id) || mineIds.includes(x.p.id));
  const mineLogs = state.logs.filter(l => l.person === getName() && l.canDelete);
  const rows = list.map(({ p, s }) => `<div class="task${picked.has(p.id) ? ' picked' : ''}" data-row="${esc(p.id)}">
      <input type="checkbox" data-pick="${esc(p.id)}"${picked.has(p.id) ? ' checked' : ''} aria-label="選ぶ">
      <div class="body"><div class="nm"><a href="#" data-open="${esc(p.id)}">${esc(planName(p))}</a> <span class="muted">${esc(p.id)}</span></div>
        <div class="fs"><b>${esc(fullTask(s, '：'))}</b>　${fieldsHtml(p, s.major)}</div>
        ${placeHtml(p, s)}${shortHtml(p, s)}</div>
      <div class="act">${s.needQty ? `<input class="qty" type="number" inputmode="decimal" step="any" data-qty="${esc(p.id)}" value="${esc(defaultQty(p, s))}" aria-label="数量">` : ''}
        <button type="button" class="done-btn" data-do="${esc(p.id)}">${esc(taskName(s))}<br>完了</button></div>
    </div>`).join('');
  document.getElementById('app').innerHTML = headerHtml('', false) + `
    <main style="max-width:720px">
      <div class="card whobar"><span><b>${esc(getName())}</b> さんとして記録します</span><button type="button" id="w-next">次の人に替わる</button></div>
      ${myAssignHtml()}
      <button type="button" class="scanbtn" id="onebtn">作業の QR を読む</button>
      <button type="button" class="scanbtn" id="scanbtn" style="margin-top:8px">QR をまとめて読む</button>
      <p class="muted" style="margin:6px 0 0">「作業の QR を読む」は、読んだ計画の画面が開きます。「まとめて読む」は、読んだ計画が下に並び、一度に完了にできます。</p>
      ${list.length ? '<div class="day"><h3>今日の割り振りと、読んだ計画</h3></div>' + rows : ''}
      ${mineLogs.length ? '<div class="day"><h3>自分の記録（24時間）</h3></div>' + mineLogs.map(logHtml).join('') + '<p class="muted">押しまちがえた記録は、24時間以内なら「消す」で消せます。</p>' : ''}
      <p class="muted">最終更新 ${esc(state.updated)}。記録が終わったら「次の人に替わる」を押してください（${PART_IDLE_MIN}分さわらないと、自動で名札の読み取りへ戻ります）。</p>
    </main>`;
  bindHeader();
  document.getElementById('w-next').onclick = nextPerson;
  document.getElementById('onebtn').onclick = () => startScan('one');
  document.getElementById('scanbtn').onclick = () => startScan();
  document.querySelectorAll('[data-open]').forEach(a => a.onclick = ev => { ev.preventDefault(); openPlan(a.dataset.open, false); });
  document.querySelectorAll('.myassign a').forEach(a => a.onclick = ev => { const id = new URL(a.href).searchParams.get('id'); if (id) { ev.preventDefault(); openPlan(id, false); } });
  document.querySelectorAll('[data-pick]').forEach(c => c.onchange = () => { c.checked ? picked.add(c.dataset.pick) : picked.delete(c.dataset.pick); render(); });
  document.querySelectorAll('[data-do]').forEach(b => b.onclick = () => {
    const x = list.find(y => y.p.id === b.dataset.do);
    const item = itemFor(x.p, x.s);
    if (item) { picked.delete(x.p.id); complete([item], '「' + taskName(x.s) + '」完了'); }
  });
  bindDelete();
  bindQty(id => list.find(y => y.p.id === id));
  bindPlace();
  // 一括登録のバー
  const ids = [...picked].filter(id => list.some(x => x.p.id === id));
  picked.forEach(id => { if (!ids.includes(id)) picked.delete(id); });
  document.getElementById('bulkbar').hidden = !ids.length;
  document.getElementById('bulk-cnt').textContent = ids.length + '件を選択中';
  document.getElementById('bulk-clear').onclick = () => { picked.clear(); render(); };
  document.getElementById('bulk-go').onclick = () => {
    const items = [];
    for (const id of ids) { const x = list.find(y => y.p.id === id); const it = itemFor(x.p, x.s); if (!it) return; items.push(it); }
    picked.clear();
    complete(items, items.length + '件を完了にしました');
  };
}

// ---------- 作業を調べる（見るだけ。担当や名前を決めていなくても見られる） ----------
const nk = s => String(s == null ? '' : s).normalize('NFKC').toLowerCase().replace(/\s+/g, '');
function findList() {
  const q = nk(findText);
  return state.plans.filter(p => !q || nk([planName(p), p.id, p.v['注文NO'], p.v['品番'], p.v['商品名'], p.v['出荷先']].join(' ')).includes(q));
}
function findRowsHtml() {
  const list = findList(), max = 60;
  return (list.slice(0, max).map(p => {
    const nx = nextStep(p);
    const prog = majors().map(m => { const pr = majorProgress(p, m); return `<span class="${pr.done === pr.total ? 'ok' : ''}">${esc(m)} ${pr.done === pr.total ? '✓' : pr.done + '/' + pr.total}</span>`; }).join('');
    return `<button type="button" class="task findrow" data-open="${esc(p.id)}"><div class="body">
      <div class="nm">${esc(planName(p))} <span class="muted">${esc(p.id)}</span></div>
      <div class="fs">${prog}${nx ? '次の作業：' + esc(fullTask(nx, '：')) : '<span class="ok">すべて完了</span>'}</div></div></button>`;
  }).join('') || '<div class="empty">当てはまる計画がありません</div>') +
    (list.length > max ? `<p class="muted">${list.length}件のうち、はじめの${max}件を出しています。文字を足してしぼってください。</p>` : '');
}
function shortListHtml() {
  const list = state.shorts || [];
  if (!list.length) return '<div class="empty">不足の記録はありません</div>';
  return list.map(x => {
    const s = state.steps.find(y => y.major === x.major && y.minor === x.minor);
    return `<div class="sh${x.fix ? ' ok' : ''}">
      <div class="top"><b class="short">不足 ${esc(x.short)}本</b><a href="#" data-open="${esc(x.id)}">${esc(x.name)}</a><span class="muted">${esc(x.id)}</span>
        <span class="tag ${x.fix ? 'ok' : 'now'}">${x.fix ? '対処済み' : '対処まだ'}</span></div>
      <div class="t">${esc(x.time)}　${esc(s ? fullTask(s, '：') : x.major + '：' + x.minor)}${placeText(x) ? '　' + esc(placeText(x)) : ''}　${esc(x.person)}${x.memo ? '　メモ：' + esc(x.memo) : ''}</div>
      ${x.fix ? `<div style="margin-top:6px"><span class="fixed">対処：${esc(x.fix)}</span><span class="muted">　${esc(x.fixBy)} ${esc(x.fixAt)}</span></div>` : ''}</div>`;
  }).join('');
}
function bindOpen() {
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = ev => { ev.preventDefault(); openPlan(b.dataset.open, true); });
}
function renderFind() {
  const nShort = (state.shorts || []).filter(x => !x.fix).length;
  document.getElementById('app').innerHTML = `
    <header><div><h1>作業を調べる</h1><div class="sub">計画の中身と進み具合を見る（ここからは記録しません）</div></div>
      <div style="display:flex;gap:6px;flex:none"><button type="button" class="hbtn" id="home">最初へ</button></div></header>
    <main style="max-width:720px">
      <button type="button" class="scanbtn" id="findscan">QR を読む</button>
      <label class="field" style="margin-top:10px">名前・QRID・注文NO で探す<input id="findq" type="search" value="${esc(findText)}" placeholder="例：ミニトマト、26-00012"></label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin:12px 0">
        <a class="btn-link" href="schedule.html">スケジュール</a>
        <button type="button" class="btn-link" id="findshort">${findShort ? '不足の一覧を閉じる' : '不足の一覧'}${nShort ? '（対処まだ ' + nShort + '件）' : ''}</button></div>
      ${findShort ? shortListHtml() : ''}
      <div class="day"><h3>計画の一覧<span class="muted" id="findcnt">　${findList().length}件</span></h3></div>
      <div id="findlist">${findRowsHtml()}</div>
      <p class="muted">最終更新 ${esc(state.updated)}（自動で更新）。</p>
    </main>`;
  document.getElementById('bulkbar').hidden = true;
  document.getElementById('home').onclick = () => goPage('front');
  document.getElementById('findscan').onclick = () => startScan('find');
  document.getElementById('findshort').onclick = () => { findShort = !findShort; render(); };
  // 探す文字を打っている間は、一覧の所だけ描き直す（入力欄を作り直さない）
  document.getElementById('findq').oninput = e => {
    findText = e.target.value;
    document.getElementById('findlist').innerHTML = findRowsHtml();
    document.getElementById('findcnt').textContent = '　' + findList().length + '件';
    bindOpen();
  };
  bindOpen();
}
// 調べる：計画の中身と進み具合（記録のボタンは出さない）
function renderPlanView(plan) {
  const nx = nextStep(plan);
  const sections = majors().map(m => {
    const st = majorState(plan, m, nx), pr = majorProgress(plan, m);
    const head = st === 'done' ? '<span class="tag ok">完了</span>' : st === 'now' ? '<span class="tag now">作業中</span>' : '<span class="tag ng">' + pr.done + ' / ' + pr.total + '</span>';
    const items = majorSteps(m).map(s => {
      const r = plan.status[s.key] || {};
      if (r.done) {
        let info = esc(r.time) + (r.person ? '　' + esc(r.person) : '');
        if (r.qty !== '' && r.qty != null) info += '　' + esc(r.qty) + esc(s.unit) + diffText(plan, s, r.qty);
        if (placeText(r)) info += '　' + esc(placeText(r));
        if (shortInfo(r)) info += '<br>' + shortInfo(r, true);
        return `<li class="done"><span class="mark">✓</span><div class="box"><div class="t">${esc(taskName(s))}<span class="tag ok">完了</span></div><div class="info">${info}</div></div></li>`;
      }
      const isCur = nx && nx.key === s.key;
      return `<li class="${isCur ? 'cur' : 'todo'}"><span class="mark"></span><div class="box">
        <div class="t">${esc(taskName(s))}${isCur ? '<span class="tag now">次の作業</span>' : '<span class="tag ng">未完了</span>'}</div><div class="desc">${esc(s.note)}</div></div></li>`;
    }).join('');
    return `<section class="major"><h2>${esc(m)}${head}</h2>
      <div class="fs muted" style="margin:-4px 0 8px">${fieldsHtml(plan, m)}${dateCol(m) ? '　<b>予定日</b> ' + esc(plan.w[dateCol(m)] || plan.v[dateCol(m)]) : ''}</div>
      <ol class="tl">${items}</ol></section>`;
  }).join('');
  document.getElementById('app').innerHTML = `
    <header><div style="min-width:0"><h1>作業を調べる</h1><div class="sub">見るだけの画面です</div></div>
      <div style="display:flex;gap:6px;flex:none"><button type="button" class="hbtn" id="home">最初へ</button><button type="button" class="hbtn" id="tofind">一覧へ</button></div></header>
    <main style="max-width:560px">
      <div class="card plan-card">
        <span class="badge">${esc(plan.id)}</span>
        <div class="name">${esc(planName(plan))}</div>
        <button type="button" class="seeplan" id="seeplan" aria-expanded="${showPlan}">${showPlan ? '計画を閉じる' : 'この計画を見る'}</button>
        ${showPlan ? planAllHtml(plan) : ''}
      </div>
      ${stepperHtml(plan, false)}
      <div class="next ${nx ? '' : 'all'}">${nx ? '次の作業：' + nextFlowHtml(plan, nx) : '✓ すべての工程が完了しました'}</div>
      ${sections}
      <button type="button" class="primary" id="v-reg">この作業を登録する</button>
      <button type="button" class="backbtn" id="v-back">ほかの計画を調べる</button>
    </main>`;
  document.getElementById('bulkbar').hidden = true;
  document.getElementById('home').onclick = () => goPage('front');
  document.getElementById('tofind').onclick = () => goPage('find');
  document.getElementById('v-back').onclick = () => goPage('find');
  document.getElementById('v-reg').onclick = () => openPlan(plan.id, false);
  document.getElementById('seeplan').onclick = () => { showPlan = !showPlan; render(); };
}

// ---------- 画面の切り替え ----------
function planMissing() {
  document.getElementById('app').innerHTML = headerHtml('', true) + `<main><div class="card">この QR（${esc(ID)}）の計画が見つかりません。</div></main>`;
  document.getElementById('bulkbar').hidden = true;
  bindHeader();
}
function render() {
  if (!state) return;
  if (page === 'front' && !inSetup) return renderFront();
  if (page === 'find') {
    const p = ID && state.plans.find(x => x.id === ID);
    return p ? renderPlanView(p) : renderFind();
  }
  // ここから「作業を登録する」
  if (isPart() && !inSetup) {   // パートさん用のスマホ：だれかが決まっていなければ、先に名札を読む
    if (!getName()) return renderGate();
    if (ID) { const plan = state.plans.find(p => p.id === ID); return plan ? renderPlan(plan) : planMissing(); }
    return renderPart();
  }
  if (inSetup || !getName() || !roles().some(r => r.key === getRole())) return renderSetup();
  inSetup = false;
  if (ID) {
    const plan = state.plans.find(p => p.id === ID);
    return plan ? renderPlan(plan) : planMissing();
  }
  isPlanner() ? renderPlanner() : sprayMode() ? renderSpray() : renderWorker();
}
function showMessage(msg) {
  document.getElementById('app').innerHTML = `<header><h1>QR一元管理</h1></header><main><div class="card">${esc(msg)}</div></main>`;
}
showMessage('読み込んでいます…');
fetchState()
  .then(s => {
    server = s; if (!server.logs) server.logs = []; rebuild();
    partAt = Number(load('partAt')) || 0;
    if (isPart() && getName() && partExpired()) save('person', '');   // 前の人のまま時間がたっていたら、名札の読み取りから
    let askName = '';
    if (WHO) {   // 名札の QR から開いた：その人に切り替え、URL から who を外す（読み込み直しても切り替え直さない）
      if (isPart()) { askName = WHO; asking = WHO; save('person', ''); }   // パートさん用のスマホでは、確かめてから
      else applyWho(WHO);
      try { history.replaceState(null, '', location.pathname + (ID ? '?id=' + encodeURIComponent(ID) : '')); } catch (e) {}
    }
    if (showPlan === false && VIEW) showPlan = true;   // 調べるときは、計画の中身を開いて出す
    render();
    if (askName) askWho(askName);
    setInterval(refresh, 15000);
  })
  .catch(e => showMessage(e.message));
</script>
<script src="spray.js"></script>
</body>
