<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なえログ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="weather.js?v=7"></script>
<style>
  :root { --orange: #d4834a; --orange-d: #9a5320; --orange-l: #fdf5ee; --green: #4f9363; --green-d: #2f6b3a; --green-l: #f0f6f1; --line: #d6e2d8; --gray: #6b6b6b; --red: #c33; --bg: #f6f7f5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #222; font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 15px; line-height: 1.5; }
  a { color: var(--green); }
  button { font-family: inherit; }
  header { background: var(--green); color: #fff; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { font-size: 12px; opacity: .9; }
  header a, header .hbtn { color: #fff; font-size: 13px; white-space: nowrap; background: none; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 4px 10px; text-decoration: none; cursor: pointer; }
  #sync { font-size: 12px; background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  #sync[hidden] { display: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 90px; }
  .muted { color: var(--gray); font-size: 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }

  /* 担当の登録 */
  .roles { display: grid; gap: 10px; margin-top: 12px; }
  .role { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; font-size: 17px; font-weight: bold; }
  .role small { display: block; font-weight: normal; font-size: 12px; color: var(--gray); margin-top: 2px; }
  .role.sel { border-color: var(--green); background: var(--green-l); }
  .field { display: block; margin-top: 16px; font-size: 13px; color: var(--gray); }
  .field input { display: block; width: 100%; font-size: 18px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 4px; font-family: inherit; }
  .primary { width: 100%; margin-top: 18px; padding: 14px; font-size: 17px; font-weight: bold; border-radius: 12px; border: none; background: var(--green); color: #fff; cursor: pointer; }
  .primary:disabled { background: #b9c9bd; }
  .names { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .nmbtn { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 16px; cursor: pointer; color: #222; }
  .nmbtn.sel { border-color: var(--green); background: var(--green-l); font-weight: bold; }
  .myassign { margin-bottom: 12px; border-color: var(--green); }
  .myassign h3 { margin: 0 0 6px; font-size: 15px; color: var(--green-d); }
  .myassign .ma { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 6px 0; border-top: 1px dashed #e5e5e5; font-size: 14px; }
  .myassign .ma a { font-weight: bold; color: inherit; }
  .myassign .ma .what { flex: 1; min-width: 90px; color: #444; }
  .backbtn { width: 100%; margin-top: 10px; padding: 12px; font-size: 15px; border-radius: 12px; border: 1px solid #ccc; background: #fff; color: #444; cursor: pointer; }

  /* 最初の画面（作業を登録する／作業を調べる） */
  .big { display: block; width: 100%; text-align: left; border: none; border-radius: 16px; padding: 28px 22px; margin-top: 16px; font-size: 26px; font-weight: bold; color: #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .big small { display: block; font-size: 13px; font-weight: normal; opacity: .95; margin-top: 6px; }
  .big.reg { background: var(--orange); }
  .big.find { background: var(--green); }
  a.big { text-decoration: none; }
  .big.sched { background: #3d6fa8; }
  .role.part { border-style: dashed; }
  /* ログインの画面：部署でしぼるタブ（下の名前のボタンとは別の見た目にする） */
  .depttabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 2px; margin: 6px 0 12px; border-bottom: 2px solid var(--line); }
  .depttabs .lb { font-size: 12px; color: var(--gray); padding: 0 8px 9px 2px; flex: none; }
  .dtab { flex: none; background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 8px 12px; font-size: 14px; color: var(--gray); cursor: pointer; font-family: inherit; }
  .dtab.sel { color: var(--green-d); font-weight: bold; border-bottom-color: var(--green); }
  /* 最初の画面の上の帯：まん中に天気、右に名前とログアウト */
  .fronthead { flex-wrap: wrap; }
  /* 作業を調べる：絞り込みの帯。項目を横1列に並べ、押すと下に開く。スクロールしても、上の帯のすぐ下に残る */
  .fbar { position: sticky; top: var(--hh, 0px); z-index: 4; background: var(--bg); margin: 12px -4px 4px; padding: 8px 4px 6px; border-bottom: 1px solid var(--line); }
  .fcats { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .fcats::-webkit-scrollbar { display: none; }
  .fcat { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 10px 7px 12px; font-size: 14px; color: #333; cursor: pointer; font-family: inherit; }
  .fcat .ar { font-size: 10px; color: #999; margin-left: 4px; display: inline-block; transition: transform .15s; }
  .fcat.open { background: var(--green-l); border-color: var(--green); } .fcat.open .ar { transform: rotate(180deg); }
  .fcat.has { border-color: var(--green); color: var(--green-d); font-weight: bold; }
  .fcat .n { display: inline-block; min-width: 18px; margin-left: 5px; padding: 0 5px; border-radius: 999px; background: var(--green); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
  .fclear { flex: none; border: none; background: none; color: var(--gray); text-decoration: underline; font-size: 13px; cursor: pointer; font-family: inherit; padding: 0 6px; }
  .fpanel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 0 2px; max-height: 38vh; overflow-y: auto; }
  .fchip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 14px; color: #333; cursor: pointer; font-family: inherit; }
  .fchip small { color: #999; font-size: 11px; margin-left: 5px; }
  .fchip.on { background: var(--green); border-color: var(--green); color: #fff; font-weight: bold; } .fchip.on small { color: rgba(255,255,255,.8); }
  /* 日時：カレンダーで、日をいくつでも選ぶ（押すたびに、選ぶ／はずす） */
  .fpanel.dt { max-height: none; }
  .fcalw { flex: 1 0 100%; }
  .fcal { max-width: 340px; margin-top: 4px; border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 8px; }
  .fcal .hd { display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .fcal .hd button { border: 1px solid var(--line); background: #fff; border-radius: 8px; width: 36px; height: 30px; cursor: pointer; font-size: 15px; font-family: inherit; color: #333; }
  .fcal .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .fcal .w { font-size: 11px; color: var(--gray); padding: 2px 0; } .fcal .w.su { color: var(--red); } .fcal .w.sa { color: #2563eb; }
  .fcal .dy { border: 0; background: none; border-radius: 8px; height: 36px; font-size: 14px; cursor: pointer; font-family: inherit; color: #333; padding: 0; }
  .fcal .dy:hover { background: var(--green-l); }
  .fcal .dy.td { box-shadow: inset 0 0 0 1px var(--green); }
  .fcal .dy.on { background: var(--green); color: #fff; font-weight: bold; }
  .fcal .nt { font-size: 11px; color: var(--gray); margin-top: 4px; }
  .fmore { font-size: 13px; color: var(--gray); display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; }
  .fmore input { font-size: 14px; padding: 5px 6px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
  .fsum { font-size: 12px; color: var(--green-d); padding-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fhit { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--orange-l); color: var(--orange-d); font-size: 11px; font-weight: normal; vertical-align: 1px; }
  .loginlogo { text-align: center; margin: 2px 0 10px; }
  .loginlogo .appname { font-size: 22px; font-weight: bold; color: var(--green-d); letter-spacing: .08em; margin-top: 2px; }
  .loginmain { padding-top: 28px; }   /* ログインの画面は、上の緑の帯を出さない */
  .loginlogo img { width: 120px; height: auto; mix-blend-mode: multiply; }   /* ロゴの白い地を、画面の地の色になじませる */
  /* お知らせ：予定日を過ぎた作業（メニューのいちばん上。押すと一覧がひらく） */
  .notice { background: #fdecec; border: 1px solid #e9a8a8; border-radius: 14px; margin-top: 16px; overflow: hidden; }
  .notice summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 10px; color: #8f1d1d; }
  .notice summary::-webkit-details-marker { display: none; }
  .notice summary b { font-size: 17px; }
  .notice summary .br { font-size: 12px; opacity: .9; }
  .notice summary .tw { margin-left: auto; font-size: 12px; white-space: nowrap; }
  .notice[open] summary .tw::after { content: 'とじる ▴'; } .notice:not([open]) summary .tw::after { content: '見る ▾'; }
  .notice .nl { max-height: 46vh; overflow: auto; border-top: 1px solid #e9a8a8; background: #fff; }
  .notice .nh { position: sticky; top: 0; background: #f8dcdc; color: #8f1d1d; font-size: 12px; font-weight: bold; padding: 4px 16px; }
  .notice a.nr { display: flex; gap: 10px; align-items: baseline; padding: 9px 16px; border-top: 1px solid #f3e3e3; color: inherit; text-decoration: none; font-size: 14px; }
  .notice a.nr:hover { background: #fdf5f5; }
  .notice .nd { flex: none; min-width: 4.2em; color: var(--red); font-weight: bold; font-size: 13px; }
  .notice .nn { flex: 1; min-width: 0; } .notice .nn small { display: block; color: #777; font-size: 12px; }
  header .hbtn.ntc { background: #fff; color: #b3261e; border-color: #fff; font-weight: bold; }
  .tologin { background: none; border: none; color: var(--green-d); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 4px; }
  a.big, a.scanbtn { display: block; text-decoration: none; }
  .big.wish { background: #7a5ea8; padding: 18px 22px; font-size: 22px; }
  a.wishbtn { margin-top: 8px; background: #fff; color: var(--green-d); border: 2px solid var(--green); text-align: center; }
  a.wishbtn small { display: block; font-size: 12px; font-weight: normal; color: var(--gray); }
  /* パートさん用：だれとして記録するかの確認 */
  #ask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #ask[hidden] { display: none; }
  /* まだ登録していない名札を読んだとき：だれの名札かを選ぶ */
  #reg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
  #reg[hidden] { display: none; }
  #reg .box { background: #fff; border-radius: 18px; padding: 20px 18px 16px; width: 92%; max-width: 420px; max-height: 86vh; overflow-y: auto; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  #reg .msg { font-size: 19px; font-weight: bold; line-height: 1.4; }
  #reg .sub { font-size: 13px; color: var(--gray); margin: 6px 0 10px; }
  #reg .names { justify-content: center; }
  #reg .no { display: block; width: 100%; margin-top: 14px; padding: 14px; font-size: 17px; font-weight: bold; border-radius: 12px; cursor: pointer; background: #fff; border: 2px solid #bbb; color: #444; }
  #ask .box { background: #fff; border-radius: 18px; padding: 24px 22px 20px; width: 88%; max-width: 380px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  #ask .msg { font-size: 23px; font-weight: bold; line-height: 1.4; }
  #ask button { display: block; width: 100%; margin-top: 12px; padding: 16px; font-size: 19px; font-weight: bold; border-radius: 12px; cursor: pointer; }
  #ask .yes { background: var(--green); color: #fff; border: none; }
  #ask .no { background: #fff; border: 2px solid #bbb; color: #444; }
  .whobar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-size: 16px; }
  .whobar b { font-size: 20px; }
  .whobar button { flex: none; background: #fff; border: 2px solid var(--orange); color: var(--orange-d); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: bold; cursor: pointer; }
  /* 調べる */
  .findrow { width: 100%; text-align: left; font-family: inherit; font-size: 15px; cursor: pointer; color: #222; }
  .findrow .fs span { margin-right: 10px; white-space: nowrap; }
  .findrow .fs .ok { color: var(--green-d); }
  button.btn-link { cursor: pointer; font-family: inherit; }
  .btn-link.on { background: var(--green); color: #fff; }
  /* どの画面でも上の帯に出す3つのボタン（作業を登録する・作業を調べる・スケジュール） */
  header { flex-wrap: wrap; }
  header .gnav { order: 9; flex: 1 0 100%; display: flex; gap: 6px; }
  header .gnav a, header .gnav .hbtn { flex: 1; text-align: center; font-size: 14px; padding: 6px 4px; }
  header .gnav .on { background: #fff; color: var(--green-d); font-weight: bold; }
  header .hbtn.on { background: rgba(255,255,255,.25); font-weight: bold; }
  /* 右上の札：今使っている人と役割 */
  header:has(.me) > div:first-child { flex: 1 1 auto; }
  header .hbtns { order: 2; display: flex; gap: 6px; flex: none; }
  header .me { order: 3; display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 3px 12px 3px 4px; color: #fff; cursor: pointer; font-family: inherit; text-align: left; max-width: 46vw; }
  header .me:hover { background: rgba(255,255,255,.22); }
  header .me .ic { width: 30px; height: 30px; border-radius: 50%; background: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  header .me .ic svg { width: 20px; height: 20px; fill: var(--green-d); }
  header .me .tx { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  header .me b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .me small { font-size: 11px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* スマホ：名前だけの小さな札にして、見出しと同じ段に収める（役割は押した先の画面で分かる） */
  @media (max-width: 600px) {
    header .me { padding: 2px 8px 2px 2px; gap: 5px; max-width: 34vw; }
    header .me .ic { width: 24px; height: 24px; }
    header .me .ic svg { width: 16px; height: 16px; }
    header .me small { display: none; }
    header .me b { font-size: 13px; }
    header:has(.me) > div:first-child { flex: 1 1 0; min-width: 0; }
    /* 1段目＝題名と名前の札、2段目＝ボタン。題名は1行に収める（ボタンに押されて、1字ずつ縦に折り返すのを防ぐ） */
    header:not(.fronthead):has(.me) h1, header:not(.fronthead):has(.me) .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header:not(.fronthead):has(.me) .me { order: 1; }
    header:not(.fronthead):has(.me) .hbtns { order: 4; flex: 1 0 100%; }
  }
  /* とてもせまいスマホ（幅340px 以下）：3つのボタンの字を小さくして、横にはみ出さないようにする */
  @media (max-width: 340px) { header .gnav { gap: 4px; } header .gnav a, header .gnav .hbtn { font-size: 12px; padding: 6px 2px; min-width: 0; } }
  /* スマホのスケジュール画面：上の緑の帯は3つのボタンの1段だけにする（カレンダーと割り振り表の切り替えは、中の白い帯のリンクで） */
  @media (max-width: 820px) {
    header.schedhead { padding: 6px 8px; }
    header.schedhead .ht, header.schedhead .hbtns, header.schedhead .me { display: none !important; }
    header.schedhead .gnav { gap: 4px; }
    header.schedhead .gnav .hbtn { padding: 5px 2px; font-size: 13px; }
  }
  #schedframe { display: block; width: 100%; border: 0; background: var(--bg); height: calc(100vh - var(--hh, 110px)); height: calc(100dvh - var(--hh, 110px)); }

  /* タブ */
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 2px solid var(--line); }
  /* 業務を選ぶ画面（作業を登録する → 何の作業をするか） */
  .bizh { font-size: 20px; margin: 18px 0 10px; }
  .bizgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .bizbtn { display: block; width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 16px 14px; font-size: 19px; font-weight: bold; color: #222; cursor: pointer; font-family: inherit; }
  .bizbtn:hover { border-color: var(--orange); }
  .bizbtn small { display: block; font-size: 12px; font-weight: normal; color: var(--gray); margin-top: 4px; }
  .bizbtn small .late { color: var(--red); font-weight: bold; }
  .bizbtn.last { border-color: var(--orange); background: #fff7f0; }
  .bizbtn.plan { margin-top: 14px; background: var(--green-l); border-color: #b9d6c0; font-size: 16px; }
  .bizbar { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
  .bizbar b { font-size: 20px; }
  .bizbar button { background: #fff; border: 1px solid #bbb; border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .tabs button { background: none; border: none; padding: 8px 12px; font-size: 15px; font-weight: bold; color: var(--gray); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tabs button.on { color: var(--green-d); border-bottom-color: var(--green); }
  .tabs .n { font-size: 12px; background: var(--orange); color: #fff; border-radius: 999px; padding: 0 7px; margin-left: 4px; }

  /* やること（担当者） */
  .day { margin: 16px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .day h3 { margin: 0; font-size: 15px; }
  .day h3 .when { font-size: 12px; font-weight: normal; border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
  .day h3 .late { background: #f8dcdc; color: var(--red); }
  .day h3 .today { background: #fbe4d2; color: var(--orange-d); }
  .selall { font-size: 13px; background: #fff; border: 1px solid var(--green); color: var(--green); border-radius: 8px; padding: 3px 10px; cursor: pointer; }
  .task { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
  .task.picked { border-color: var(--green); background: var(--green-l); }
  .task input[type=checkbox] { width: 24px; height: 24px; flex: none; accent-color: var(--green); }
  .task .body { flex: 1; min-width: 0; }
  .task .nm { font-weight: bold; }
  .task .nm a { color: inherit; text-decoration: none; }
  .task .fs { font-size: 12px; color: #444; }
  .task .fs b { font-weight: normal; color: var(--gray); }
  .task .warn { font-size: 11px; color: var(--orange-d); }
  .task .act { flex: none; display: flex; align-items: center; gap: 6px; }
  .qty { width: 64px; font-size: 16px; padding: 8px 6px; border: 1px solid #ccc; border-radius: 8px; text-align: right; font-family: inherit; }
  .done-btn { padding: 10px 14px; font-size: 15px; font-weight: bold; border-radius: 10px; border: none; background: var(--orange); color: #fff; cursor: pointer; white-space: nowrap; }
  .empty { text-align: center; padding: 30px 10px; color: var(--gray); }
  /* 場所（ハウス・ベンチ）の入力 */
  .place { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--gray); }
  .place input, .place select { font-size: 16px; padding: 7px 6px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; background: #fff; color: #222; }
  .place input { width: 62px; text-align: right; }
  .place input.memo { flex: 1; min-width: 120px; width: auto; text-align: left; }
  /* マイナス（足りなかった本数）：出ない／出た、本数、理由 */
  .minus { margin-top: 10px; font-size: 13px; color: var(--gray); border: 1px solid #e3b4b4; background: #fff8f8; border-radius: 10px; padding: 8px 10px 10px; }
  .minus .mtitle { font-weight: bold; color: var(--red); font-size: 14px; margin-bottom: 6px; }
  .minus .mtitle small { font-weight: normal; color: var(--gray); font-size: 11px; }
  /* 完了にする数（鉢上げしたトレイ数など）。マイナスの欄と分けて、単位を後ろに出す */
  .qline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; font-weight: bold; color: #222; }
  .qline .ql { min-width: 7em; }
  .qu { font-size: 14px; color: #444; margin-left: 4px; }

<script>
// QR から開いたときは ?id=QRID が付いている
let ID = new URLSearchParams(location.search).get('id') || '';
// 調べるだけのときは &view=1 が付く（記録のボタンを出さない）
let VIEW = new URLSearchParams(location.search).get('view') === '1';
// 名札の QR から開いたときは ?who=名前 が付いている

function qrSvg(text) {
  try {
    const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
    return qr.createSvgTag({ cellSize: 3, margin: 2, scalable: true });
  } catch (e) { return '<div class="muted">QRを表示できません</div>'; }
}
function majorSteps(m) { return state.steps.filter(s => s.major === m); }
function isDone(plan, s) { return !!(plan.status[s.key] || {}).done; }
function majorProgress(plan, m) {
  const ss = majorSteps(m);
  return { done: ss.filter(s => isDone(plan, s)).length, total: ss.length };
}
function majorState(plan, m, nx) {
  const pr = majorProgress(plan, m);
  if (pr.done === pr.total) return 'done';
  if (nx && nx.major === m) return 'now';
  return pr.done > 0 ? 'part' : 'todo';
}

// 4つ目のフェーズ「薬散」：鉢上げのあとも出荷まで何回も続くので「完了」にはしない。回数を出す。鉢上げまで終わったら「作業中」
function sprayCount(plan) {

// 計画の名前：「0415 ﾐﾆﾄﾏﾄ ﾐﾆｷｬﾛﾙ」（出荷日の月日 ＋ 品目 ＋ 品種。2026-11-23 近藤さんFBで播種日→出荷日に）。
// 出荷日がなければ播種予定日、どちらもなければ月日なし。
// 営利の表（品目・品種がない）は「注文NO 穂木×台木」、それもなければ商品名。Code.gs の planName_ と同じ形
function planName(p) {
  const has = c => p.v[c] !== undefined && String(p.v[c]).trim() !== '';
  const dv = c => String((p.w && p.w[c]) || p.v[c] || '').match(/(\d{1,2})\/(\d{1,2})(?!\d)/);
  const m = dv('出荷日') || dv('播種予定日');
  const md = m ? [m[1].padStart(2, '0') + m[2].padStart(2, '0')] : [];
  const a = ['品目', '品種'].filter(has).map(c => p.v[c]);
  if (a.length) return md.concat(a).join(' ');
  const g = ['穂木', '台木'].filter(has).map(c => p.v[c]).join('×');
  const b = [has('注文NO') ? p.v['注文NO'] : '', g || (has('商品名') ? p.v['商品名'] : '')].filter(x => String(x) !== '');
  if (b.length) return md.concat(b).join(' ');
  return has('品番') ? String(p.v['品番']) : p.id;
}

// 担当の大項目で見る計画の列：工程シートの「色を付ける列」＋ 大項目の名前で始まる列。2つ目以降の大項目はポットの大きさ・色も
function majorFields(m) {
  const cols = [];
  majorSteps(m).forEach(s => (s.colorCols || []).forEach(c => { if (!cols.includes(c)) cols.push(c); }));
  const sample = state.plans[0] ? Object.keys(state.plans[0].v) : [];
  // 自動で書く工程の列（小項目の名前・「完了」を取った名前）と「次の作業」の列は、計画の情報ではないので出さない
  const auto = ['次の作業'];
  state.steps.forEach(s => { auto.push(s.minor, taskName(s)); if (s.qtyCol) auto.push(s.qtyCol); });
  sample.forEach(c => { if (c.indexOf(m) === 0 && !cols.includes(c) && !auto.includes(c)) cols.push(c); });
  if (majors().indexOf(m) > 0) ['Pサイズ', 'P色'].forEach(c => { if (sample.includes(c) && !cols.includes(c)) cols.push(c); });
  return cols;
}

}

// 「この計画を見る」で出す列：計画の表の全部の列（表の並びのまま）。自動で書く工程の列・QRID・空の列は出さない
function planAllHtml(plan) {

  state.steps.forEach(s => { auto.push(s.minor, taskName(s)); if (s.qtyCol) auto.push(s.qtyCol); });

function defaultQty(plan, s) {
  if (qtyEdit[plan.id + '|' + s.key] !== undefined) return qtyEdit[plan.id + '|' + s.key];

// ---------- 数量を「〇トレイ〇列」で入れる（工程シートの「数量の入力」が「トレイと列」の工程） ----------
// トレイの穴数：計画の「播種トレイ」の数字（TR288 → 288、128 → 128）。分からなければ 0
function trayHoles(plan) {
  const m = String(plan.v['播種トレイ'] == null ? '' : plan.v['播種トレイ']).normalize('NFKC').match(/\d+/);
  return m ? Number(m[0]) : 0;
}
// 1列の穴数：穴数 ÷ 2 の平方根を丸める（72→6、128→8、200→10、288→12、406→14。Excel のアドインと同じ決め方）
function trayPerLine(holes) { return holes > 0 ? Math.max(1, Math.round(Math.sqrt(holes / 2))) : 0; }
// 計画から出す初めの値。「播種の枚数列数」（2枚24列・2TR11列）→ 播種粒数 ÷ 穴数 → 播種TR数 の順。出せなければ空
function trayPlan(plan) {
  const t = String(plan.v['播種の枚数列数'] == null ? '' : plan.v['播種の枚数列数']).normalize('NFKC').match(/(\d+)\s*(?:枚|TR|トレイ)\s*(?:(\d+)\s*列)?/i);
  if (t) return { tray: t[1], line: t[2] || '0' };
  const holes = trayHoles(plan), per = trayPerLine(holes);
  const seeds = Number(plan.v['播種粒数']);
  if (holes && seeds > 0) {
    const n = Math.floor(seeds / holes);
    return { tray: String(n), line: String(Math.ceil((seeds - n * holes) / per - 1e-9)) };
  }
  const tr = Number(plan.v['播種TR数']);
  if (tr > 0) {
    const n = Math.floor(tr + 1e-9);
    return { tray: String(n), line: holes ? String(Math.ceil((tr - n) * holes / per - 1e-9)) : '0' };
  }
  return { tray: '', line: '' };
}
function trayValue(plan, s) { return trayEdit[plan.id + '|' + s.key] || trayPlan(plan); }
// 数量の入力欄。ふつうは数を1つ。「トレイと列」の工程は「〔 〕トレイ〔 〕列」。dq は data-qty に入れる文字（やること画面は QRID、計画画面は QRID|工程）

function qtyInputHtml(plan, s, dq, label, noRef) {
  if (!s.needQty) return '';

  if (!s.trayMode) return `<input class="qty" type="number" inputmode="decimal" step="any" data-qty="${esc(dq)}" value="${esc(defaultQty(plan, s))}" aria-label="${esc(label)}">${s.unit ? `<span class="qu">${esc(s.unit)}</span>` : ''}${ref}`;
  const k = esc(plan.id + '|' + s.key), v = trayValue(plan, s);
  return `<span class="trayin"><input class="qty" type="number" inputmode="numeric" min="0" step="1" data-tk="${k}" data-tl="tray" value="${esc(v.tray)}" aria-label="トレイの数">トレイ
    <input class="qty" type="number" inputmode="numeric" min="0" step="1" data-tk="${k}" data-tl="line" value="${esc(v.line)}" aria-label="列の数">列</span>${ref}`;
}
// 欄の外に出す、元の計画の値と予定日（欄の数を消しても、正解が分かるように。2026-11-23 近藤さんFB）。鉢上げは出さない
function planRefHtml(plan, s) {
  if (s.major === '鉢上げ') return '';
  let q = '';

  else if (s.compare && plan.v[s.compare] !== undefined && String(plan.v[s.compare]) !== '') q = plan.v[s.compare] + (s.unit || '');
  const dc = dateCol(s.major), d = dc ? (plan.w[dc] || plan.v[dc] || '') : '';
  if (!q && !d) return '';
  return `<div class="qref">計画 <b>${esc(q || '－')}</b>${d ? '　予定日 <b>' + esc(d) + '</b>' : ''}</div>`;
}
// 欄を直したら覚える（描き直しても消えない）
document.addEventListener('input', e => {

// メモの頭の「2トレイ11列」（記録のときに付ける）。なければ空
function trayOf(memo) { const m = String(memo || '').match(/^(\d+トレイ\d+列)/); return m ? m[1] : ''; }
// メモから、頭の「2トレイ11列」を取ったもの（人が書いたメモ）
function memoRest(memo) { return String(memo || '').replace(/^\d+トレイ\d+列[　\s]*/, ''); }
// 記録に出す数量：「2トレイ11列（600粒）」。トレイと列の記録でなければ「600粒」

// 予定との過不足（HTML）。予定を下回っていたら赤
function diffText(plan, step, qty) {

  const d = Math.round((Number(qty) - Number(plan.v[step.compare])) * 10) / 10;

// 真ん中のポップアップ。kind：wait／ok（少しして消える。取り消しボタン付き）／err。引数なしで閉じる
function popup(kind, msg, sub, onUndo) {
  const el = document.getElementById('saving');
  clearTimeout(popup.timer);
  if (!kind) { el.hidden = true; return; }
  el.className = kind;
  document.getElementById('saving-box').innerHTML =
    (kind === 'wait' ? '<div class="spin"></div>' : '<div class="mark">' + (kind === 'ok' ? '✓' : '✕') + '</div>') +

    (kind === 'err' ? '<button type="button" id="pop-close">閉じる</button>' : '') +
    (kind === 'ok' && onUndo ? '<button type="button" class="undo" id="pop-undo">まちがえた（取り消す）</button>' : '');

}

// ---------- 送信（押したらすぐ画面に反映し、裏で送る） ----------
function rebuild() {
  state = JSON.parse(JSON.stringify(server));
  if (!state.logs) state.logs = [];
  (state.shorts || []).forEach(x => { if (shortPatch[x.logId]) Object.assign(x, shortPatch[x.logId].f); });   // 送っている途中の対処・解消
  const name = getName();
  queue.forEach(job => {
    if (job.type !== 'record' || job.cancel) return;
    job.items.forEach(it => {
      const plan = state.plans.find(p => p.id === it.id);
      // マイナスが出た記録は、解消するまで完了にしない（窓口の readStatus_ と同じ。hold ＝ 解消待ち）
      if (plan) plan.status[it.major + '／' + it.minor] = { done: !(Number(it.short) > 0), hold: Number(it.short) > 0, time: '送信中…', person: name, qty: it.qty, house: it.house, bench: it.bench, short: Number(it.short) > 0 ? Number(it.short) : 0, reason: it.reason || '', memo: it.memo || '', pending: true };
    });
  });
}
function syncBadge() {
  const n = queue.filter(j => j.type === 'record' && !j.cancel).reduce((a, j) => a + j.items.length, 0);
  const b = document.getElementById('sync');
  if (b) { b.hidden = !n; b.textContent = '送信中 ' + n + '件'; }
}
function enqueue(job) {
  queue.push(job);
  rebuild(); render(); syncBadge();
  pump();
  return job;
}
async function pump() {
  if (sending || !queue.length) return;
  sending = true;
  const job = queue[0];
  try {
    if (job.type === 'record' && !job.cancel) {
      const s = await postApi({ action: 'recordMany', items: job.items, person: getName() });
      server = s; job.created = s.created || [];
      if (job.cancel) {  // 送っている間に「取り消す」が押された
        server = await postApi({ action: 'delete', logIds: job.created, person: getName(), planner: isPlanner() });
      }
    } else if (job.type === 'delete') {
      server = await postApi({ action: 'delete', logIds: job.logIds, person: getName(), planner: isPlanner() });
    }
    queue.shift();
    if (job.done) job.done();
  } catch (e) {
    queue.shift();
    popup('err', job.type === 'delete' ? '消せませんでした' : '記録できませんでした', e.message + (job.type === 'record' ? '\nもう一度押してください' : ''));
    try { server = await fetchState(); } catch (e2) {}
  }
  sending = false;
  rebuild(); render(); syncBadge();
  pump();
}
// 記録する（items：[{id, major, minor, qty}]）。押した瞬間に完了の表示にして、取り消しボタン付きの ✓ を出す
function complete(items, label) {
  if (!items.length) return;
  const job = enqueue({ type: 'record', items: items.map(it => Object.assign({ op: '完了' }, it)) });
  popup('ok', label, items.length > 1 ? items.length + '件をまとめて記録しました' : '', () => undo(job));
}
function undo(job) {
  if (queue[0] === job && sending) { job.cancel = true; toast('取り消しています…'); }
  else if (queue.includes(job)) { queue.splice(queue.indexOf(job), 1); toast('取り消しました'); }
  else if (job.created && job.created.length) { enqueue({ type: 'delete', logIds: job.created, done: () => toast('取り消しました') }); }
  rebuild(); render(); syncBadge();
}
function removeLogs(ids, what) {
  if (!confirm(what + '\nこの記録を消しますか？（実績シートからも消えます）')) return;
  popup('wait', '消しています…');
  enqueue({ type: 'delete', logIds: ids, done: () => popup('ok', '消しました') });
}
function refresh() {
  if (queue.length || !document.getElementById('saving').hidden) return;
  if (inSetup || scan || asking) return;       // 担当・名前を選んでいる間、QR を読んでいる間は描き直さない
  if (document.activeElement && /^(INPUT|SELECT)$/.test(document.activeElement.tagName)) return;  // 入力中は描き直さない
  fetchState().then(s => { server = s; rebuild(); syncCaps(); render(); }).catch(() => {});
}

// 予定日は年つきの日付（plan.d。窓口が送る）で比べる。古い窓口で d が無いときは、何も出さない
function todayIso() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function isoDays(a, b) { const u = k => Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10)); return Math.round((u(b) - u(a)) / 86400000); }
function overdueList() {

      const iso = p.d && p.d[col], s = iso && iso < today ? nextIn(p, m) : null;
      if (s) out.push({ p, m, s, iso, days: isoDays(iso, today) });
    });

  return out.sort((a, b) => a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : a.p.id < b.p.id ? -1 : 1);
}

// 1件分の記録。数量が要る工程は、行の入力欄の数（最初は予定の数）を使う。場所が要る工程は、入れてあればハウス・ベンチも付ける
function itemFor(p, s) {
  let qty = '', trayMemo = '';
  if (s.needQty && s.trayMode) {
    // 「〇トレイ〇列」：欄の値（なければ計画から出した値）を、粒に直して記録する。メモの頭に「2トレイ11列」と残す
    const v = Object.assign({}, trayValue(p, s));
    document.querySelectorAll('[data-tk]').forEach(x => { if (x.dataset.tk === p.id + '|' + s.key) v[x.dataset.tl] = x.value; });
    const tray = String(v.tray == null ? '' : v.tray).trim(), line = String(v.line == null ? '' : v.line).trim() || '0';
    if (tray === '' || !/^\d+$/.test(tray) || !/^\d+$/.test(line)) { toast(planName(p) + '：トレイと列の数を入れてください', true); return null; }
    const holes = trayHoles(p);
    qty = holes ? Number(tray) * holes + Number(line) * trayPerLine(holes) : Number(tray);   // 穴数が分からない計画は、トレイの数だけ
    trayMemo = Number(tray) + 'トレイ' + Number(line) + '列';
  } else if (s.needQty) {
    const el = document.querySelector('[data-qty="' + CSS.escape(p.id + '|' + s.key) + '"]') || document.querySelector('[data-qty="' + CSS.escape(p.id) + '"]');
    qty = el ? el.value : defaultQty(p, s);
    if (qty === '' || isNaN(Number(qty))) { toast(planName(p) + '：数量を入れてください', true); return null; }
  }
  const e = s.needPlace ? (placeEdit[p.id + '|' + s.key] || {}) : {};
  if (!e.col !== !e.num) { toast(planName(p) + '：ベンチは列（A・B・C）と番号の両方を選んでください', true); return null; }
  if (e.num2 && !e.num) { toast(planName(p) + '：ベンチは、はじめの番号も選んでください', true); return null; }
  // ベンチ：1本なら「A10」、何本かにまたがるなら「A10〜15」（逆に選んであれば小さいほうから）
  const n1 = Number(e.num), n2 = Number(e.num2 || e.num);
  const bench = !e.col ? '' : e.col + (n1 === n2 ? n1 : Math.min(n1, n2) + '〜' + Math.max(n1, n2));
  // マイナスを聞く工程：「出ない」「出た」のどちらかを選んでもらう。「出た」なら、本数と理由も要る
  const x = s.needShort ? (placeEdit[p.id + '|' + s.key] || {}) : {};
  let short = '', reason = '';
  if (s.needShort) {
    if (x.minus !== 'yes' && x.minus !== 'no') { toast(planName(p) + '：マイナスが「出ない」か「出た」かを選んでください', true); return null; }
    if (x.minus === 'yes') {
      const n = String(x.short === undefined ? '' : x.short).trim();
      if (!/^\d+$/.test(n) || Number(n) <= 0) { toast(planName(p) + '：マイナスの本数を入れてください', true); return null; }
      const why = REASONS.filter((r, i) => x['r' + i]), other = String(x.memo || '').trim();
      if (x.rx || other) why.push('その他' + (other ? '：' + other : ''));
      if (!why.length) { toast(planName(p) + '：マイナスの理由を選んでください', true); return null; }
      short = Number(n); reason = why.join('、');
    }
  }
  return { id: p.id, major: s.major, minor: s.minor, qty: qty, house: String(e.house || '').trim(), bench: bench,
    short: short, reason: reason, memo: trayMemo };
}

// 計画担当の一覧のカード（上の欄の文字でしぼる。名前・QRID・注文NO・品番・商品名・出荷先）
let planText = '';
let planBiz = '';                 // 計画担当の一覧：次の作業の業務で絞る（'' すべて、'__done' 全部済んだもの）。作業の順に並ぶ（2026-11-23 近藤さんFB）
function plannerCardsHtml() {
  const q = nk(planText);
  const ord = p => { const nx = nextStep(p); return nx ? state.steps.indexOf(nx) : 999; };
  const due = p => { const nx = nextStep(p); const c = nx ? bizDateCol(bizOf(nx)) : ''; return (c && p.d && p.d[c]) || '9999'; };
  const list = state.plans.filter(p => !q || nk([planName(p), p.id, p.v['注文NO'], p.v['品番'], p.v['商品名'], p.v['出荷先']].join(' ')).includes(q))
    .filter(p => { if (!planBiz) return true; const nx = nextStep(p); return planBiz === '__done' ? !nx : !!nx && bizOf(nx) === planBiz; })
    .sort((a, b) => ord(a) - ord(b) || (due(a) < due(b) ? -1 : due(a) > due(b) ? 1 : 0) || (a.id < b.id ? -1 : 1));
  return list.map(p => {
      const nx = nextStep(p);
      const steps = state.steps.map(s => {
        const st = p.status[s.key] || {};
        const tag = st.done ? '<span class="tag ok">完了</span>' : nx && nx.key === s.key ? '<span class="tag now">次の作業</span>' : '<span class="tag ng">未完了</span>';

// ---------- マイナスの一覧（鉢上げマイナス報告用紙の代わり）：① 報告　→　② プラグ担当者の対処　→　③ ハウス担当者の解消 ----------
// 計画担当の「マイナス」タブと、「作業を調べる」の一覧の両方で使う。② ③ を書けるのは社員（パートさん用のスマホでは見るだけ）
const FIX_KINDS = ['余剰プラグで対応', '追加播種', '解消しない', 'その他'];
function shortOpen() { return (state.shorts || []).filter(x => shortState(x).open).length; }   // まだ終わっていない件数
function shortCard(x, link, editable) {
  const s = state.steps.find(y => y.major === x.major && y.minor === x.minor), st = shortState(x);
  const p = state.plans.find(y => y.id === x.id);
  const pv = c => p ? String((p.w && p.w[c]) || p.v[c] || '').trim() : '';
  const info = [pv('Pサイズ') && 'ポット ' + pv('Pサイズ'),
    pv('鉢上予定日') && '鉢上げ予定 ' + pv('鉢上予定日') + (pv('鉢上予定TR数') ? '（' + pv('鉢上予定TR数') + 'TR）' : ''),
    pv('出荷日') && '出荷予定 ' + pv('出荷日') + (pv('出荷TR数') ? '（' + pv('出荷TR数') + 'TR）' : ''),
    pv('出荷先') && '出荷先 ' + pv('出荷先')].filter(Boolean).join('／');
  const why = [x.reason, memoRest(x.memo)].filter(String).join('　');
  const e = fixEdit[x.logId] || {}, id = esc(x.logId);
  const val = (k, cur) => e[k] !== undefined ? e[k] : (cur === null || cur === undefined ? '' : cur);
  // ① → ② → ③ の流れ。② と ③ は書く人がちがうので、書き込む欄はそれぞれのボタン（「対処を登録する」「解消を登録する」）で別々に開く。
  // 書いてある段階は中身だけを出す（「直す」で欄を開く）。fixOpen[記録ID:2]・[記録ID:3] が、欄を開いている印
  const open2 = fixOpen[x.logId + ':2'], open3 = fixOpen[x.logId + ':3'];
  const close = n => `<button type="button" class="sub" data-shclose="${id}:${n}">閉じる</button>`;
  const btns = [];   // まだ開いていない段階のボタン（横に並べる）
  // ② 対処
  let fix = '';
  if (fixText(x) && !open2) {
    fix = `<div class="fx2"><b>② 対処</b><span class="fixed">${esc(fixText(x))}</span><span class="muted">${esc(x.fixBy)} ${esc(x.fixAt)}</span>
      ${editable ? `<button type="button" class="sub" data-fixopen="${id}:2">直す</button>` : ''}</div>`;
  } else if (editable && open2) {
    const kind = val('kind', x.fixKind);
    fix = `<div class="fx2"><b>② 対処</b>
      <select data-fx="${id}" data-ff="kind" aria-label="対処の種類"><option value="">－ 選ぶ －</option>${FIX_KINDS.map(k => `<option${k === kind ? ' selected' : ''}>${k}</option>`).join('')}</select>
      ${kind === '追加播種' ? `<input type="number" inputmode="numeric" min="0" step="1" data-fx="${id}" data-ff="grains" value="${esc(val('grains', x.grains))}" aria-label="追加播種の粒数">粒　解消予定<input type="date" data-fx="${id}" data-ff="due" value="${esc(val('due', x.due))}" aria-label="解消予定日">` : ''}
      <input type="text" maxlength="200" data-fx="${id}" data-ff="note" value="${esc(val('note', x.fix))}" placeholder="メモ（例：ふじいろで代替）" aria-label="対処のメモ">
      <button type="button" data-fixsave="${id}">${fixText(x) ? '直す' : '対処を書く'}</button>${close(2)}</div>`;
  } else if (editable) btns.push(`<button type="button" class="sub" data-fixopen="${id}:2">② 対処を登録する</button>`);
  // ③ 解消（② が「解消しない」なら要らない）
  let solve = '';
  if (x.solved && !open3) {
    solve = `<div class="fx2"><b>③ 解消</b><span class="${x.solved === 'できた' ? 'fixed' : 'short'}">解消${esc(x.solved)}</span><span class="muted">実施日 ${esc(md(x.solvedDate))}　${esc(x.solvedBy)}</span>
      ${editable ? `<button type="button" class="sub" data-fixopen="${id}:3">直す</button>` : ''}</div>`;
  } else if (editable && x.fixKind !== '解消しない') {
    if (open3) solve = `<div class="fx2"><b>③ 解消</b>実施日<input type="date" data-fx="${id}" data-ff="date" value="${esc(val('date', x.solvedDate) || today())}" aria-label="マイナス解消実施日">
      <button type="button" data-solve="${id}" data-res="できた">解消できた</button><button type="button" class="ng" data-solve="${id}" data-res="できなかった">解消できなかった</button>
      ${x.solved ? `<button type="button" class="sub" data-solve="${id}" data-res="">消す</button>` : ''}${close(3)}</div>`;
    else btns.push(`<button type="button" class="sub" data-fixopen="${id}:3">③ 解消を登録する</button>`);
  }
  return shortHead(x, s, st, link, why, info) + fix + solve + (btns.length ? `<div class="fx2">${btns.join('')}</div>` : '') + '</div>';
}
// マイナスのカードの頭（① 報告）。閉じタグは呼ぶ側で付ける

function shortTabHtml() {
  const list = state.shorts || [];
  if (!list.length) return '<div class="empty">マイナスの記録はありません</div><p class="muted">工程シートの「不足の入力」を「あり」にした工程で、完了のときに「マイナス：出た」を選ぶと、ここに並びます。</p>';
  return list.map(x => shortCard(x, 'url', true)).join('') + '<p class="muted">新しい順。② 対処と ③ 解消を書くと、その計画の画面（担当者のスマホ）にも出ます。② を消すときは、種類を「－ 選ぶ －」、メモを空にして「直す」を押します。</p>';
}
// which：'open'（未完了＝③ に着いていない）／'done'（完了）
function shortListHtml(which) {
  const list = (state.shorts || []).filter(x => !which || shortState(x).open === (which === 'open'));
  if (!list.length) return '<div class="empty">' + (which === 'open' ? '未完了のマイナスはありません' : which === 'done' ? '完了したマイナスはありません' : 'マイナスの記録はありません') + '</div>';
  return list.map(x => shortCard(x, 'open', !isPart() && !!getName())).join('');

function bindShortTab() {
  document.querySelectorAll('[data-fx]').forEach(el => el.oninput = el.onchange = () => {
    (fixEdit[el.dataset.fx] = fixEdit[el.dataset.fx] || {})[el.dataset.ff] = el.value;
    if (el.dataset.ff === 'kind') render();   // 「追加播種」なら粒数と解消予定の欄を出す
  });
  document.querySelectorAll('[data-fixopen]').forEach(b => b.onclick = () => { fixOpen[b.dataset.fixopen] = true; render(); });
  // 閉じる：その段階の欄だけ閉じて、書きかけを捨てる（記録ID:2 ／ 記録ID:3）
  document.querySelectorAll('[data-shclose]').forEach(b => b.onclick = () => {
    const v = b.dataset.shclose, i = v.lastIndexOf(':'), id = v.slice(0, i), n = v.slice(i + 1);
    delete fixOpen[v];
    const e = fixEdit[id];
    if (e) { (n === '2' ? ['kind', 'grains', 'due', 'note'] : ['date']).forEach(k => delete e[k]); }
    render();
  });
  // 押したらすぐ画面に反映し（shortPatch）、窓口へは裏で送る。窓口は返事に数秒かかるため、待たせない
  const send = (id, body, done, patch) => {
    const seq = (shortPatch[id] ? shortPatch[id].seq : 0) + 1;
    shortPatch[id] = { seq: seq, f: Object.assign({}, shortPatch[id] ? shortPatch[id].f : {}, patch) };
    delete fixEdit[id]; delete fixOpen[id + ':2']; delete fixOpen[id + ':3']; delete shortExpand[id];   // 書いたら、今の段階だけの表示にもどす
    rebuild(); render();
    toast(done);
    postApi(Object.assign({ logId: id, person: getName(), planner: isPlanner(), staff: !isPart() }, body)).then(s => {
      server = s;
      if (shortPatch[id] && shortPatch[id].seq === seq) delete shortPatch[id];
      rebuild();
      if (!(document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))) render();   // 入力中は描き直さない
    }).catch(e => {
      delete shortPatch[id];
      rebuild(); render();
      popup('err', '書けませんでした（元にもどしました）', e.message);
    });
  };
  const now = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
  document.querySelectorAll('[data-fixsave]').forEach(b => b.onclick = () => {
    const id = b.dataset.fixsave, cur = (state.shorts || []).find(x => x.logId === id) || {}, e = fixEdit[id] || {};
    const get = (k, c) => String(e[k] !== undefined ? e[k] : (c === null || c === undefined ? '' : c)).trim();
    const kind = get('kind', cur.fixKind), note = get('note', cur.fix);
    if (!kind && !note && !fixText(cur)) { toast('対処を選んでください', true); return; }
    const grains = get('grains', cur.grains), due = get('due', cur.due), has = !!(kind || note);
    send(id, { action: 'fixShort', kind: kind, grains: grains, due: due, fix: note }, has ? '対処を書きました' : '対処を消しました',
      has ? { fixKind: kind, grains: kind === '追加播種' ? grains : '', due: kind === '追加播種' ? due : '', fix: note, fixBy: getName(), fixAt: now() }
        : { fixKind: '', grains: '', due: '', fix: '', fixBy: '', fixAt: '' });
  });
  document.querySelectorAll('[data-solve]').forEach(b => b.onclick = () => {
    const id = b.dataset.solve, el = document.querySelector('[data-fx="' + CSS.escape(id) + '"][data-ff="date"]');
    const res = b.dataset.res, date = el ? el.value : '';
    send(id, { action: 'solveShort', result: res, date: date }, res ? '解消' + res + '、と書きました' : '解消を消しました',
      { solved: res, solvedDate: res ? date : '', solvedBy: res ? getName() : '' });
  });
}

function renderPlan(plan) {

    const firstOpen = nextIn(plan, m);

        if (r.qty !== '' && r.qty != null) info += '　' + qtyText(r, s) + diffText(plan, s, r.qty);
        if (placeText(r)) info += '　' + esc(placeText(r));
        if (shortInfo(r)) info += '<br>' + shortInfo(r, !r.pending);
        const log = state.logs.find(l => l.id === plan.id && l.major === s.major && l.minor === s.minor && l.op === '完了');

    return `<section class="major"><h2>${esc(m)}${head}</h2>

      ${isPlanner() || isPart() ? '' : `<button type="button" class="others" id="others">${showAll ? '自分の担当だけにする' : 'ほかの工程も見る'}</button>`}
      ${isPart() ? '<button type="button" class="primary" id="p-more">ほかの作業を登録する</button><button type="button" class="backbtn" id="p-next">次の人に替わる</button>' : ''}
    </main>`;
  bindHeader();
  document.getElementById('bulkbar').hidden = true;
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    const s = state.steps.find(x => x.key === b.dataset.step);
    const item = itemFor(plan, s);
    if (item) complete([item], '「' + taskName(s) + '」完了');
  });
  document.getElementById('seeplan').onclick = () => { showPlan = !showPlan; render(); };
  const o = document.getElementById('others'); if (o) o.onclick = () => { showAll = !showAll; render(); };
  const pm = document.getElementById('p-more'); if (pm) pm.onclick = () => goPage('reg');
  const pn = document.getElementById('p-next'); if (pn) pn.onclick = nextPerson;
  bindDelete();
  if (hasSpray()) bindPest(plan);
  bindQty(k => { const s = state.steps.find(x => x.key === k.slice(plan.id.length + 1)); return s ? { p: plan, s } : null; });
  bindPlace();
}

// ---------- QR をまとめて読む（やること画面）：読んだ計画を「選んだ」状態にする ----------
function scanDraw(msg, isErr) {
  const m = document.getElementById('scan-msg');
  if (msg !== undefined) { m.textContent = msg; m.className = 'msg' + (isErr ? ' err' : ''); }
  const n = scan ? scan.items.filter(x => x.ok).length : 0;
  const multi = !scan || !scan.mode;   // 計画の QR をまとめて読んでいる
  document.getElementById('scan-cnt').textContent = multi && n ? n + '件を選びました' : '';
  document.getElementById('scan-list').innerHTML = (scan ? scan.items : []).map(x =>
    `<div class="${x.ok ? '' : 'ng'}">${x.ok ? '✓ ' : '✕ '}${esc(x.text)} <small>${esc(x.id)}</small></div>`).join('');
  document.getElementById('scan-end').textContent = scan && scan.mode === 'gate' ? '名前の一覧から選ぶ'
    : !multi ? 'やめる' : n ? '読み終わる（' + n + '件を選んだ）' : '読み終わる';
}
// QR の中身（画面のURL?id=QRID）から QRID を取り出す。QRID だけの QR も読める
function qrId(text) {
  text = String(text || '').trim();
  try { const id = new URL(text).searchParams.get('id'); if (id) return id.trim(); } catch (e) {}
  return /^[A-Za-z0-9][A-Za-z0-9_-]{2,39}$/.test(text) ? text : '';
}
function onScan(text) {
  if (!scan) return;
  if (scan.mode === 'badge') {        // 名札を読む：1枚読んだら、その人に切り替えて終わる
    if (scan.hold) return;
    const who = badgeName(text);
    if (who) { stopScan(true); applyWho(who); render(); return; }
    if (badgeCode(text)) return askBadge(badgeCode(text));
    if (!scan.seen['?' + text]) { scan.seen['?' + text] = true; scan.items.unshift({ ok: false, id: String(text).slice(0, 30), text: '名札の QR ではありません' }); scanDraw(); }
    return;
  }
  if (scan.mode === 'gate') {         // パートさん用：名札を読んだら「〇〇 さんとして記録します」と確かめる
    if (scan.hold) return;
    const who = badgeName(text);
    if (who) return askWho(who);
    if (badgeCode(text)) return askBadge(badgeCode(text));
    if (!scan.seen['?' + text]) { scan.seen['?' + text] = true; scan.items.unshift({ ok: false, id: String(text).slice(0, 30), text: '名札の QR ではありません' }); scanDraw(); }
    return;
  }
  if (scan.mode === 'one' || scan.mode === 'find') {   // 1つ読んだら、その計画の画面を開く（find は見るだけ）
    const id1 = qrId(text), k1 = id1 || '?' + text;
    if (id1 && state.plans.some(p => p.id === id1)) { const v = scan.mode === 'find'; stopScan(true); openPlan(id1, v); return; }
    if (!scan.seen[k1]) { scan.seen[k1] = true; scan.items.unshift({ ok: false, id: id1 || String(text).slice(0, 30), text: id1 ? 'この QR の計画が見つかりません' : '計画の QR ではありません' }); scanDraw(); }
    return;
  }
  if (scan.mode === 'spray') {        // 薬散：一緒に散布したロットの QR を続けて読み、散布の対象に足す（2026-11-23 近藤さんFB）
    const id2 = qrId(text), k2 = id2 || '?' + text;
    if (scan.seen[k2]) return;
    scan.seen[k2] = true;
    const p2 = id2 && state.plans.find(q => q.id === id2);
    if (p2 && typeof window.addSprayLot === 'function') {
      const added = window.addSprayLot(id2);
      scan.items.unshift({ ok: true, id: id2, text: planName(p2) + (added ? '（足しました）' : '（もう入っています）') });
      try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    } else scan.items.unshift({ ok: false, id: id2 || String(text).slice(0, 30), text: id2 ? 'この QR の計画が見つかりません' : '計画の QR ではありません' });
    scanDraw();
    return;
  }
  const id = qrId(text), key = id || '?' + text;
  if (scan.seen[key]) return;          // 同じ QR は1回だけ
  scan.seen[key] = true;
  const x = id && myTodo().find(y => y.p.id === id);
  if (x) {
    picked.add(id);
    scan.items.unshift({ ok: true, id: id, text: planName(x.p) + '（' + taskName(x.s) + '）' });
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
  } else {
    const p = id && state.plans.find(q => q.id === id);
    scan.items.unshift({ ok: false, id: id || String(text).slice(0, 30),
      text: !id ? '計画の QR ではありません' : p ? planName(p) + '：あなたのやることにありません（飛ばしました）' : 'この QR の計画が見つかりません（飛ばしました）' });
  }
  scanDraw();
}
function loadScript(src) {
  return new Promise((ok, ng) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => ng(new Error('読み込めません'));
    document.head.appendChild(s);
  });
}
// mode：'badge' ＝ 名札を読む（担当・名前の画面から）、'gate' ＝ 名札を読んで確かめる（パートさん用）、
//       'one' ＝ 計画の QR を1つ読んで開く、'find' ＝ 1つ読んで調べる。それ以外は計画の QR をまとめて読む
async function startScan(mode) {
  if (scan) return;
  const el = document.getElementById('scan'), video = document.getElementById('scan-video');
  const me = scan = { seen: {}, items: [], stream: null, timer: 0, busy: false, mode: ['badge', 'gate', 'one', 'find', 'spray'].indexOf(mode) >= 0 ? mode : '', hold: false };
  el.hidden = false;
  document.getElementById('scan-end').onclick = stopScan;
  scanDraw('カメラを開いています…');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return scanDraw('このブラウザではカメラを使えません。https で始まるURLを、Safari か Chrome で開いてください。', true);
  }
  let stream;
  try {
    // 画質を指定しないと、Android の Chrome は 640×480 で開く（荒く見える）。高い画質を求める（出せない機種は出せる範囲になる）
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    } catch (e) {
      if (e.name !== 'OverconstrainedError') throw e;
      // まれに、画質の指定で開けない機種がある。そのときは指定なしで開き直す
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    }
  } catch (e) {
    if (scan !== me) return;
    return scanDraw(e.name === 'NotAllowedError' || e.name === 'SecurityError' ? 'カメラが許可されていません。ブラウザの設定でこのページのカメラを許可してから、もう一度、読み取りのボタンを押してください。'
      : e.name === 'NotFoundError' || e.name === 'OverconstrainedError' ? 'カメラが見つかりません。'
      : e.name === 'NotReadableError' ? 'カメラをほかのアプリが使っています。そのアプリを閉じてから、もう一度押してください。'
      : 'カメラを開けませんでした（' + e.name + '）。', true);
  }
  if (scan !== me) { stream.getTracks().forEach(tr => tr.stop()); return; }   // 開いている間に「読み終わる」が押された
  me.stream = stream;
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  scanTune(stream);
  // 読み取り：BarcodeDetector があればそれ、なければ jsQR
  let detector = null;
  try {
    if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] });
  } catch (e) {}
  if (!detector && typeof window.jsQR !== 'function') {
    try { await loadScript(JSQR_URL); } catch (e) {
      if (scan === me) scanDraw('QR を読む部品を読み込めませんでした。電波の状態を確認して、読み終わってからもう一度押してください。', true);
      return;
    }
  }
  if (scan !== me) return;
  scanDraw(me.mode === 'badge' || me.mode === 'gate' ? '自分の名札の QR にカメラを向けてください。' : me.mode === 'spray' ? '一緒に散布したロットの QR に、続けてカメラを向けてください。' : me.mode ? '計画の QR にカメラを向けてください。' : 'QR にカメラを向けてください。続けて何枚でも読めます。');
  const canvas = document.createElement('canvas');
  me.timer = setInterval(async () => {
    if (scan !== me || me.busy || video.readyState < 2 || !video.videoWidth) return;
    me.busy = true;
    try {
      let texts = [];
      if (detector) {
        texts = (await detector.detect(video)).map(c => c.rawValue);
      } else {
        const k = Math.min(1, 800 / Math.max(video.videoWidth, video.videoHeight));
        const w = canvas.width = Math.round(video.videoWidth * k), h = canvas.height = Math.round(video.videoHeight * k);
        const g = canvas.getContext('2d', { willReadFrequently: true });
        g.drawImage(video, 0, 0, w, h);
        const c = window.jsQR(g.getImageData(0, 0, w, h).data, w, h);
        if (c && c.data) texts = [c.data];
      }
      texts.forEach(onScan);
    } catch (e) {}
    me.busy = false;
  }, 250);
}
// カメラが対応していれば：ピントを合わせ続ける（連続オートフォーカス）。ズームのつまみを出す（前に使った倍率を覚える）
function scanTune(stream) {
  const box = document.getElementById('scan-zoom');
  box.hidden = true;
  const tr = stream.getVideoTracks()[0];
  if (!tr || !tr.getCapabilities) return;
  let caps = {};
  try { caps = tr.getCapabilities() || {}; } catch (e) { return; }
  if ((caps.focusMode || []).includes('continuous')) tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
  const z = caps.zoom;
  if (!z || !(z.max > z.min)) return;
  const r = document.getElementById('scan-zoomr'), v = document.getElementById('scan-zoomv');
  const max = Math.min(z.max, Math.max(z.min, 4));   // 4倍まで（それより先は画質が落ちるだけ）
  r.min = z.min; r.max = max; r.step = z.step || 0.1;
  let saved = Number(localStorage.getItem('qrdemo.scanZoom'));
  if (!(saved >= z.min && saved <= max)) saved = z.min;
  const set = x => { v.textContent = '×' + (Math.round(x * 10) / 10); tr.applyConstraints({ advanced: [{ zoom: x }] }).catch(() => {}); };
  r.value = saved; set(saved);
  r.oninput = () => { const x = Number(r.value); set(x); try { localStorage.setItem('qrdemo.scanZoom', String(x)); } catch (e) {} };
  box.hidden = false;
}
function stopScan(keep) {
  const me = scan;
  scan = null;
  if (me) {
    clearInterval(me.timer);
    if (me.stream) me.stream.getTracks().forEach(tr => tr.stop());
  }
  const video = document.getElementById('scan-video');
  try { video.pause(); video.srcObject = null; } catch (e) {}
  document.getElementById('scan').hidden = true;
  if (!asking) document.getElementById('ask').hidden = true;
  document.getElementById('reg').hidden = true;
  if (keep === true || (me && me.mode === 'badge')) return;   // 名札を読んでいたときは、担当・名前の画面のまま
  if (me && me.mode === 'gate') gateManual = true;            // パートさん用：カメラを閉じた。名前の一覧から選べる
  if (me && me.mode) { if (state) render(); return; }
  if (state) { tab = 'todo'; render(); }
}

// ---------- パートさん用（共有のスマホ）：名札の QR を読んで、その人として記録する ----------
function touchPart() { partAt = Date.now(); save('partAt', String(partAt)); }
function partExpired() { return Date.now() - (partAt || Number(load('partAt')) || 0) > PART_IDLE_MIN * 60000; }
function knownPerson(name) { const l = state.people || []; return !l.length || l.some(p => p.name === name); }
// 名札の番号をそろえる（全角・小文字・空白のちがいを無視して比べる。Code.gs の badgeKey_ と同じ）
function badgeKey(s) { return String(s == null ? '' : s).normalize('NFKC').replace(/\s+/g, '').toUpperCase(); }
// 名札の QR の中身 → 名前。「画面のURL?who=名前」の名札か、今ある名札の番号（人の一覧の「名札の番号」。STF-82 など）。分からなければ空
function badgeName(text) {
  text = String(text || '').trim();
  try { const w = (new URL(text).searchParams.get('who') || '').trim(); if (w) return w; } catch (e) {}
  const k = badgeKey(text);
  const p = k && (state.people || []).find(x => x.badge && badgeKey(x.badge) === k);
  return p ? p.name : '';
}
// まだ登録していない名札の番号として扱えるか（URL でない、40文字までの文字）。扱えなければ空
function badgeCode(text) {
  text = String(text || '').trim();
  return text && text.length <= 40 && !/^https?:/i.test(text) ? badgeKey(text) : '';
}
// まだ登録していない名札を読んだ：だれの名札かを選んでもらい、人の一覧の「名札の番号」に覚える。次からは読むだけで切り替わる
function askBadge(code) {
  if (!scan || scan.hold) return;
  if (scan.seen['b' + code]) return;             // 「やり直す」を押した直後に、同じ名札でまた出ないように少し待つ
  const all = state.people || [];
  if (!all.length) { scan.seen['b' + code] = true; return scanDraw('人の一覧が空なので、名札（' + code + '）を登録できません。先に人の一覧に名前を入れてください。', true); }
  const gate = scan.mode === 'gate';
  const parts = all.filter(p => p.kubun && p.kubun.indexOf('社員') < 0);
  const list = (gate && parts.length ? parts.concat(all.filter(p => !parts.includes(p))) : all).filter(p => !p.badge);
  scan.hold = true;
  const el = document.getElementById('reg');
  document.getElementById('reg-msg').textContent = 'この名札（' + code + '）は、まだ登録されていません';
  document.getElementById('reg-sub').textContent = 'だれの名札ですか？　名前を押すと覚えます。次からは、読むだけで切り替わります。';
  document.getElementById('reg-names').innerHTML = list.map(p => `<button type="button" class="nmbtn" data-rname="${esc(p.name)}">${esc(p.name)}</button>`).join('')
    || '<div class="muted">名札をまだ登録していない人が、人の一覧にいません。</div>';
  el.hidden = false;
  const close = () => { el.hidden = true; if (scan) { scan.hold = false; scan.seen['b' + code] = true; setTimeout(() => { if (scan) delete scan.seen['b' + code]; }, 4000); } };
  document.getElementById('reg-no').onclick = () => { close(); if (scan) scanDraw('自分の名札の QR にカメラを向けてください。'); };
  el.querySelectorAll('[data-rname]').forEach(b => b.onclick = async () => {
    const name = b.dataset.rname;
    el.hidden = true;
    popup('wait', '名札を登録しています…');
    try {
      server = await postApi({ action: 'setBadge', code: code, name: name });
      if (!server.logs) server.logs = [];
      rebuild(); popup();
      if (!scan) return;

// ---------- 作業を調べる（見るだけ。担当や名前を決めていなくても見られる） ----------
const nk = s => String(s == null ? '' : s).normalize('NFKC').toLowerCase().replace(/\s+/g, '');
// 絞り込み：日時・動き・出荷先・品目・品種。どれも、いくつでも選べる。同じ項目の中は「どれか」、項目どうしは「全部」に当てはまる計画を出す。
// 出てくる言葉は、計画の表（スプレッドシート）の中身から作る。
//   日時 … その日に予定のある計画（動きも選んでいれば、その動きの予定日。選んでいなければ、どの動きでも）
//   動き … 日時を選んでいなければ、その作業がまだ終わっていない計画（接木・出荷は、予定日のある計画）
const FIND_CATS = [['date', '日時'], ['move', '動き'], ['cust', '出荷先'], ['item', '品目'], ['kind', '品種']];
const findF = { date: new Set(), move: new Set(), cust: new Set(), item: new Set(), kind: new Set() };
let findCat = '';                         // 開いている項目
let findMon = null;                       // 日時のカレンダーで出している月（その月の1日）
const MOVE_SHIP = '出荷', MOVE_GRAFT = '接木';
const mdKey = v => { const m = String(v == null ? '' : v).match(/(\d{1,2})\/(\d{1,2})/); return m ? m[1].padStart(2, '0') + '/' + m[2].padStart(2, '0') : ''; };
const moveCol = m => m === MOVE_SHIP ? '出荷日' : m === MOVE_GRAFT ? '接木日' : dateCol(m);
const moveDate = (p, m) => { const c = moveCol(m); return c ? mdKey((p.w && p.w[c]) || p.v[c]) : ''; };
function findMoves() {
  const l = majors().slice();
  if (state.plans.some(p => mdKey(p.v['接木日']))) l.push(MOVE_GRAFT);
  if (state.plans.some(p => mdKey(p.v['出荷日']))) l.push(MOVE_SHIP);
  return l;
}
const planVal = (p, cols) => { for (const c of cols) { const v = String(p.v[c] == null ? '' : p.v[c]).trim(); if (v) return v; } return ''; };
const FIND_VAL = { cust: p => planVal(p, ['出荷先', '受注先', '取引先']), item: p => planVal(p, ['品目', '穂木', '商品名']), kind: p => planVal(p, ['品種', '台木']) };
const moveLeft = (p, m) => m === MOVE_SHIP || m === MOVE_GRAFT ? !!moveDate(p, m) : !!nextIn(p, m);
// その計画で、選んだ日時（と動き）に当たるもの：[{ m 動き, d 月/日 }]
function findHits(p) {
  if (!findF.date.size) return [];
  return (findF.move.size ? [...findF.move] : findMoves()).map(m => ({ m, d: moveDate(p, m) })).filter(x => findF.date.has(x.d));
}
function findPass(p) {
  for (const k of ['cust', 'item', 'kind']) if (findF[k].size && !findF[k].has(FIND_VAL[k](p))) return false;
  if (findF.date.size) return findHits(p).length > 0;
  if (findF.move.size) return [...findF.move].some(m => moveLeft(p, m));
  return true;
}
const findCount = () => FIND_CATS.reduce((n, c) => n + findF[c[0]].size, 0);
function findList() {
  const q = nk(findText);
  return state.plans.filter(p => findPass(p) && (!q || nk([planName(p), p.id, p.v['注文NO'], p.v['品番'], p.v['商品名'], p.v['出荷先']].join(' ')).includes(q)));
}
// 今日から7日間（月/日 と、出す文字）
function findDays() {
  const out = [], t = new Date();
  for (let i = 0; i < 7; i++) {
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i);
    out.push({ k: String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0'), label: (d.getMonth() + 1) + '/' + d.getDate() + '(' + '日月火水木金土'[d.getDay()] + ')' + (i === 0 ? ' 今日' : '') });
  }
  return out;
}
// 項目を開いたときに並べる言葉：[{ k 鍵, label, n 件数 }]
function findOptions(cat) {
  if (cat === 'date') {
    const days = findDays(), more = [...findF.date].filter(k => !days.some(d => d.k === k)).sort();
    return days.concat(more.map(k => ({ k, label: Number(k.slice(0, 2)) + '/' + Number(k.slice(3)) })));
  }
  if (cat === 'move') return findMoves().map(m => ({ k: m, label: m }));
  const cnt = {};
  state.plans.forEach(p => { const v = FIND_VAL[cat](p); if (v) cnt[v] = (cnt[v] || 0) + 1; });
  return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || a.localeCompare(b, 'ja')).map(k => ({ k, label: k, n: cnt[k] }));
}
// 日時のカレンダー：1か月ぶん。日を押すたびに、選ぶ／はずす（いくつでも選べる）。月は ‹ › で送る
function fcalHtml() {

  let cells = '日月火水木金土'.split('').map((w, i) => `<span class="w${i === 0 ? ' su' : i === 6 ? ' sa' : ''}">${w}</span>`).join('') + '<span></span>'.repeat(lead);
  for (let d = 1; d <= n; d++) cells += `<button type="button" class="dy${findF.date.has(k2(d)) ? ' on' : ''}${isT(d) ? ' td' : ''}" data-fval="${k2(d)}" aria-pressed="${findF.date.has(k2(d))}">${d}</button>`;

  const cats = FIND_CATS.map(([k, lb]) => `<button type="button" class="fcat${findF[k].size ? ' has' : ''}${findCat === k ? ' open' : ''}" data-fcat="${k}" aria-expanded="${findCat === k}">${lb}${findF[k].size ? `<span class="n">${findF[k].size}</span>` : ''}<span class="ar">▾</span></button>`).join('');

      const r = plan.status[s.key] || {};
      if (r.done) {
        let info = esc(r.time) + (r.person ? '　' + esc(r.person) : '');
        if (r.qty !== '' && r.qty != null) info += '　' + qtyText(r, s) + diffText(plan, s, r.qty);
        if (placeText(r)) info += '　' + esc(placeText(r));
        if (shortInfo(r)) info += '<br>' + shortInfo(r, true);
        return `<li class="done"><span class="mark">✓</span><div class="box"><div class="t">${esc(taskName(s))}<span class="tag ok">完了</span></div><div class="info">${info}</div></div></li>`;
      }
      if (r.hold) return `<li class="hold"><span class="mark">!</span><div class="box"><div class="t">${esc(taskName(s))}<span class="tag ng">マイナスの解消待ち</span></div><div class="info">${esc(r.time)}　${esc(r.person || '')}<br>${shortInfo(r, true)}</div></div></li>`;
      const isCur = nx && nx.key === s.key;
      return `<li class="${isCur ? 'cur' : 'todo'}"><span class="mark"></span><div class="box">
        <div class="t">${esc(taskName(s))}${isCur ? '<span class="tag now">次の作業</span>' : '<span class="tag ng">未完了</span>'}</div><div class="desc">${esc(s.note)}</div></div></li>`;
    }).join('');
    return `<section class="major"><h2>${esc(m)}${head}</h2>
      <div class="fs muted" style="margin:-4px 0 8px">${fieldsHtml(plan, m)}${dateCol(m) ? '　<b>予定日</b> ' + esc(plan.w[dateCol(m)] || plan.v[dateCol(m)]) : ''}</div>
      <ol class="tl">${items}</ol></section>`;
  }).join('');
  document.getElementById('app').innerHTML = `
    <header><div style="min-width:0"><h1>作業を調べる</h1><div class="sub">見るだけの画面です</div></div>
      ${hbtnsHtml('<button type="button" class="hbtn" id="tofind">一覧へ</button>')}${navHtml()}</header>
    <main style="max-width:560px">
      <div class="card plan-card">
        <span class="badge">${esc(plan.id)}</span>
        <div class="name">${esc(planName(plan))}</div>
        <button type="button" class="seeplan" id="seeplan" aria-expanded="${showPlan}">${showPlan ? '計画を閉じる' : 'この計画を見る'}</button>
        ${showPlan ? planAllHtml(plan) : ''}
      </div>
      ${stepperHtml(plan, false)}
      ${nextBoxHtml(plan, nx)}
      ${sections}
      ${hasSpray() ? pestHistoryHtml(plan, true) : ''}
      <button type="button" class="backbtn" id="v-back">ほかの計画を調べる</button>
    </main>`;
  document.getElementById('bulkbar').hidden = true;
  document.getElementById('home').onclick = () => goPage('front');
  document.getElementById('tofind').onclick = () => goPage('find');
  document.getElementById('v-back').onclick = () => goPage('find');
  if (hasSpray()) bindPest(plan);
  document.getElementById('seeplan').onclick = () => { showPlan = !showPlan; render(); };
}

// ---------- 画面の切り替え ----------
function planMissing() {
  document.getElementById('app').innerHTML = headerHtml('', true) + `<main><div class="card">この QR（${esc(ID)}）の計画が見つかりません。</div></main>`;
  document.getElementById('bulkbar').hidden = true;
  bindHeader();
}
// ログインが要るか：社員の画面で、まだログインしていない（パートさん用のスマホは、ログインしない）
function needLogin() { return !isPart() && !loggedIn(); }
function render() { renderBody(); afterRender(); }
// PC では main がスクロールする。描き直しても、見ていた所を動かさない（画面を替えたときだけ、いちばん上へ）
let paneTop = 0, paneReset = false;
function toTop() { window.scrollTo(0, 0); paneTop = 0; paneReset = true; const m = document.querySelector('#app > main'); if (m) m.scrollTop = 0; }
document.addEventListener('scroll', ev => { if (ev.target.matches && ev.target.matches('#app > main')) paneTop = ev.target.scrollTop; }, true);
new MutationObserver(() => {
  const m = document.querySelector('#app > main');
  if (!m || m.dataset.pane) return;
  m.dataset.pane = '1';
  if (m.style.maxWidth) m.style.setProperty('--mw', m.style.maxWidth);
  if (paneReset) { paneReset = false; paneTop = 0; } else if (paneTop) { const t = paneTop; m.scrollTop = t; requestAnimationFrame(() => { m.scrollTop = t; }); }
}).observe(document.getElementById('app'), { childList: true });
// 描いたあと：上の帯に天気の帯を入れる（ログインの画面には上の帯がない）。上の帯の高さを測っておく（絞り込みの帯を、そのすぐ下に固定するため）
function afterRender() {
  const h = document.querySelector('#app > header');
  if (!h) return;
  if (typeof wxMount === 'function') wxMount(h);
  // 上の帯の共通のボタン（どの画面でも同じ働き）
  const c = document.getElementById('chg'); if (c) c.onclick = askLogout;
  const hm = document.getElementById('home'); if (hm) hm.onclick = () => goPage('front');
  const np = document.getElementById('nextp'); if (np) np.onclick = nextPerson;
  const fit = () => { if (h.isConnected) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); };
  fit(); setTimeout(fit, 700);
}
window.addEventListener('resize', () => { const h = document.querySelector('#app > header'); if (h) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); });
function renderBody() {
  // 最初の画面をふくめ、どの画面の前にも、まずログイン（ログインの一覧は窓口の状態に入っているので、届くまで待つ）
  if (needLogin()) { if (state) renderSetup(); return; }
  if (page === 'schedule' || page === 'calendar' || page === 'whiteboard') return renderSchedule();   // 窓口の状態を待たずに出す（表は自分で読み込む）
  if (!state) return;
  if (page === 'front' && !inSetup) return renderFront();
  if (page === 'find') {
    const p = ID && state.plans.find(x => x.id === ID);
    return p ? renderPlanView(p) : renderFind();
  }
  // ここから「作業を登録する」
  if (isPart() && !inSetup) {   // パートさん用のスマホ：だれかが決まっていなければ、先に名札を読む
    if (!getName()) return renderGate();
    if (ID) { const plan = state.plans.find(p => p.id === ID); return plan ? renderPlan(plan) : planMissing(); }
    return renderPart();
  }
  if (inSetup || !loggedIn()) return renderSetup();
  inSetup = false;
  if (ID) {
    const plan = state.plans.find(p => p.id === ID);
    return plan ? renderPlan(plan) : planMissing();
  }
  if (!isPlanner() && sprayMode()) return renderSpray();
  if (bizSel === '__plan' && isPlanner()) return renderPlanner();
  if (bizSel === '__spray' && pestOn()) return renderSpray();   // 業務の「薬散」
  renderWorker();   // 業務を選んでいなければ、選ぶ画面
}
function showMessage(msg) {
  document.getElementById('app').innerHTML = `<header><h1>なえログ</h1></header><main><div class="card">${esc(msg)}</div></main>`;
}
if ((page === 'schedule' || page === 'calendar' || page === 'whiteboard') && !needLogin()) renderSchedule(); else showMessage('読み込んでいます…');
fetchState()
  .then(s => {
    server = s; if (!server.logs) server.logs = []; rebuild(); syncCaps();
    partAt = Number(load('partAt')) || 0;
    if (isPart() && getName() && partExpired()) save('person', '');   // 前の人のまま時間がたっていたら、名札の読み取りから
    let askName = '';
    if (WHO) {   // 名札の QR から開いた：その人に切り替え、URL から who を外す（読み込み直しても切り替え直さない）
      if (isPart()) { askName = WHO; asking = WHO; save('person', ''); }   // パートさん用のスマホでは、確かめてから
      else applyWho(WHO);
      try { history.replaceState(null, '', location.pathname + (ID ? '?id=' + encodeURIComponent(ID) : '')); } catch (e) {}
    }
    if (showPlan === false && VIEW) showPlan = true;   // 調べるときは、計画の中身を開いて出す
    render();
    if (askName) askWho(askName);
    setInterval(refresh, 15000);
  })
  .catch(e => showMessage(e.message));
</script>
<script src="spray.js?v=5"></script>
<script src="feedback.js?v=2"></script>
</body>
