<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR一元管理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
  :root { --orange: #d4834a; --orange-d: #9a5320; --orange-l: #fdf5ee; --green: #4f9363; --green-d: #2f6b3a; --green-l: #f0f6f1; --line: #d6e2d8; --gray: #6b6b6b; --red: #c33; --bg: #f6f7f5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #222; font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 15px; line-height: 1.5; }
  a { color: var(--green); }
  button { font-family: inherit; }
  header { background: var(--green); color: #fff; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { font-size: 12px; opacity: .9; }
  header a, header .hbtn { color: #fff; font-size: 13px; white-space: nowrap; background: none; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 4px 10px; text-decoration: none; cursor: pointer; }
  #sync { font-size: 12px; background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  #sync[hidden] { display: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 90px; }
  .muted { color: var(--gray); font-size: 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }

  /* 担当の登録 */
  .roles { display: grid; gap: 10px; margin-top: 12px; }
  .role { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; font-size: 17px; font-weight: bold; }
  .role small { display: block; font-weight: normal; font-size: 12px; color: var(--gray); margin-top: 2px; }
  .role.sel { border-color: var(--green); background: var(--green-l); }
  .field { display: block; margin-top: 16px; font-size: 13px; color: var(--gray); }
  .field input { display: block; width: 100%; font-size: 18px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 4px; font-family: inherit; }
  .primary { width: 100%; margin-top: 18px; padding: 14px; font-size: 17px; font-weight: bold; border-radius: 12px; border: none; background: var(--green); color: #fff; cursor: pointer; }
  .primary:disabled { background: #b9c9bd; }

  /* タブ */
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 2px solid var(--line); }
  .tabs button { background: none; border: none; padding: 8px 12px; font-size: 15px; font-weight: bold; color: var(--gray); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tabs button.on { color: var(--green-d); border-bottom-color: var(--green); }
  .tabs .n { font-size: 12px; background: var(--orange); color: #fff; border-radius: 999px; padding: 0 7px; margin-left: 4px; }

  /* やること（担当者） */
  .day { margin: 16px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .day h3 { margin: 0; font-size: 15px; }
  .day h3 .when { font-size: 12px; font-weight: normal; border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
  .day h3 .late { background: #f8dcdc; color: var(--red); }
  .day h3 .today { background: #fbe4d2; color: var(--orange-d); }
  .selall { font-size: 13px; background: #fff; border: 1px solid var(--green); color: var(--green); border-radius: 8px; padding: 3px 10px; cursor: pointer; }
  .task { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
  .task.picked { border-color: var(--green); background: var(--green-l); }
  .task input[type=checkbox] { width: 24px; height: 24px; flex: none; accent-color: var(--green); }
  .task .body { flex: 1; min-width: 0; }
  .task .nm { font-weight: bold; }
  .task .nm a { color: inherit; text-decoration: none; }
  .task .fs { font-size: 12px; color: #444; }
  .task .fs b { font-weight: normal; color: var(--gray); }
  .task .warn { font-size: 11px; color: var(--orange-d); }
  .task .act { flex: none; display: flex; align-items: center; gap: 6px; }
  .qty { width: 64px; font-size: 16px; padding: 8px 6px; border: 1px solid #ccc; border-radius: 8px; text-align: right; font-family: inherit; }
  .done-btn { padding: 10px 14px; font-size: 15px; font-weight: bold; border-radius: 10px; border: none; background: var(--orange); color: #fff; cursor: pointer; white-space: nowrap; }
  .empty { text-align: center; padding: 30px 10px; color: var(--gray); }
  .bulkbar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 2px solid var(--green); padding: 10px 16px; display: flex; gap: 8px; align-items: center; justify-content: center; z-index: 6; box-shadow: 0 -4px 14px rgba(0,0,0,.08); }
  .bulkbar[hidden] { display: none; }
  .bulkbar .cnt { font-weight: bold; }
  .bulkbar button { padding: 12px 16px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; }
  .bulkbar .go { background: var(--orange); color: #fff; border: none; }
  .bulkbar .clear { background: #fff; border: 1px solid #ccc; color: #444; }

  /* 履歴 */
  .log { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }
  .log .body { flex: 1; min-width: 0; }
  .log .t { font-size: 12px; color: var(--gray); }
  .log.cancel { opacity: .6; }
  .del { flex: none; background: #fff; border: 1px solid var(--red); color: var(--red); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .filter button { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .filter button.on { background: var(--green); border-color: var(--green); color: #fff; }

  /* 一覧（計画担当） */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .btn-link { display: inline-block; background: #fff; border: 1px solid var(--green); color: var(--green); border-radius: 8px; padding: 6px 12px; text-decoration: none; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .plan-head { display: flex; gap: 12px; align-items: flex-start; }
  .qr { flex: none; text-align: center; }
  .qr svg { display: block; width: 96px; height: 96px; }
  .qr .id { font-size: 11px; color: var(--gray); font-family: monospace; }
  .name { font-weight: bold; font-size: 16px; }
  .meta { font-size: 13px; color: #444; }
  .steps { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13px; }
  .steps li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px dashed #e5e5e5; }
  .steps li .what { flex: 1; }
  .steps li .when { color: var(--gray); font-size: 12px; text-align: right; }
  .steps li.ng .what { color: #888; }
  .tag { display: inline-block; flex: none; font-size: 11px; font-weight: bold; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .tag.ok { background: #e1efe4; color: var(--green-d); }
  .tag.now { background: #fbe4d2; color: var(--orange-d); }
  .tag.ng { background: #eee; color: #888; }
  .open { display: block; text-align: center; margin-top: 10px; padding: 8px; border-radius: 8px; background: var(--green-l); text-decoration: none; font-weight: bold; }

  /* 進み具合のステップ表示（大項目ごと） */
  .stepper { display: flex; list-style: none; margin: 14px 0 4px; padding: 0; }
  .stepper li { flex: 1; position: relative; text-align: center; color: #999; font-size: 13px; }
  .stepper li::before { content: ""; position: absolute; z-index: 0; top: 16px; left: -50%; right: 50%; height: 4px; background: #ddd; }
  .stepper li:first-child::before { display: none; }
  .stepper li.done + li::before { background: var(--green); }
  .stepper .dot { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%;
    background: #fff; border: 3px solid #ccc; font-weight: bold; font-size: 15px; color: #999; }
  .stepper .lb { display: block; margin-top: 4px; font-weight: bold; }
  .stepper .ct { display: block; font-size: 11px; }
  .stepper li.done { color: var(--green); }
  .stepper li.done .dot { background: var(--green); border-color: var(--green); color: #fff; }
  .stepper li.part { color: var(--green-d); }
  .stepper li.part .dot { border-color: var(--green); color: var(--green); }
  .stepper li.now { color: var(--orange); }
  .stepper li.now .dot { border-color: var(--orange); color: var(--orange); box-shadow: 0 0 0 4px rgba(212, 131, 74, .15); }
  .stepper li.mine .lb { text-decoration: underline; text-underline-offset: 3px; }
  .stepper.small { margin: 12px 0 2px; }
  .stepper.small li { font-size: 12px; }
  .stepper.small li::before { top: 12px; height: 3px; }
  .stepper.small .dot { width: 28px; height: 28px; font-size: 13px; border-width: 2px; }

  /* 計画画面（QRを読んだとき） */
  .plan-card .badge { display: inline-block; font-family: monospace; font-size: 12px; background: var(--green-l); color: var(--green-d); border-radius: 6px; padding: 1px 8px; }
  .plan-card .name { font-size: 20px; margin: 6px 0 8px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; }
  .kv dt { color: var(--gray); }
  .kv dd { margin: 0; }
  .next { margin: 12px 0; padding: 12px 14px; background: var(--orange-l); border: 1px solid #ecc3a3; border-radius: 12px; font-size: 15px; color: var(--orange-d); }
  .next b { font-size: 17px; }
  .next .fdone { color: var(--gray); opacity: .7; }
  .next .flater { color: var(--orange-d); opacity: .75; }
  .next .farrow { margin: 0 6px; color: var(--orange); }
  .next.all { background: var(--green); border-color: var(--green); color: #fff; font-weight: bold; text-align: center; }
  .major { margin-top: 18px; }
  .major h2 { display: flex; justify-content: space-between; align-items: center; font-size: 16px; margin: 0 0 8px; }
  .major h2 .tag { font-size: 12px; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl > li { position: relative; padding: 0 0 10px 40px; }
  .tl > li::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 0; width: 3px; background: #ddd; }
  .tl > li:last-child::before { display: none; }
  .tl > li.done::before { background: var(--green); }
  .tl .mark { position: absolute; left: 0; top: 12px; width: 29px; height: 29px; border-radius: 50%; border: 3px solid #ccc; background: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 15px; box-sizing: border-box; }
  .tl li.done .mark { background: var(--green); border-color: var(--green); }
  .tl li.cur .mark { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(212, 131, 74, .15); }
  .tl .box { border-radius: 12px; padding: 12px 14px; background: #fff; border: 1px solid var(--line); }
  .tl li.done .box { background: var(--green-l); border-color: #cfe3d4; }
  .tl li.cur .box { border: 2px solid #ecc3a3; box-shadow: 0 2px 8px rgba(212, 131, 74, .10); }
  .tl li.todo .box { background: #fafafa; border-style: dashed; }
  .tl .t { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 17px; font-weight: bold; }
  .tl li.done .t { color: var(--green-d); }
  .tl li.todo .t { color: #777; }
  .tl .desc { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .tl .info { font-size: 13px; color: #333; margin-top: 4px; }
  .tl .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .tl .do { flex: 1; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: #fff; color: var(--green); border: 2px solid var(--green); }
  .tl li.cur .do { background: var(--orange); border-color: var(--orange); color: #fff; padding: 14px; font-size: 17px; }
  .tl .qty { width: 80px; padding: 12px 8px; }
  .tl .del { margin-top: 8px; }
  .short { color: #c62828; font-weight: bold; }
  .others { display: block; width: 100%; margin-top: 16px; padding: 10px; background: #fff; border: 1px dashed #bbb; border-radius: 10px; color: var(--gray); cursor: pointer; font-size: 14px; }

  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90%; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }

  /* 真ん中のポップアップ */
  #saving { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 30; }
  #saving[hidden] { display: none; }
  #saving.ok { background: rgba(0,0,0,.15); }
  #saving .box { background: #fff; border-radius: 18px; padding: 22px 28px 20px; min-width: 230px; max-width: 86%; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  #saving .spin { width: 46px; height: 46px; margin: 0 auto 14px; border: 5px solid var(--green-l); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
  #saving .mark { width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; color: #fff; background: var(--green); }
  #saving.err .mark { background: var(--red); }
  #saving .msg { font-size: 18px; font-weight: bold; }
  #saving .sub { font-size: 13px; color: var(--gray); margin-top: 6px; }
  #saving button { margin-top: 14px; font-size: 15px; padding: 8px 22px; border-radius: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  #saving button.undo { border-color: var(--red); color: var(--red); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 農薬散布（spray.js） */
  .sp { margin-bottom: 12px; }
  .sp h3 { margin: 0 0 8px; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--green-l); border: 1px solid #cfe3d4; border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 13px; }
  .chip small { color: var(--gray); }
  .chip button { border: none; background: none; font-size: 16px; color: var(--gray); cursor: pointer; padding: 0 4px; }
  .sub-btn { background: #fff; border: 1px solid var(--green); color: var(--green); border-radius: 8px; padding: 6px 12px; font-size: 14px; cursor: pointer; margin-top: 4px; }
  .picker { margin-top: 8px; border-top: 1px dashed #ddd; padding-top: 8px; max-height: 360px; overflow-y: auto; }
  .picker input[type=search] { width: 100%; font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
  .prow2 { display: flex; gap: 8px; align-items: center; padding: 6px 2px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .prow2 input { width: 22px; height: 22px; flex: none; accent-color: var(--green); }
  .prow { border-top: 1px dashed #e5e5e5; padding: 8px 0; }
  .prow:first-of-type { border-top: none; }
  .pline { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .pline select, .pline input { flex: 1; min-width: 0; font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; background: #fff; }
  .pline .muted { flex: none; max-width: 45%; }
  .x { flex: none; border: 1px solid #ccc; background: #fff; border-radius: 8px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; }
  .ck-line { font-size: 13px; padding: 2px 0; }
  .ck-line.ok { color: var(--green-d); }
  .ck-line.bad { color: var(--red); font-weight: bold; }
  .ck-line.warn, b.warn { color: var(--orange-d); }
  .fl { display: block; margin-top: 10px; font-size: 13px; color: var(--gray); }
  .fl input { display: block; width: 100%; font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; margin-top: 4px; font-family: inherit; color: #222; }
  .eq { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .eq button { flex: 1; min-width: 70px; padding: 10px 6px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-size: 15px; cursor: pointer; font-family: inherit; }
  .eq button.on { background: var(--green); border-color: var(--green); color: #fff; font-weight: bold; }
  label.ck { display: block; margin-top: 10px; font-size: 14px; line-height: 1.5; }
  label.ck input { width: 20px; height: 20px; vertical-align: -4px; accent-color: var(--green); }
  .overbox { background: #fbe9e9; border: 1px solid #e3b4b4; color: var(--red); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  table.ut { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.ut th, table.ut td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
  table.ut th { background: var(--green-l); }
</style>
</head>
<body>
<div id="app"></div>
<div class="bulkbar" id="bulkbar" hidden>
  <span class="cnt" id="bulk-cnt"></span>
  <button type="button" class="clear" id="bulk-clear">やめる</button>
  <button type="button" class="go" id="bulk-go">まとめて完了にする</button>
</div>
<div id="toast"></div>
<div id="saving" hidden><div class="box" id="saving-box"></div></div>

<script>
// QR から開いたときは ?id=QRID が付いている
const ID = new URLSearchParams(location.search).get('id') || '';
const PLANNER = '__all__';         // 計画担当（すべてを見る）
let server = null;                 // 窓口から受け取った最新の状態
let state = null;                  // 画面に出す状態（server に、まだ送り終わっていない記録を重ねたもの）
const queue = [];                  // 送る順番待ち（送信中のものも含む）
let sending = false;
let tab = '';                      // 今のタブ
let showAll = false;               // 計画画面で、自分の担当以外の工程も出すか
let logFilter = '';                // 履歴の絞り込み（大項目）
const picked = new Set();          // 一括登録で選んだ計画（QRID）
const qtyEdit = {};                // 手で直した数量（画面を描き直しても消えないように）

// ---------- 担当と名前（このスマホに覚えさせる） ----------
function load(k) { try { return localStorage.getItem('qrdemo.' + k) || ''; } catch (e) { return ''; } }
function save(k, v) { try { localStorage.setItem('qrdemo.' + k, v); } catch (e) {} }
function getName() { return load('person'); }
function getRole() { return load('role'); }
function isPlanner() { return getRole() === PLANNER; }
function majors() {
  const list = [];
  state.steps.forEach(s => { if (list.indexOf(s.major) < 0) list.push(s.major); });
  return list;
}
// 担当の一覧は「工程」シートの大項目から作る（大項目が増えれば担当も増える）
function roles() {
  return [{ key: PLANNER, label: '計画担当', desc: 'すべての計画・工程と、全員の履歴を見る' }]
    .concat(majors().map(m => {
      const names = state.steps.filter(s => s.major === m).map(taskName);
      const label = (names.length === 1 && names[0] === m ? m : names.join('・')) + '担当';
      return { key: m, label: label, desc: 'やること：' + names.join(' → ') };
    }))
    .concat(pestOn() ? [sprayRole()] : []);   // 農薬のシートがあれば「農薬散布担当」も（spray.js）
}
function roleLabel() { const r = roles().find(x => x.key === getRole()); return r ? r.label : ''; }
function myMajors() { return isPlanner() ? majors() : sprayMode() ? [] : [getRole()]; }
// 農薬散布（spray.js）を読めたか。読めなかったとき（置き忘れなど）は農薬の部分だけ出さず、ほかの画面は動かす
function hasSpray() { return typeof window.renderSpray === 'function'; }
function pestOn() { return !!(state && state.pest && hasSpray()); }
function sprayMode() { return hasSpray() && isSpray(); }

// ---------- 共通 ----------
function qrSvg(text) {
  try {
    const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
    return qr.createSvgTag({ cellSize: 3, margin: 2, scalable: true });
  } catch (e) { return '<div class="muted">QRを表示できません</div>'; }
}
function majorSteps(m) { return state.steps.filter(s => s.major === m); }
function isDone(plan, s) { return !!(plan.status[s.key] || {}).done; }
function majorProgress(plan, m) {
  const ss = majorSteps(m);
  return { done: ss.filter(s => isDone(plan, s)).length, total: ss.length };
}
function majorState(plan, m, nx) {
  const pr = majorProgress(plan, m);
  if (pr.done === pr.total) return 'done';
  if (nx && nx.major === m) return 'now';
  return pr.done > 0 ? 'part' : 'todo';
}
function stepperHtml(plan, small) {
  const nx = nextStep(plan), mine = myMajors();
  return `<ol class="stepper${small ? ' small' : ''}">` + majors().map((m, i) => {
    const st = majorState(plan, m, nx), pr = majorProgress(plan, m);
    return `<li class="${st}${!isPlanner() && mine.includes(m) ? ' mine' : ''}"><span class="dot">${st === 'done' ? '✓' : i + 1}</span><span class="lb">${esc(m)}</span>
      <span class="ct">${st === 'done' ? '完了' : pr.done + ' / ' + pr.total}</span></li>`;
  }).join('') + '</ol>';
}
function nextStep(plan) { return state.steps.find(s => !isDone(plan, s)); }
function nextIn(plan, m) { return majorSteps(m).find(s => !isDone(plan, s)); }
function taskName(s) { return s.minor.replace(/\s*完了$/, '') || s.minor; }
function fullTask(s, sep) { const t = taskName(s); return t === s.major ? t : s.major + sep + t; }
function nextFlowHtml(plan, nx) {
  return majorSteps(nx.major).map(s => {
    if (s.key === nx.key) return '<b>' + esc(taskName(s)) + '</b>';
    const done = isDone(plan, s);
    return '<span class="' + (done ? 'fdone' : 'flater') + '">' + (done ? '✓' : '') + esc(taskName(s)) + '</span>';
  }).join('<span class="farrow">→</span>');
}
function planName(p) { return p.v['品番'] + ' ' + p.v['品目'] + ' ' + p.v['品種']; }
// 担当の大項目で見る計画の列：工程シートの「色を付ける列」＋ 大項目の名前で始まる列。2つ目以降の大項目はポットの大きさ・色も
function majorFields(m) {
  const cols = [];
  majorSteps(m).forEach(s => (s.colorCols || []).forEach(c => { if (!cols.includes(c)) cols.push(c); }));
  const sample = state.plans[0] ? Object.keys(state.plans[0].v) : [];
  // 自動で書く工程の列（小項目の名前・「完了」を取った名前）と「次の作業」の列は、計画の情報ではないので出さない
  const auto = ['次の作業'];
  state.steps.forEach(s => { auto.push(s.minor, taskName(s)); if (s.qtyCol) auto.push(s.qtyCol); });
  sample.forEach(c => { if (c.indexOf(m) === 0 && !cols.includes(c) && !auto.includes(c)) cols.push(c); });
  if (majors().indexOf(m) > 0) ['Pサイズ', 'P色'].forEach(c => { if (sample.includes(c) && !cols.includes(c)) cols.push(c); });
  return cols;
}
// その大項目の予定日の列（「色を付ける列」のうち、名前が「日」で終わる最初の列）
function dateCol(m) {
  return majorFields(m).find(c => /日$/.test(c)) || '';
}
function fieldsHtml(plan, m) {
  return majorFields(m).filter(c => c !== dateCol(m)).map(c => `<b>${esc(c)}</b> ${esc(plan.v[c])}`).join('　');
}
function defaultQty(plan, s) {
  if (qtyEdit[plan.id + '|' + s.key] !== undefined) return qtyEdit[plan.id + '|' + s.key];
  return s.compare && plan.v[s.compare] !== undefined ? plan.v[s.compare] : '';
}
function bindQty(list) {
  document.querySelectorAll('[data-qty]').forEach(el => el.oninput = () => {
    const x = list(el.dataset.qty);
    if (x) qtyEdit[x.p.id + '|' + x.s.key] = el.value;
  });
}
// 予定との過不足（HTML）。予定を下回っていたら赤
function diffText(plan, step, qty) {
  if (!step.compare || plan.v[step.compare] === undefined || qty === '' || qty == null) return '';
  const d = Math.round((Number(qty) - Number(plan.v[step.compare])) * 10) / 10;
  const t = '（予定' + plan.v[step.compare] + '、過不足 ' + (d > 0 ? '+' : '') + d + '）';
  return d < 0 ? '<span class="short">' + esc(t) + '</span>' : esc(t);
}
function isShortQty(plan, step, qty) {
  if (!step.compare || qty === '' || qty == null) return false;
  const want = Number(plan.v[step.compare]);
  return !isNaN(want) && want > 0 && Number(qty) < want;
}
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.className = ''; }, 2600);
}
// 真ん中のポップアップ。kind：wait／ok（少しして消える。取り消しボタン付き）／err。引数なしで閉じる
function popup(kind, msg, sub, onUndo) {
  const el = document.getElementById('saving');
  clearTimeout(popup.timer);
  if (!kind) { el.hidden = true; return; }
  el.className = kind;
  document.getElementById('saving-box').innerHTML =
    (kind === 'wait' ? '<div class="spin"></div>' : '<div class="mark">' + (kind === 'ok' ? '✓' : '✕') + '</div>') +
    '<div class="msg">' + esc(msg) + '</div>' + (sub ? '<div class="sub">' + esc(sub).replace(/\n/g, '<br>') + '</div>' : '') +
    (kind === 'err' ? '<button type="button" id="pop-close">閉じる</button>' : '') +
    (kind === 'ok' && onUndo ? '<button type="button" class="undo" id="pop-undo">まちがえた（取り消す）</button>' : '');
  el.hidden = false;
  const c = document.getElementById('pop-close'); if (c) c.onclick = () => popup();
  const u = document.getElementById('pop-undo'); if (u) u.onclick = () => { popup(); onUndo(); };
  if (kind === 'ok') { el.onclick = e => { if (e.target === el) popup(); }; popup.timer = setTimeout(() => popup(), onUndo ? 2600 : 1200); }
}

// ---------- 送信（押したらすぐ画面に反映し、裏で送る） ----------
function rebuild() {
  state = JSON.parse(JSON.stringify(server));
  if (!state.logs) state.logs = [];
  const name = getName();
  queue.forEach(job => {
    if (job.type !== 'record' || job.cancel) return;
    job.items.forEach(it => {
      const plan = state.plans.find(p => p.id === it.id);
      if (plan) plan.status[it.major + '／' + it.minor] = { done: true, time: '送信中…', person: name, qty: it.qty, pending: true };
    });
  });
}
function syncBadge() {
  const n = queue.filter(j => j.type === 'record' && !j.cancel).reduce((a, j) => a + j.items.length, 0);
  const b = document.getElementById('sync');
  if (b) { b.hidden = !n; b.textContent = '送信中 ' + n + '件'; }
}
function enqueue(job) {
  queue.push(job);
  rebuild(); render(); syncBadge();
  pump();
  return job;
}
async function pump() {
  if (sending || !queue.length) return;
  sending = true;
  const job = queue[0];
  try {
    if (job.type === 'record' && !job.cancel) {
      const s = await postApi({ action: 'recordMany', items: job.items, person: getName() });
      server = s; job.created = s.created || [];
      if (job.cancel) {  // 送っている間に「取り消す」が押された
        server = await postApi({ action: 'delete', logIds: job.created, person: getName(), planner: isPlanner() });
      }
    } else if (job.type === 'delete') {
      server = await postApi({ action: 'delete', logIds: job.logIds, person: getName(), planner: isPlanner() });
    }
    queue.shift();
    if (job.done) job.done();
  } catch (e) {
    queue.shift();
    popup('err', job.type === 'delete' ? '消せませんでした' : '記録できませんでした', e.message + (job.type === 'record' ? '\nもう一度押してください' : ''));
    try { server = await fetchState(); } catch (e2) {}
  }
  sending = false;
  rebuild(); render(); syncBadge();
  pump();
}
// 記録する（items：[{id, major, minor, qty}]）。押した瞬間に完了の表示にして、取り消しボタン付きの ✓ を出す
function complete(items, label) {
  if (!items.length) return;
  const job = enqueue({ type: 'record', items: items.map(it => Object.assign({ op: '完了' }, it)) });
  popup('ok', label, items.length > 1 ? items.length + '件をまとめて記録しました' : '', () => undo(job));
}
function undo(job) {
  if (queue[0] === job && sending) { job.cancel = true; toast('取り消しています…'); }
  else if (queue.includes(job)) { queue.splice(queue.indexOf(job), 1); toast('取り消しました'); }
  else if (job.created && job.created.length) { enqueue({ type: 'delete', logIds: job.created, done: () => toast('取り消しました') }); }
  rebuild(); render(); syncBadge();
}
function removeLogs(ids, what) {
  if (!confirm(what + '\nこの記録を消しますか？（実績シートからも消えます）')) return;
  popup('wait', '消しています…');
  enqueue({ type: 'delete', logIds: ids, done: () => popup('ok', '消しました') });
}
function refresh() {
  if (queue.length || !document.getElementById('saving').hidden) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;  // 入力中は描き直さない
  fetchState().then(s => { server = s; rebuild(); render(); }).catch(() => {});
}

// ---------- 画面：はじめに（担当と名前の登録） ----------
function renderSetup() {

      <div class="roles">${roles().map(r => `<button type="button" class="role${r.key === role ? ' sel' : ''}" data-role="${esc(r.key)}">${esc(r.label)}<small>${esc(r.desc)}</small></button>`).join('')}</div>
      <label class="field">名前（記録に残ります）<input id="nm" type="text" autocomplete="name" value="${esc(getName())}" placeholder="例：たかべ"></label>
      <button type="button" class="primary" id="go" disabled>はじめる</button>

// 上の帯：題名の下に「担当・名前」。右に「一覧へ」「担当を変える」
function headerHtml(sub, back) {
  return `<header><div style="min-width:0"><h1>QR一元管理${sub ? '<span style="font-size:12px;font-weight:normal">　' + esc(sub) + '</span>' : ''}</h1>
      <div class="sub">${esc(roleLabel())}・${esc(getName())}</div></div>
    <span id="sync" hidden></span>
    <div style="display:flex;gap:6px;flex:none">${back ? `<a href="${esc(APP_URL)}">一覧へ</a>` : ''}<button type="button" class="hbtn" id="chg">担当を変える</button></div></header>`;

// ---------- 画面：担当者のホーム（やること・終わった） ----------
function todoList(m) {
  const col = dateCol(m);
  return state.plans.map(p => ({ p, s: nextIn(p, m) })).filter(x => x.s)
    .map(x => Object.assign(x, { key: (x.p.w[col] || x.p.v[col] || '') }))
    .sort((a, b) => a.key < b.key ? -1 : a.key > b.key ? 1 : a.p.id < b.p.id ? -1 : 1);
}
function todayKey() { const d = new Date(); return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0'); }
function renderWorker() {
  const m = getRole();
  const list = todoList(m);
  const mineLogs = state.logs.filter(l => l.major === m && l.person === getName() && l.canDelete);
  if (!tab) tab = 'todo';
  let body = '';
  if (tab === 'todo') {
    const groups = [];
    list.forEach(x => { const g = groups[groups.length - 1]; if (g && g.key === x.key) g.items.push(x); else groups.push({ key: x.key, items: [x] }); });
    const today = todayKey();
    body = groups.map(g => {
      const k = g.key.slice(0, 5);
      const when = !k ? '' : k < today ? '<span class="when late">予定日を過ぎています</span>' : k === today ? '<span class="when today">今日</span>' : '';
      return `<div class="day"><h3>${esc(g.key || '予定日なし')}${when}<span class="muted">　${g.items.length}件</span></h3>
        <button type="button" class="selall" data-day="${esc(g.key)}">全部選ぶ</button></div>` +
        g.items.map(({ p, s }) => {
          const prev = majors().slice(0, majors().indexOf(m)).find(mm => majorProgress(p, mm).done < majorProgress(p, mm).total);
          return `<div class="task${picked.has(p.id) ? ' picked' : ''}" data-row="${esc(p.id)}">
            <input type="checkbox" data-pick="${esc(p.id)}"${picked.has(p.id) ? ' checked' : ''} aria-label="選ぶ">
            <div class="body"><div class="nm"><a href="${esc(planUrl(p.id))}">${esc(planName(p))}</a> <span class="muted">${esc(p.id)}</span></div>
              <div class="fs">${fieldsHtml(p, m)}</div>
              ${prev ? `<div class="warn">※ 前の工程（${esc(prev)}）が未記録</div>` : ''}</div>
            <div class="act">${s.needQty ? `<input class="qty" type="number" inputmode="decimal" step="any" data-qty="${esc(p.id)}" value="${esc(defaultQty(p, s))}" aria-label="数量">` : ''}
              <button type="button" class="done-btn" data-do="${esc(p.id)}">${majorSteps(m).length > 1 ? esc(taskName(s)) + '<br>' : ''}完了</button></div>
          </div>`;
        }).join('');
    }).join('') || '<div class="empty">✓ やることはありません</div>';
  } else {
    body = (mineLogs.length ? mineLogs.map(logHtml).join('') : '<div class="empty">24時間以内のあなたの記録はありません</div>') +
      '<p class="muted">押しまちがえた記録は、24時間以内なら「消す」で消せます。それより前の記録は計画担当に連絡してください。</p>';
  }
  document.getElementById('app').innerHTML = headerHtml('', false) + `
    <main style="max-width:720px">
      <div class="tabs"><button type="button" data-tab="todo" class="${tab === 'todo' ? 'on' : ''}">やること<span class="n">${list.length}</span></button>
        <button type="button" data-tab="mine" class="${tab === 'mine' ? 'on' : ''}">自分の記録（24時間）</button></div>
      ${body}
      <p class="muted">最終更新 ${esc(state.updated)}。QRを読むと、その計画の画面が開きます。</p>
    </main>`;
  bindHeader();
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.querySelectorAll('[data-pick]').forEach(c => c.onchange = () => { c.checked ? picked.add(c.dataset.pick) : picked.delete(c.dataset.pick); render(); });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    const ids = list.filter(x => x.key === b.dataset.day).map(x => x.p.id);
    const all = ids.every(id => picked.has(id));
    ids.forEach(id => all ? picked.delete(id) : picked.add(id));
    render();
  });
  document.querySelectorAll('[data-do]').forEach(b => b.onclick = () => {
    const x = list.find(y => y.p.id === b.dataset.do);
    const item = itemFor(x.p, x.s);
    if (item) { picked.delete(x.p.id); complete([item], '「' + taskName(x.s) + '」完了'); }
  });
  bindDelete();
  bindQty(id => list.find(y => y.p.id === id));
  // 一括登録のバー
  const ids = [...picked].filter(id => list.some(x => x.p.id === id));
  picked.forEach(id => { if (!ids.includes(id)) picked.delete(id); });
  const bar = document.getElementById('bulkbar');
  bar.hidden = !(tab === 'todo' && ids.length);
  document.getElementById('bulk-cnt').textContent = ids.length + '件を選択中';
  document.getElementById('bulk-clear').onclick = () => { picked.clear(); render(); };
  document.getElementById('bulk-go').onclick = () => {
    const items = [];
    for (const id of ids) { const x = list.find(y => y.p.id === id); const it = itemFor(x.p, x.s); if (!it) return; items.push(it); }
    picked.clear();
    complete(items, items.length + '件を完了にしました');
  };
}
// 1件分の記録。数量が要る工程は、行の入力欄の数（最初は予定の数）を使う

  let qty = '';
  if (s.needQty) {
    const el = document.querySelector('[data-qty="' + CSS.escape(p.id) + '"]');
    qty = el ? el.value : defaultQty(p, s);
    if (qty === '' || isNaN(Number(qty))) { toast(planName(p) + '：数量を入れてください', true); return null; }
  }
  return { id: p.id, major: s.major, minor: s.minor, qty: qty };
}
function logHtml(l) {

// ---------- 画面：計画画面（QRを読んだとき） ----------
function renderPlan(plan) {
  const nx = nextStep(plan), mine = myMajors();
  const shown = isPlanner() || showAll ? majors() : mine;
  const sections = shown.map(m => {
    const st = majorState(plan, m, nx), pr = majorProgress(plan, m);
    const head = st === 'done' ? '<span class="tag ok">完了</span>' : st === 'now' ? '<span class="tag now">作業中</span>' : '<span class="tag ng">' + pr.done + ' / ' + pr.total + '</span>';
    const firstOpen = nextIn(plan, m);
    const items = majorSteps(m).map(s => {
      const r = plan.status[s.key] || {};
      if (r.done) {
        let info = esc(r.time) + (r.person ? '　' + esc(r.person) : '');
        if (r.qty !== '' && r.qty != null) info += '　' + esc(r.qty) + esc(s.unit) + diffText(plan, s, r.qty);
        const log = state.logs.find(l => l.id === plan.id && l.major === s.major && l.minor === s.minor && l.op === '完了');
        const del = log && log.canDelete && (isPlanner() || log.person === getName())
          ? `<button type="button" class="del" data-del="${esc(log.logId)}">まちがえた（消す）</button>` : '';
        return `<li class="done"><span class="mark">✓</span><div class="box">
          <div class="t">${esc(taskName(s))}<span class="tag ok">完了</span></div><div class="info">${info}</div>${del}</div></li>`;
      }
      const isCur = firstOpen && firstOpen.key === s.key;
      return `<li class="${isCur ? 'cur' : 'todo'}"><span class="mark"></span><div class="box">
        <div class="t">${esc(taskName(s))}${isCur ? '<span class="tag now">次の作業</span>' : '<span class="tag ng">未完了</span>'}</div>
        <div class="desc">${esc(s.note)}</div>
        <div class="row">${s.needQty ? `<input class="qty" type="number" inputmode="decimal" step="any" data-qty="${esc(plan.id)}" value="${esc(defaultQty(plan, s))}" aria-label="数量（${esc(s.unit)}）">` : ''}
          <button type="button" class="do" data-step="${esc(s.key)}">${esc(taskName(s))}を完了にする</button></div></div></li>`;
    }).join('');
    return `<section class="major"><h2>${esc(m)}${head}</h2>
      ${isPlanner() ? '' : `<div class="fs muted" style="margin:-4px 0 8px">${fieldsHtml(plan, m)}${dateCol(m) ? '　<b>予定日</b> ' + esc(plan.w[dateCol(m)] || plan.v[dateCol(m)]) : ''}</div>`}
      <ol class="tl">${items}</ol></section>`;
  }).join('');
  const kv = isPlanner() || showAll ? `
          <dt>ポット</dt><dd>${esc(plan.v['Pサイズ'])}　${esc(plan.v['P色'])}</dd>
          <dt>出荷</dt><dd>${esc(plan.v['出荷先'])}　${esc(plan.v['出荷日'])}　${esc(plan.v['出荷TR数'])}TR</dd>
          <dt>播種</dt><dd>${esc(plan.v['播種予定日'])}　${esc(plan.v['播種トレイ'])} × ${esc(plan.v['播種TR数'])}</dd>
          <dt>土入れ</dt><dd>${esc(plan.v['ポット使用日'])}　${esc(plan.v['ポット使用TR数'])}TR</dd>
          <dt>鉢上げ</dt><dd>${esc(plan.v['鉢上予定日'])}　${esc(plan.v['鉢上予定TR数'])}TR</dd>` : '';
  document.getElementById('app').innerHTML = headerHtml('', true) + `
    <main style="max-width:560px">
      <div class="card plan-card">
        <span class="badge">${esc(plan.id)}</span>
        <div class="name">${esc(planName(plan))}</div>
        ${kv ? `<dl class="kv">${kv}</dl>` : ''}
      </div>
      ${stepperHtml(plan, false)}
      ${isPlanner() ? `<div class="next ${nx ? '' : 'all'}">${nx ? '次の作業：' + nextFlowHtml(plan, nx) : '✓ すべての工程が完了しました'}</div>` : ''}
      ${sprayMode() ? pestHistoryHtml(plan) : ''}
      ${sections}
      ${isPlanner() ? '' : `<button type="button" class="others" id="others">${showAll ? '自分の担当だけにする' : 'ほかの工程も見る'}</button>`}
      ${sprayMode() || !hasSpray() ? '' : pestHistoryHtml(plan)}
    </main>`;
  bindHeader();
  document.getElementById('bulkbar').hidden = true;
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    const s = state.steps.find(x => x.key === b.dataset.step);
    const item = itemFor(plan, s);
    if (item) complete([item], '「' + taskName(s) + '」完了');
  });
  const o = document.getElementById('others'); if (o) o.onclick = () => { showAll = !showAll; render(); };
  bindDelete();
  if (hasSpray()) bindPest(plan);
  bindQty(id => { const s = state.steps.find(x => x.needQty && nextIn(plan, x.major) === x); return s ? { p: plan, s } : null; });
}

// ---------- 画面の切り替え ----------
function render() {
  if (!getName() || !roles().some(r => r.key === getRole())) return renderSetup();
  if (ID) {
    const plan = state.plans.find(p => p.id === ID);
    if (plan) return renderPlan(plan);
    document.getElementById('app').innerHTML = headerHtml('', true) + `<main><div class="card">この QR（${esc(ID)}）の計画が見つかりません。</div></main>`;
    return bindHeader();
  }
  isPlanner() ? renderPlanner() : sprayMode() ? renderSpray() : renderWorker();
}
function showMessage(msg) {
  document.getElementById('app').innerHTML = `<header><h1>QR一元管理</h1></header><main><div class="card">${esc(msg)}</div></main>`;
}
showMessage('読み込んでいます…');
fetchState()
  .then(s => { server = s; if (!server.logs) server.logs = []; rebuild(); render(); setInterval(refresh, 15000); })
  .catch(e => showMessage(e.message));
</script>
<script src="spray.js"></script>
</body>
</html>
